uv.ptech.spikes=Hřebový Pás
uv.ptech.spikes.short=HŘEB.PÁS
uv.ptech.spikes.desc=Hřebový Pásy nasazené ze zadní části vozidla se rychle rozšiřují, aby poškodily pneumatiky každého auta, které po nich projíždí, a pokud se jim nelze vyhnout, mohou zasáhnout více vozidel.

uv.ptech.spikes.activated=HŘEBOVÝ PÁS NASAZEN

uv.ptech.spikes.tiresreinflate=PNEUMATIKY NAFOUKNUTY

uv.ptech.shockram=Šokový Nárazník
uv.ptech.shockram.short=SHRAM
uv.ptech.shockram.desc=Nárazový beranidlo vytváří z přední části vozidla zvukovou rázovou vlnu, která odstrkuje a poškozuje všechna auta, která zachytí.

uv.ptech.shockram.activated=ŠOKOVÝ NÁRAZNÍK NASAZEN
uv.ptech.shockram.hit=Trefili jste %s šokovým Nárázníkem
uv.ptech.shockram.hit.you=%s vás trefil šokovým Nárazníkem

uv.ptech.gpsdart=GPS Šipka
uv.ptech.gpsdart.short=GPS
uv.ptech.gpsdart.desc=GPS Šipka je systém označování vozidel spuštěný z přední části vozidla, který označuje, sleduje a lokalizuje prchající vozidlo.

uv.ptech.gpsdart.activated=GPS ŠIPKA NASAZENA
uv.ptech.gpsdart.missed=GPS ŠIPKA MINULA

uv.ptech.gpsdart.hit=Trefil jste %s pomocí GPS šipky
uv.ptech.gpsdart.hit.you=%s trefil tě GPS šipkou

uv.ptech.expbarrel=Explozivní Barel

