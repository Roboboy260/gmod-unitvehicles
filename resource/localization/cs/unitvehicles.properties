# Stats
uv.ptech.duration=Délka
uv.ptech.duration.desc=Jak dlouho Stíhací Technika trvá.

uv.ptech.power=Síla
uv.ptech.power.desc=Jak moc síly Stíhací Technika má.

uv.ptech.damage=Poškození na zásah
uv.ptech.damage.desc=Znásobí, kolik poškození je řešeno při zásahu.\nNastav na 1 pro úplné poškození.

uv.ptech.damagecommander=Velitel poškození na zásah
uv.ptech.damagecommander.desc=Znásobí, jak velká škoda bude při zásahu Velitele řešena.\nNastav na 1 pro úplné poškození.

uv.ptech.cooldown=Čas Skrývání
uv.ptech.cooldown.desc=Za jak dlouho bude možné tuto Stíhací Techniku znovu použít.

uv.ptech.maxammo=Číslo nabití
uv.ptech.maxammo.desc=Kolikrát může být tato Stíhací Technika použita, než dojde.\nNastav na 0 pro nekonečné použití.

uv.ptech.maxdistance=Rozsah
uv.ptech.maxdistance.desc=Jak blízko může být cíl, aby se tato Stíhací Technika aktivovala.\nMěřeno v jednotkách Hammer Units.

uv.ptech.force=Síla
uv.ptech.force.desc=Kolik síly se aplikuje při dopadu na cíl.

uv.ptech.lockontime=Zaměřuj na čas
uv.ptech.lockontime.desc=Jak dlouho bude trvat, než se tato Stíhací Technika zaměří na svůj cíl.

uv.ptech.disableduration=Zakázat dobu trvání
uv.ptech.disableduration.desc=Jak dlouho vozidla zasažená touto Stíhací Technika zůstávají vyřazena z provozu.

# uv.ptech.length=Length
# uv.ptech.length.desc=How long is the Pursuit Tech constraint.

# uv.ptech.strength=Strength
# uv.ptech.strength.desc=How strong is the Pursuit Tech constraint.

# Shared
uv.ptech.emp=Elektromagnetický Puls
# uv.ptech.emp.short=EMP
uv.ptech.emp.desc=Elektromagnetický Puls (EMP) cíle a zaměřuje se na auta vpředu, než dodají obrovský elektrostatický puls, který dočasně vypne jejich elektrické systémy.

uv.ptech.emp.activated=EMP ACTIVOVÁNO
uv.ptech.emp.lockingon=EMP ZAMĚŘUJU SE
uv.ptech.emp.missed=EMP MINULA
uv.ptech.emp.dodged=EMP VYHNUT
uv.ptech.emp.notarget=ŽÁDNÝ PLATNÝ CÍL EMP

uv.ptech.emp.hit=Trefil jsi %s s EMP
uv.ptech.emp.hit.you=%s Trefil tě s EMP

uv.ptech.esf=Elektrostatické Pole
# uv.ptech.esf.short=ESF
uv.ptech.esf.desc=Elektrostatické Pole (ESF) nabíjí střed vašeho vozu silným statickým polem, které ho chrání před omračujícími minami a EMP zaměřovači, a trefí silný šok pro každého, kdo se ho dotkne.

uv.ptech.esf.activated=ESF ACTIVOVÁNO
uv.ptech.esf.hit=Trefil %s s ESF
uv.ptech.esf.hit.you=%s Trefil tě ESF

uv.ptech.repairkit=Opravovací Kit
uv.ptech.repairkit.short=OP.KIT
uv.ptech.repairkit.desc=Opravovací Kit nasadí palubní opravárenský systém, který aktivuje rychlou opravu pole pro vaše vozidlo. Auto-opravovací Modul, navržený s ohledem na nouzovou reakci a taktickou mobilitu, obnovuje konstrukční integritu vozidla pomocí vestavěných samotěsnících součástek a zesílených hydraulických systémů.

uv.ptech.repairkit.activated=OPRAVOVACÍ KIT NASAZEN

# Racers Only
uv.ptech.jammer=Rušička
uv.ptech.jammer.short=RUŠIČKA
uv.ptech.jammer.desc=Rušička obklopuje váš vůz dočasným polem, které je chrání před zásahy technik, a narušuje HUD ostatních řidičů v okolí bránících použití Stíhací Techniky.

uv.ptech.jammer.activated=RUŠIČKA AKTIVOVÁNA
uv.ptech.jammer.hit.you=ZRUŠEN

uv.ptech.shockwave=Šoková Vlna
# uv.ptech.shockwave.short=SHWAV
uv.ptech.shockwave.desc=Šoková Vlna vytváří ze středu vozu zvukový nárazový výbuch, který odstrkuje a poškodí všechna vozidla v okolí.

uv.ptech.shockwave.activated=ŠOKOVÁ VLNA AKTIVOVÁNA
uv.ptech.shockwave.hit=Trefil %s jsi s Šokovanou Vlnou
uv.ptech.shockwave.hit.you=%s Trefil tě s Šokovanou Vlnou

uv.ptech.stunmine=Omračovací Mina
uv.ptech.stunmine.short=OM.MINA
uv.ptech.stunmine.desc=Omračovací Mina jsou nasazeny za vaším vozem, který při srážce s přetížením způsobí poškození a ztrátu kontroly elektrických systémů vozidla.

uv.ptech.stunmine.activated=OMRAČOVACÍ MINA NASAZENA
uv.ptech.stunmine.hit=Trefils %s jsi Omračovací Minou
uv.ptech.stunmine.hit.you=%s Trefil tě s Omračovací Minou!

# uv.ptech.powerplay=Powerplay
# uv.ptech.powerplay.short=PWR
uv.ptech.powerplay.desc=Aktivace Powerplay spustí nejbližší Pursuit Breaker k řidiči a donutí ho ke kolapsu.

uv.ptech.powerplay.activated=POWERPLAY AKTIVOVÁNO
uv.ptech.powerplay.nopb=ŽÁDNÉ BLÍZKÁ PAST NA POLICII

# uv.ptech.juggernaut=Juggernaut
# uv.ptech.juggernaut.short=JUGG
uv.ptech.juggernaut.desc=Juggernaut masivně zvyšuje razantní sílu vašeho vozidla, což usnadňuje prorážení rekvizit a blokování vozidel.

uv.ptech.juggernaut.activated=JUGGERNAUT AKTIVOVÁN

# uv.ptech.ghost=Ghost
# uv.ptech.ghost.short=GHST
# uv.ptech.ghost.desc=Activating Ghost makes the driver's vehicle non-collidable with props and other vehicles.

# uv.ptech.ghost.activated=GHOST ACTIVATED

# Units Only
uv.ptech.killswitch=ELE.VYPÍNAČ
uv.ptech.killswitch.short=VYPÍNAČ
uv.ptech.killswitch.desc=Ele.Vypínač zaměřuje auta vpředu, než dodá obrovský elektrostatický puls, který dočasně vypne jejich elektrické systémy.

uv.ptech.killswitch.activated=ELE.VYPÍNAČ AKTIVOVÁN
uv.ptech.killswitch.lockingon=ELE.VYPÍNAČ ZAMĚŘUJE SE
uv.ptech.killswitch.dodged=ELE.VYPÍNAČ VYHNUT
uv.ptech.killswitch.hit=Trefil jsi %s s Ele.Vypínačem
uv.ptech.killswitch.hit.you=%s Trefil tě s Ele.Vypínačem

uv.ptech.killswitch.engine.on=MOTOR RESETOVÁN
uv.ptech.killswitch.getclose=MUSÍŠ BÝT BLÍZKO S ELE.VYPÍNAČEM
uv.ptech.killswitch.novalid=ŽÁDNÝ PLATNÝ CÍL S ELE.VYPÍNAČEM

# uv.ptech.skyhammer=Skyhammer
# uv.ptech.skyhammer.lockingon=SKYHAMMER LOCKING ON
