uvsub.default.cop10.aggressive.temp_(2)=Let's get a 10-63 and move into position! Give me some room and stand by!
uvsub.default.cop10.aggressive.temp_(3)=Watch out everyone, I'm gonna ram the vehicle!
uvsub.default.cop10.aggressive.temp_part2_(2)=Alright, let's move into position! Give me some room and stand back!
uvsub.default.cop10.aggressive.temp_part2_(3)=I'm moving in to ram the target - everyone, be careful!
uvsub.default.cop10.aggressive.temp_part3_(2)=Alright, all cover - 10-63; I repeat, 10-63! 10-6-3!
uvsub.default.cop10.aggressive.temp_part3_(3)=Out of my way, I'm gonna disable this douchebag.
uvsub.default.cop10.aggressive.temp_part4_(3)=I'm gonna give this guy a lil' shove just so he can spin out!
uvsub.default.cop10.aggressive.temp_part5_(2)=Alright everyone, let's warm up on his six! Don't do anything to him, let's see what he does next!
uvsub.default.cop10.aggressive.temp_part5_(3)=Clear out the way for me, I'm gonna try to hit him!
uvsub.default.cop10.aggressive.temp_part5=Hold position! Do not lose him! Hold position!
uvsub.default.cop10.aggressive.temp_part6=I cannot have you guys falling back, hold position!
uvsub.default.cop10.aggressive.temp_part7_(2)=Alright guys, slow down and cover the rear - let's make him think we're dropping out!
uvsub.default.cop10.aggressive.temp_part7_(3)=I'm gonna try and ram this guy off the road - break on my call.
uvsub.default.cop10.aggressive.temp_part7=Let's get right back on him and take him out!
uvsub.default.cop10.aggressive.temp_part9_(2)=Let's get around this guy and form a 10-75, pronto!
uvsub.default.cop10.aggressive.temp_part9_(3)=Everyone, fall back - I'm gonna take him out!
uvsub.default.cop10.aggressive.temp_part9=Maintain position, maintain position - we're gonna try that again!
uvsub.default.cop10.aggressive.temp_part10_(2)=Here we go - slowing him down.
uvsub.default.cop10.aggressive.temp_part11_(2)=Alright, we're gonna have to slow him down. Everyone, form up and do a 10-75 - don't let him get around you.
uvsub.default.cop10.aggressive.temp_part11_(3)=Get ready to jump in, I'm spinning him out!
uvsub.default.cop10.aggressive.temp_part11=Everyone, fall back, he's onto us - let's come up with a new strat.
uvsub.default.cop10.aggressive.temp_part13_(2)=Gotta get in front of him and slow him down - make sure to stay with him.
uvsub.default.cop10.aggressive.temp_part13_(3)=Heads up, heads up! We're gonna knock him out!
uvsub.default.cop10.aggressive.temp_part14=Alright guys, let's stand by here - fall back and stand by.
uvsub.default.cop10.aggressive.temp_part15_(2)=Alright cover, let's get in front of him. Let's make sure to do it by the numbers, eh?
uvsub.default.cop10.aggressive.temp_part16_(2)=Alright cover, let's get in front of him and do a block! Now let's make sure to do it by the numbers, okay?
uvsub.default.cop10.aggressive.temp_part17=Don't give him any time to breathe!
uvsub.default.cop10.aggressive.temp_part18=Alright guys, let's do this - no leaving space for him!
uvsub.default.cop10.aggressive.temp_part19_(2)=On my mark - 10-65 when you're ready!
uvsub.default.cop10.aggressive.temp_part21=Alright everyone, slow down - we're gonna box him in, follow my lead.
uvsub.default.cop10.aggressive.temp_part23=Don't leave any holes for him to slip through, let's box him in, alright?
uvsub.default.cop10.aggressive.temp_part25=Stand by for a 10-82 - if he passes you, just nail him to the wall!
uvsub.default.cop10.aggressive.temp_part28=On my mark I want you to pass him and hold him on his point!
uvsub.default.cop10.aggressive.temp_part30=Get on his point and hold it - let's do that "rolling chicane" thingy. We have to nail him when he tries to get by!
uvsub.default.cop10.aggressive.temp_part33=Listen, if you guys got an opening, make sure to do a 10-39; I repeat, 10-39!
uvsub.default.cop10.aggressive.temp_part35=Let's do a 10-39 - if you see him spinning, then make sure to take the chance and bust him!

uvsub.default.cop10.arrest.temp=Code 4; I repeat, Code 4 - cancel all cover, we got him.
uvsub.default.cop10.arrest.temp_part2=Code 4; I repeat, Code 4 - cancel all cover, we got him.
uvsub.default.cop10.arrest.temp_part3=Dispatch, cancel tone alert - we got suspect under arrest. We won't need any help here, Dispatch.
uvsub.default.cop10.arrest.temp_part5=All units, stand down - Code 6 vehicle has been stopped. We got him.
uvsub.default.cop10.arrest.temp_part6=If they can't do the time, they better not do the crime - am I right, lads?
uvsub.default.cop10.arrest.temp_part7=Ladies and gentlemen of the police department - we got him!
uvsub.default.cop10.arrest.temp_part8=Suspect apprehend and currently in the back of my cruiser - crying... ha-ha-ha!
uvsub.default.cop10.arrest.temp_part9=These guys burn through their cars better if they wanna get away from us, am I right?
uvsub.default.cop10.arrest.temp_part10=Dispatch, whatever they're driving, did not help them at all - Code 4, we got him.
uvsub.default.cop10.arrest.temp_part11=WE GOT HIM! WE GOT HIM!
uvsub.default.cop10.arrest.temp_part12=Great work, guys - we got him where we want him!
uvsub.default.cop10.arrest.temp_part13=That's all, folks!
uvsub.default.cop10.arrest.temp_part15=Cancel the call - it's over.
uvsub.default.cop10.arrest.temp_part16=So now that the suspect's arrested, can we turn his car into a police unit?
uvsub.default.cop10.arrest.temp_part17=We got him just in time - I was about to go golfing with a coworker.
uvsub.default.cop10.arrest.temp_part18=I believe the youth would say - "We got him, chat".
uvsub.default.cop10.arrest.temp_part19=I can go home to my wife now - thanks, guys!
uvsub.default.cop10.arrest.temp_part20=Drinks on me, guys - we got him, great job!

uvsub.default.cop10.bustevaded.bustevade1=Ugh - the vehicle is still mobile. We're maintaining Code 3 pursuit.
uvsub.default.cop10.bustevaded.bustevade2=God damnit - he somehow managed to slip out!
uvsub.default.cop10.bustevaded.bustevade3=No no no no no- come on! He got out of the encirclement...
uvsub.default.cop10.bustevaded.bustevade4=Yea no, he got out of there - we're maintaining Code 3 pursuit.
uvsub.default.cop10.bustevaded.bustevade5=Yea no, of course he got out... everybody double time! We're still maintaining Code 3 pursuit!
uvsub.default.cop10.bustevaded.bustevade6=Okay, which one of you screwed up? How did he manage to flee?
uvsub.default.cop10.bustevaded.bustevade7=How, HOW? HOW did he manage to get out?
uvsub.default.cop10.bustevaded.bustevade8=Where did we go wrong with this plan? Where did we go wrong? Maintain Code 3 pursuit, we're still going on this guy!
uvsub.default.cop10.bustevaded.bustevade9=Okay, I'm not mad, just disappointed - let's continue on the chase. Let's try harder next time.

uvsub.default.cop10.busting.temp_(2)=Sit tight everybody, we almost got him!
uvsub.default.cop10.busting.temp_(3)=Hold on, hold on, hold on!
uvsub.default.cop10.busting.temp_(4)=Okay, take him down.
uvsub.default.cop10.busting.temp_part2_(4)=Let's go, take him down.
uvsub.default.cop10.busting.temp_part3_(2)=That's it, that's it - don't let him recover, stay on top of him!
uvsub.default.cop10.busting.temp_part3_(4)=I think we got him!
uvsub.default.cop10.busting.temp_part4_(4)=Let's nail this guy!
uvsub.default.cop10.busting.temp_part5_(2)=Guys, pin him down, pin him down - we almost got him!
uvsub.default.cop10.busting.temp_part7_(3)=Move on him NOW!
uvsub.default.cop10.busting.temp_part7=Keep it together everyone - don't let him slip through!
uvsub.default.cop10.busting.temp_part17=Let's move, let's move on him now - GO!
uvsub.default.cop10.busting.temp_part18=MOVE on this guy, go!
uvsub.default.cop10.busting.temp_part19=Step on it, step on it - go go go, we got him, we got him!

uvsub.default.cop10.closetoenemy.close1=I'm gonna try something here.
uvsub.default.cop10.closetoenemy.close2=I'm gonna try a tactic against him here.
uvsub.default.cop10.closetoenemy.close3=Alright, let's see if this works...
uvsub.default.cop10.closetoenemy.close4=Duck this one!
uvsub.default.cop10.closetoenemy.close5=Here we go!
uvsub.default.cop10.closetoenemy.close6=Think fast, chucklenuts!
uvsub.default.cop10.closetoenemy.close7=What to do...
uvsub.default.cop10.closetoenemy.close8=Ravage them!
uvsub.default.cop10.closetoenemy.close9=Hey buddy!
uvsub.default.cop10.closetoenemy.close10=Nice car - shame what's going to happen to it though.

uvsub.default.cop10.passive.temp=I'm gonna stay back here - this guy is really unpredictable. But I'll have cover standing by!
uvsub.default.cop10.passive.temp_part2_(2)=Yea no, we cannot allow this to go further - there's a lot of damage, and the guy's still not stopping; what're we gonna do?
uvsub.default.cop10.passive.temp_part2_(3)=We might need the feds on this - we cannot stop this guy at all.
uvsub.default.cop10.passive.temp_part2=This guy's a little unpredictable. I'll have cover standing by.
uvsub.default.cop10.passive.temp_part3_(2)=I don't know about you, Dispatch, but we're getting wasted out here! Is there going to be any reinforcements helping us?
uvsub.default.cop10.passive.temp_part3_(3)=Looks like we're gonna have to call desperate measures. Any word on the feds?
uvsub.default.cop10.passive.temp_part3=Driver's not stopping - we need to stop him ASAP.
uvsub.default.cop10.passive.temp_part4_(2)=Pursuit's getting exhausted out here - do we have any word on any additional units joining us?
uvsub.default.cop10.passive.temp_part4_(3)=Looks like we're gonna need the bigger heat on this guy - any word on the federal assistance?
uvsub.default.cop10.passive.temp_part4=Yea, this guy's not slowing down - we need more cover out here!
uvsub.default.cop10.passive.temp_part5_(2)=We've been on this guy for a long time, but we still haven't caught him - any ideas?
uvsub.default.cop10.passive.temp_part5_(3)=This pursuit needs way more resources than we have now - can we try and get the feds on this?
uvsub.default.cop10.passive.temp_part5=I'm gonna drop back a little to give this guy some room - let's see if I'm right in thinking he'll slow down.
uvsub.default.cop10.passive.temp_part7_(2)=We're getting exhausted out here by the minute! Can we try and get some fresh blood?
uvsub.default.cop10.passive.temp_part7_(3)=I think we should get some birds eye view on this chase - can we get a chopper down here?
uvsub.default.cop10.passive.temp_part7=Driver's speeding up while I'm gonna slow down! Stand by.
