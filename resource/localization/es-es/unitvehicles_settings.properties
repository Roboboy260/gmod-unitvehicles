uv.hm.presets=Preajustes
uv.hm.presets.warning=ADVERTENCIA
uv.hm.presets.confirm=Esto sobreescribirá todos tus ajustes.\nEsto no se puede deshacer.\n¿Estás seguro que quieres cargar el preajuste "%s"?

uv.hm.presets.presetname=Nombre del preajsute - [+attack2] en un preajuste para pegarlo aquí
