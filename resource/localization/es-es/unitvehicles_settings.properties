#---------- New Settings Menu, Pursuit Settings
uv.pursuit=Ajustes de persecución

uv.pursuit.heatlevels=Niveles de persecución
uv.pursuit.heatlevels.enable=Activar niveles de persecución
uv.pursuit.heatlevels.enable.desc=Activa los niveles de persecución, donde cuando la bolsa alcanza ciertos umbrales, aumenta el nivel de persecución, incrementando la cantidad de unidades, agresividad y variedad.
uv.pursuit.heatlevels.aiunits=Aparición de unidades IA
uv.pursuit.heatlevels.aiunits.desc=Las unidades IA principales (Patrulla, Apoyo, etc.) apareceran cerca para unirse a las persecuciones.\n\nLas unidades Rhino y el helicoptero pueden ser activadas mediante el administrador.

uv.pursuit.randomplayerunits=Unidades aleatorias para los jugadores
uv.pursuit.randomplayerunits.desc=Si se activa, las unidades controladas por los jugadores serán seleccionadas aleatoriamente de las unidades disponibles.
uv.pursuit.autohealth=Durabilidad ilimitada
uv.pursuit.autohealth.desc=Los vehiculos de los sospechosos tienen vida ilimitada, y tu vida como sospechoso se establece acorde a la masa de tu vehículo.\n\nActiva esta opción si no quieres que te destruyan a cada rato, o si quieres sospechosos mas fuertes.
uv.pursuit.wheelsdetaching=Desprendimiento de la rueda
uv.pursuit.wheelsdetaching.desc=Si se activa, la ruedas se desprenderan de los vehiculos destruidos.
uv.pursuit.canexitvehicle=Permitir salir del vehículo
uv.pursuit.canexitvehicle.desc=Si se activa, los usuarios pueden salir de sus vehiculos en medio de las carreras y persecuciones.
uv.pursuit.repaircooldown=Tiempo de recarga de las estaciones de reparación
uv.pursuit.repaircooldown.desc=Cuanto tiempo va a tardar para que la estación de reparación pueda volver a ser usada.\n\nCambia a 0 para que sea de un solo uso.
uv.pursuit.repairrange=Distancia de reparación
uv.pursuit.repairrange.desc=A cuanta distancia de la estación de reparación (medida en unidades Hammer) a la que tu vehículo puede ser reparado.
uv.pursuit.noevade=Nunca evadir
uv.pursuit.noevade.desc=Si se activa, nunca podrás entrar en zona segura.\n\n¡Buena suerte!
uv.pursuit.bustedtime=Tiempo para el arresto
uv.pursuit.bustedtime.desc=Cuanto tiempo se tarda en arrestar a un sospechoso\n\nCambia a 0 para desactivar.
uv.pursuit.respawntime=Tiempo de reaparición (Policia)
uv.pursuit.respawntime.desc=El tiempo que va a pasar para que el jugador/es puedan reaparecer como unidades policiales.\n\nCambia a 0 para desactivar.
uv.pursuit.spikeduration=Tiempo para reinflar ruedas
uv.pursuit.spikeduration.desc=Cuanto tiempo va a tardar para que las ruedas puedan reinflarse.\n\nCambialo a 0 para que las ruedas no puedan ser reinfladas.

uv.pursuit.roadblocks=Ajustes del bloqueo
uv.pursuit.roadblocks.maxnr=Cantidad máxima de bloqueos
uv.pursuit.roadblocks.maxnr.desc=Establece la cantidad de bloqueos que pueden ser cargados a la vez.\n\nCambialo a 0 para desactivar la aparición de bloqueos.

uv.pursuit.roadblocks.alwaysjoinpursuit=Unirse a la persecución después de pasar
uv.pursuit.roadblocks.alwaysjoinpursuit.desc=Decide si las unidades que forman parte del bloqueo deberían unirse siempre a la persecución cuando un sospechoso los pasa, nunca unirse, o si es decidido por cada bloqueo individualmente.

uv.pursuit.roadblocks.alwaysjoinpursuit.off=Desactivado
uv.pursuit.roadblocks.alwaysjoinpursuit.always=Siempre
uv.pursuit.roadblocks.alwaysjoinpursuit.never=Nunca

uv.chatter=Charla de la radio
uv.chatter.enable=Activa la charla de la radio
uv.chatter.enable.desc=Activa la comunicación por voz entre las unidades IA y la central.

uv.response=Respuesta a llamadas
uv.response.enable=Activa la respuesta a llamadas
uv.response.enable.desc=Las unidades IA apareceran y responderan a llamadas por todo el mapa.
uv.response.speedlimit=Limite de velocidad (MPH)
uv.response.speedlimit.desc=Las unidades que estén ausentes estaran al tanto del limite de velocidad que establezcas.\n\nLas unidades que esten patrullando estarán al tanto del limite de velocidad establecido en los nodos de Decent Vehicles.\n\nCambialo a 0 para desactivar.

#---------- New Settings Menu, Pursuit Tech
uv.ptech=Tecnologia de persecución
uv.ptech.racer=Tecnologia de persecución de los corredores
uv.ptech.racer.desc=Activa si quieres que los corredores aparezcan con tecnologias de persecución.
uv.ptech.friendlyfire=Fuego amigo de los corredores
uv.ptech.friendlyfire.desc=Activa si quieres que los corredores puedan usar sus armas para con los demas corredores.
uv.ptech.roadblockfriendlyfire=Fuego amigo en los bloqueos
uv.ptech.roadblockfriendlyfire.desc=Activa si quieres que las unidades se vean afectadas al pasar sobre las bandas de clavos puestas en los bloqueos.

#---------- New Settings Menu, Pursuit Breakers
uv.pb=Pausas de persecución
uv.pb.maxnr=Cantidad máxima
uv.pb.maxnr.desc=Cuantas pausas de persecución pueden ser cargadas a al vez.\n\nCambialo a 0 para desactivar las pausas de persecución.

uv.pb.cooldown=Tiempo de espera para aparecer
uv.pb.cooldown.desc=Cuanto tiempo tarda en desaparecer una pausa de persecución para que la misma vez aparezca otra y tome su lugar.

#---------- New Settings Menu, Repair Shops
uv.rs=Estaciones de reparación
uv.rs.maxnr=Cantidad máxima
uv.rs.maxnr.desc=Cuantas estaciones de reparación pueden ser cargadas a la vez.\n\nEstablecelo a  0 para que no aparezcan estaciones de reparación.

uv.rs.cooldown=Tiempo de espera para la aparición
uv.rs.cooldown.desc=Cuanto tarda, en segundos, para que la estación de reparación desaparezca y que otra aparezca para tomar su lugar.

#---------- New Settings Menu, AI
uv.ai.title=Ajustes de la IA

uv.aidifficulty=Dificultad de la IA

uv.aidifficulty.racer=Dificultad del corredor
uv.aidifficulty.racer.desc=Escoge el nivel de dificultad deseado para los corredores IA.\n\nDificultades mas altas le garantizan a todos los oponentes IA un impulso gradual a su velocidad y capacidad para tomar curvas.\n\nSi se cambia en mitad de la carrera, los cambios se aplicaran una vez que la misma acabe.\n\nNo afecta a los corredores IA que no estén participando en la carrera, y se reinicia una vez que la carrera termine.
# uv.aidifficulty.racer.rubberband=Rubberband
uv.aidifficulty.racer.rubberband.desc=Cuando se activa, los corredores IA que queden muy atras ganarán un impulso gradual para su velocidad y tracción, permitiendoles que alcanzen posiciones más rapido.\n\nEste efecto cambia según la dificultad.\n\nNo aplica durante las persecuciones.

uv.aidifficulty.racer.rubberbandrev=Rubberband invertido
uv.aidifficulty.racer.rubberbandrev.desc=Cuando se activa, los corredores IA que se encuentren muy delante obtendran una reducción gradual de su velocidad.\n\nEl efecto escala dependiendo la distancia.\n\nNo se aplica durante persecuciones, o si la IA aplica el rubberband hacia un corredor a la vez.

uv.aidifficulty.racer.rubberband.gap=Distancia para activar
uv.aidifficulty.racer.rubberband.gap.desc=Que tan detrás del jugador deben de estar los corredores IA para usar el rubberband.
uv.aidifficulty.racer.rubberbandrev.gap.desc=Que tan delante del jugador deben de estar los corredores IA para usar el rubberband.

# uv.aidifficulty.racer.cautious=Cautious Mode
# uv.aidifficulty.racer.cautious.desc=When enabled, AI Racers will be more cautious, making them more aware of other racers and less aggressive.
# uv.aidifficulty.racer.cautiousrandomness=Cautious Mode Randomness
# uv.aidifficulty.racer.cautiousrandomness.desc=Whether to randomize the cautious mode for AI Racers

uv.aidifficulty.unit=Dificultad para las unidades
uv.aidifficulty.unit.desc=Escoge el nivel de difcultad deseado para las unidades IA.\n\nLos niveles de difcultad mas altos le garantizan a la IA un impuso gradual a su velocidad y capacidad para tomar curvas.
uv.aidifficulty.unit.rubberband=Permitir el impulso para el rezagado
uv.aidifficulty.unit.rubberband.desc=Cuando se activa, las unidades IA obtendrán un impulso gradual de su velocidad y capacidad para tomar curvas cuando se queden detrás, permitiendo que alcanzen mas rápido.\n\nEste efecto escala según la dificultad.

uv.ailogic=Logica de la IA

uv.ailogic.optimizerespawn=Optimizar reaparición
uv.ailogic.optimizerespawn.desc=Las unidades se teletransportaran al frente del jugador en vez de reaparecer.\n\nMejora el rendimiento.
# uv.ailogic.trafficstreaming=Traffic Streaming
# uv.ailogic.trafficstreaming.desc=Traffic and patrolling Units will despawn when they are too far away from the player, thus allowing new ones to spawn.\n\nImpacts performance.
uv.ailogic.relentless=Despiadado
uv.ailogic.relentless.desc=Las unidades IA se comportaran de una manera más agresiva, como los policias en NFS Rivals.\n\nDescuidarán su propia integridad fisica para poder capturar a los sospechosos.\n\nEllos también sabrán donde estás, a pesar de que te encuentres en zona segura.
uv.ailogic.wrecking=Activar derribos
uv.ailogic.wrecking.desc=Los vehículos de policia/tráfico pueden ser destruidos.
uv.ailogic.detectionrange=Rango de detección
uv.ailogic.detectionrange.desc=Distancia minima (medida en unidades hammer) en la que las unidades policiales apareceran del vehiculo cuando se aparece manualmente.\n\nUsa valores más altos si encuentras problemas al aparecer las unidades policiales.

uv.ailogic.headlights=Activar luces
uv.ailogic.headlights.desc=Los vehículos IA usaran sus luces.\n\nEl helicoptero usara su foco de luz para poder iluminar.\n\nAfecta al rendimiento.
uv.ailogic.headlights.off=Siempre apagadas
uv.ailogic.headlights.auto=Automatico
uv.ailogic.headlights.always=Siempre encendidas

uv.ailogic.usenitrousracer=Nitro para los corredores IA
uv.ailogic.usenitrousracer.desc=Permite que los corredores IA utilizen el nitro.\n\nNota: Solo disponible para vehiculos Glide.
uv.ailogic.usenitrousunit=Nitro para los policias IA
uv.ailogic.usenitrousunit.desc=Permite que los policias IA utilizen el nitro.\n\nNota: Solo disponible para vehiculos Glide.

uv.ailogic.autohealthracer=Durabilidad ilimitada para corredores IA
uv.ailogic.autohealthracer.desc=Le da a los corredores IA durabilidad ilimitada a sus vehículos.

uv.ailogic.customizeracer=Personaliza el vehiculo de los corredores IA
uv.ailogic.customizeracer.desc=A los corredores IA se les aplican un color aleatorio, la apariencia y las partes una vez ya aparecido el vehiculo.\n\nNota: No aplica para los vehiculos con script de daño basado por bodygroup.

uv.ailogic.tractioncontrol=Tracción de control
uv.ailogic.tractioncontrol.desc=Los corredores IA aplicaran la aceleración reducida cuando estén perdiendo tracción.\n\nNota: Solo se le aplica a los vehiculos con base Glide y Simfphys.

uv.ailogic.disengageonheatchange=Abortar al cambio del nivel de persecución
uv.ailogic.disengageonheatchange.desc=Las uniades IA abortaran si su vehiculo no es el asignado al nivel de persecución debido cuando el mismo cambie.\n\nLos puntos de recurso no se gastan en el proceso.\n\nNota: No aplica para las unidades comandante, unidades Rhino y tampoco para las unidades que se aparezcan manualmente.

uv.ainav=Navegación de la IA
# uv.ainav.pathfind=Pathfinding
uv.ainav.pathfind.desc=La IA usara un algoritmo de pathfinding mediante el uso de NavMesh/ La IA usa los nodos de Decent Vehicle para navegar.\n\nAfecta al rendimiento.
uv.ainav.dvpriority=Prioridad para Decent Vehicles
uv.ainav.dvpriority.desc=La IA utilizará los nodos de Decent Vehicle en vez de la NavMesh para navegar(si está disponible).
uv.ainav.dvdistancebased=Distancia basada en nodos de Decent Vehicle
uv.ainav.dvdistancebased.desc=La IA usa un acercamiento basado en distancia para navegar usando los nodos de Decent vehicle.\n\nDesactivado = Atacan diirectamente cuando el sospechoso esta a la vista.\n\nActivado = Navegan por nodos si se encuentran muy lejos del sospechoso.
uv.ainav.dvnavoptimized=Navegación mediante DV optimizada
uv.ainav.dvnavoptimized.desc=Si se activa, la IA usará un algoritmo de pathfinding optmizado para navegar mediante nodos de DV. Desactiva si tienes problemas con la navegación de las uniades.\n\nMuy util en mapas InfMap con muchos nodos presentes.\n\n<color=255,255,0>OPCIÓN EXPERIMENTAL</color>


#---------- New Settings Menu, AI
uv.uvset.title=Ajustes de UV

uv.ui.menu=Menu de UV
uv.ui.menu.desc=Cambia la apariencia del menu de UV alterando sus colores y varias funciones en este menú.

uv.ui.menu.hidedesc=Fozar ocultar descripciones
uv.ui.menu.hidedesc.desc=Oculta la tabla de descripciones de UV forzadamente, y hace que el ancho del menú sea mas corto.\nDebes recargar la instancia para que los cambios aparezcan.

uv.ui.menu.hideprompts=Forzar esconder prompts
uv.ui.menu.hideprompts.desc=Oculta forzadamente los prompts en todas las tablas de UV.\n\nSe debe de recargar la instancia del menu para que el ajuste se aplique.

uv.ui.menu.openspeed=Velocidad de abierto
uv.ui.menu.openspeed.desc=Cuanto tiempo tarda el menú para abrirse.\nMedido en segundos.

uv.ui.menu.closespeed=Velocidad de cerrado
uv.ui.menu.closespeed.desc=Cuanto tiempo tarda el menú para cerrarse.\nMedido en segundos.

uv.ui.menu.custcol=Personalizar colores
uv.ui.menu.custcol.desc=Personaliza los colores del menú de UV.

uv.ui.dataimport=Importación de datos
uv.ui.dataimport.desc=Altera como la importación de datos propios y de terceros es administrada.

uv.ui.dataimport.enableimport=Activar la importación de datos
uv.ui.dataimport.enableimport.desc=Activa el escaneo automatico de nuevos de datos de UV al arrancar.\n\n<color=255,100,100>Advertencia</color>: Puede causar tirones, dependiendo en la cantidad de datos presentes en tus extensiones.

uv.ui.dataimport.enablereplace=Activar el reemplazo de datos
uv.ui.dataimport.enablereplace.desc=Activa el escaneo automatico de datos alterados de UV al arrancar.\n\n<color=255,100,100>Advertencia</color>: Puede causar tirones, dependiendo en la cantidad de datos presentes en tus extensiones.

uv.ui.dataimport.scan=Escanear para datos nuevos y alterados
uv.ui.dataimport.scan.desc=Ecanea manualmente para datos de UV nuevos y alterados.\n\n<color=255,100,100>Advertencia</color>: Puede causar tirones, dependiendo en la cantidad de datos presentes en tus extensiones.

uv.ui.dataimport.replaceserver=[SERVIDOR] Revisar datos alterados
uv.ui.dataimport.replaceserver.desc=Abre la orden de reemplazo de datos de UV, permitiendo que un administrador confirme el reemplazo de datos de UV.\n\n<color=255,100,100>Advertencia</color>: Puede causar tirones, dependiendo en la cantidad de datos presentes en tus extensiones.

# uv.ui.dataimport.workshoppriority=Workshop Priority
# uv.ui.dataimport.workshoppriority.desc=If enabled, Workshop content will be prioritized over Local content.\n\nThis allows Workshop addons to remain updated in case you have their files inside of your local data folder (which you should probably remove)\nDisable this if you want to use/work on local content instead of Workshop content\n\n<color=255,255,0>Note</color>: Changing this setting will require a map reload!

#---------- Built-in Addons
uv.vcmod.els=Prioridad para VCMod ELS
uv.vcmod.els.desc=Las unidades que usen la base de los vehículos de HL2 intentarán usar VCMod ELS antes que Photon si ambos están instalados.

uv.lvs.alwaysfullthrottle=Siempre acelerar a fondo
uv.lvs.alwaysfullthrottle.desc=Usar el total del acelerador sin tener que mantener presionado el modificador del acelerador.


