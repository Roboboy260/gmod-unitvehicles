uv.hm.heat.maxunits.desc=¿Cuantas unidades pueden perseguirte a la vez?\n\nValores más altos pueden llegar a impactar en el rendimiento.

uv.hm.heat.avaunits=Unidades disponibles
uv.hm.heat.avaunits.desc=¿Cuantas unidades pueden aparecer para perseguir antes de pedir refuerzos?

uv.hm.heat.backuptime=Temporizador de refuerzos
uv.hm.heat.backuptime.desc=Cuanto tiempo tiene que pasar para que lleguen los refuerzos.

uv.hm.heat.bustspeed=Velocidad del arresto (MPH)
uv.hm.heat.bustspeed.desc=Establece a que velocidad deberia de ir el corredor para poder evitar el arresto.

uv.hm.heat.cooldowntime=Temporizador de zona segura
uv.hm.heat.cooldowntime.desc=Cuanto tiempo debes de permanecer en zona segura para poder evadir.

uv.hm.heat.roadblocks=Activar bloqueos
uv.hm.heat.roadblocks.desc=Si está activado, los bloqueos aparecerán en este nivel de persecución.

uv.hm.heat.helicopter=Activar unidades de helicopteros
uv.hm.heat.helicopter.desc=Si está activado, las unidades de helicóptero apareceran en este nivel de persecución.\n\n¡Echale un ojo al cielo, y cubrete en lugares cerrados!

uv.hm.units=Unidades
