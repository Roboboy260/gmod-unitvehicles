uv.hm.air.canbust.desc=Si se activa, el helicóptero puede arrestar a a los corredores si permanecen cerca de el.

uv.hm.air.pt.exp=Permitir barriles explosivos
uv.hm.air.pt.spikes=Permitir banda de clavos
uv.hm.air.pt.desc=Si se activa, la unidad helicoptero va a poder utilizar estas tecnologias de persecución..\n\nNo hará nada si la opción "Permitir tecnología de persecución" se encuentra desactivada.

uv.hm.disablebounty=Bolsa por derribar patrullas
uv.hm.disablebounty.desc=Cuanta bolsa puedes obtener al derribar a este tipo de patrulla.

uv.hm.vp=Perfiles de voces
uv.hm.vp.desc=Elige que perfil de voz será usado por esta unidad IA.
uv.hm.vp.dispatch.desc=Elige que perfil de voz será usado por la Central.
uv.hm.vp.misc.desc=Elige que perfil de voz será usado para sonidos miscelaneos.

uv.hm.heat=Ajustes para los niveles de persecución

uv.hm.heat.bounty.10s=Bolsa cada 10 seg.
uv.hm.heat.bounty.10s.desc=Cuanta bolsa ganas cada vez que pasen 10 segundos.

uv.hm.heat.heatlvl.time=Tiempo para el nivel de persecución
uv.hm.heat.heatlvl.time.desc=Cuanto tiempo se va a tardar antes de que incrementes tu nivel de persecución.\n\nNo hace nada si "Niveles de persecución por tiempo" está desactivado.

uv.hm.heat.minbounty=Bolsa minima
uv.hm.heat.minbounty.desc=¿Cuanta bolsa se necesita para alcanzar el nivel de persecución?\n\n¡No escribas la misma cantidad para otros niveles de persecución!\n\nNo hace nada si "Niveles de persecución por tiempo" está activado.

