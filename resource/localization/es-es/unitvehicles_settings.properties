#---------- First Time Settings
uv.ft=Tutorial

uv.ft.title=¡Bienvenido a Unit Vehicles!
uv.ft.desc=Unit Vehicles es una extensión orientada al mundo abierto que permite, en ambos multijugador con demás personas o un solo jugador con la IA,sumergirte en persecuciones de alta velocidad como o en contra de la policia (Unidades) y carreras emocionantes en culaquier mapa.\n\nEste tutorial servirá para que te familiarizes con los diferentes ajustes que ofrece esta extensión para mejorar tu experiencia.

uv.ft.preset.title=Selecciona un preajuste
uv.ft.preset.desc=Unit Vehicles te permite sumergirte en persecuciones con o en contra de la IA o también con otras unidades controladas por jugadores. Puedes ajustar cada variable, ya sea cuantas unidades  hay presentes, cuanto tardan los refuerzos en llegar, o si las unidades aéreas o bloqueos pueden aparecer.\n\nPorfavor elige un preajuste de nivel de persecución para continuar.
uv.ft.preset.desc2=Puedes encontrar estos ajustes en [string:uv.pm] -- [string:uv.hm].

uv.ft.bases=Bases de vehículos
uv.ft.bases.desc=Unit Vehicles permite usar una variedad de bases de vehículos. Aunque, la IA solo puede aparecer usando la base de vehículos pre-seleccionada.\n\nPorfavor elige que base de vehículos te gustaría que la IA use.

uv.ft.bases.units=Base de las unidades
uv.ft.bases.airacer=Base de los corredores IA
uv.ft.bases.traffic=Base del tráfico

uv.ft.general.desc=Unit Vehicles contiene una gran cantidad de diferentes ajustes disponibles para personalizar.\n\nPorfavor revisa los diferentes ajustes, como tu tipo de interfaz, perfíl de UVTrax™ , y varias cosas más.

uv.ft.racing.desc=Unit Vehicles te permite correr alrededor de circuitos y carreras punto a punto creadas por jugadores con o contra corredores IA y jugadores.\n\nPorfavor revisa tus ajustes de carrera.
uv.ft.racing.desc2=Puedes encontrar estos ajustes en [string:uv.rm] -- [string:uv.rm.options],  después de cargar una pista.

uv.ft.racing.ai.title=Correr con la IA
uv.ft.racing.ai.desc=Puedes correr con oponentes IA, y hay 2 maneras de lograr esto.:
uv.ft.racing.ai.desc2=1) Activa el botón [string:uv.airacer.override], después selecciona los vehículos con los que quieras que la IA aparezca usando [+attack2].\n2) Desactivalo, y crea vehículos que la IA pueda usar manualmente usando la herramienta [string:tool.uvracermanager.name].\n\nPuedes encontrar este ajuste en [string:uv.airacer].

uv.ft.end.title=HECHO
uv.ft.end.desc=¡Y ya está!\n\n¡Ahora puedes ir y experimentar las emocionantes carreras y persecuciones en cualquier mapa que estés pensando!
uv.ft.end.desc2=Puedes ver las [string:uv.faq] si tienes más dudas.\n\nSi descubres un fallo o error, o necesitas ayuda con algo que no se menciona en [string:uv.faq] ¡Por favor visitanos en nuestro servidor de Discord!

uv.ft.next=Siguiente
uv.ft.prev=Anterior
uv.ft.finish=Terminar

uv.ft.force=Re-activar tutorial
uv.ft.force.desc=Si se activa , la próxima vez que abras el menú de UV verás todo el tutorial de nuevo.

uv.ft.skip=Saltar (No recomendado)

