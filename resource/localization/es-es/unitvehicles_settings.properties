uv.hm.presets.delete.desc=Elimina el preajuste usando [+attack2].

uv.hm.presets.export=Exportar los ajustes cargados para una extensión de la workshop
uv.hm.presets.export.desc=Exporta los ajustes en un archivo compatible con la workshop.\n\nRevisa el chat para ver la ruta exacta.

uv.hm.lvl=Nivel de persecución %s

uv.hm.timedhl=Niveles de persecución por tiempo
uv.hm.timedhl.desc=Si se activa, los niveles de persecución aumentarán por tiempo en vez de por bolsa.

uv.hm.minhl=Nivel de persecución mínimo
uv.hm.minhl.desc=Establece el menor nivel de persecución que puedes alcanzar en una persecución. Cuanto mas altos los niveles, más agresivas serán las patrullas.

uv.hm.maxhl=Nivel de persecución máximo
uv.hm.maxhl.desc=Establece el máximo nivel de persecución que puedes alcanzar en una persecución. Cuanto más bajos los niveles, menos agresivas serán las patrullas.

uv.hm.enablept=Las unidades pueden aparecer con tecnología de persecución
uv.hm.enablept.desc=Permite que las unidades aparezcan con tecnología de persecución.\n\nLas unidades patrulla y de apoyo no aparecerán con tecnología de persecución independientemente de si esta opción esté activada o desactivada.

uv.hm.pt.spawnwith=Permitir la tecnologia de persecucción
uv.hm.pt.spawnwith.desc=Activa si quieres que las unidades controladas por jugadores e IA puedan aparecer y usar su tecnología de persecución.
uv.hm.pt.spawnwith.desc.air=Activa si quieres que la unidad aerea pueda usar esta tecnología de persecución.

uv.hm.commander=Ajustes del comandante
uv.hm.commander.solo=Un solo comandante
uv.hm.commander.solo.desc=Si se activa, habrá solo 1 comandante en toda la persecución.\n\nMientras la unidad comandante esté activa, habrán unidades de refuerzo ilimitadas.

uv.hm.commander.health=Vida del comandante
uv.hm.commander.health.desc=Establece cuanta vida tiene el comandante.\n\n¡Aumenta si te es muy facil!

uv.hm.commander.norepair=Restringir estación de reparación
uv.hm.commander.norepair.desc=Si se activa, la unidad comandante no podrá utilizar la estación de reparación para reparar su vehiculo.\n\nAún asi, puede usar la misma para recargar sus tecnologías de persecución.

uv.hm.air=Ajustes de la unidad aérea
