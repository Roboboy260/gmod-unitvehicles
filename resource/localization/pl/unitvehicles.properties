uv.ptech.spikes=Kolczatki
uv.ptech.spikes.short=KOLEC
uv.ptech.spikes.desc=Zrzucane z tyłu twojego pojazdu, Kolczatki same się rozkładają przebijając opony pojazdów które na nie najadą i są w stanie przebić więcej niż jeden pojazd.

uv.ptech.spikes.activated=UŻYTO KOLCZATKI

uv.ptech.spikes.tiresreinflate=NADMUCHIWANIE OPON

uv.ptech.shockram=Elektro Taran
uv.ptech.shockram.short=ELTRN
uv.ptech.shockram.desc=Elektro Taran wywołuje wybuch soniczny z przodu twojego pojazdu który odpycha i uszkadza inne pojazdy w zasięgu.

uv.ptech.shockram.activated=UŻYTO ELEKTRO TARANA
uv.ptech.shockram.hit=Trafiono %s z Elektro Tarana
uv.ptech.shockram.hit.you=%s udało się trafić Cię z Elektro Tarana

uv.ptech.gpsdart=Rzutka GPS
uv.ptech.gpsdart.short=GPS
uv.ptech.gpsdart.desc=Rzutka GPS wystrzeliwuje się z przodu twojego pojazdu, przy trafieniu przyczepia się a następnie lokalizuje uciekający cel.

uv.ptech.gpsdart.activated=WYSTRZELONO RZUTKĘ GPS
uv.ptech.gpsdart.missed=CHYBIONO RZUTKĄ GPS

uv.ptech.gpsdart.hit=Trafiono %s z Rzutki GPS
