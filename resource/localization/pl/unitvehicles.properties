uv.ptech.expbarrel=Wybuchowa Beczka

uv.ptech.grappler=Chwytacz
uv.ptech.grappler.short=CHWT
uv.ptech.grappler.desc=Chwytacz jest urządzeniem które dzięki silnemu nylonowi jest w stanie złapać tylnią oponę uciekającego pojazdu, zatrzymując go w kontrolowany sposób.

uv.ptech.grappler.activated=UŻYTO CHWYTACZA
uv.ptech.grappler.missed=CHYBIENIE

uv.ptech.grappler.hit=Trafiono %s Chwytaczem
uv.ptech.grappler.hit.you=%s udało się złapać Cię Chwytaczem

#---------- [ Tips Strings ]
uv.tip=RADA: %s

# Shared
uv.tip.repairshop=Dzięki [string:uv.repairshop] możesz naprawić pojazd i uzupełnić Narzędzia Pościgu. Jeśli używasz <color=255,255,0>Glide // Circular Functions</color>, uzupełni to również twój zapas Nitro.

uv.tip.pt.emp1=Użyj [string:uv.ptech.emp] aby uszkodzić falą uderzeniową samochód przed tobą.
uv.tip.pt.emp2=Uniknij [string:uv.ptech.emp] zjeżdżając z drogi lub używając [string:uv.ptech.jammer].
# uv.tip.pt.emp3=Racers can use an [string:uv.ptech.emp] to force the [string:uv.unit.helicopter] out of pursuit.
uv.tip.pt.esf1=Użyj [string:uv.ptech.esf] aby nałożyć na swój pojazd ofensywne pole statyczne, szokujące każdego kto je dotknie.
uv.tip.pt.esf2=Użyj [string:uv.ptech.esf] aby skontrować [string:uv.ptech.stunmine] lub [string:uv.ptech.emp].
uv.tip.pt.repairkit1=Mocno uszkodzony pojazd? Użyj [string:uv.ptech.repairkit] aby wrócić do pełni sił!
uv.tip.pt.spikes1=Użyj [string:uv.ptech.spikes] aby przebić opony swojemu celowi, co poważnie utrudnia kontrolę nad pojazdem.
uv.tip.pt.spikes2=Użyj [string:uv.ptech.shockwave] lub [string:uv.ptech.shockram] aby przepchnąć z drogi kolczatki.
uv.tip.pt.jammer=Użytkownicy [string:uv.ptech.jammer] pokazują się jeśli mogą używać innych Narzędzi Pościgu.

uv.tip.drafting=Uważaj podczas draftowania za Zawodnikami lub Jednostkami, mogą użyć [string:uv.ptech.spikes] lub [string:uv.ptech.stunmine] prosto pod twoje koła.

# Racer
uv.tip.racer.pt.jammer1=[string:uv.ptech.jammer] nie tylko zakłóca innym kierowcom Interfejs, ale też natychmiast wyłącza aktywne Narzędzia Pościgu.
uv.tip.racer.pt.jammer2=Użyj [string:uv.ptech.jammer] aby wyłączyć tymczasowo pojawianie się Jednostek SI, co ułatwi ucieczkę.
uv.tip.racer.pt.shockwave1=Użyj [string:uv.ptech.shockwave] aby odepchnąć od siebie inne pojazdy.
uv.tip.racer.pt.stunmine1=[string:uv.ptech.stunmine] rozkładają się za twoim pojazdem i uszkadzają wszystkie pojazdy które się do nich zbliżą.
uv.tip.racer.pt.powerplay1=Użyj [string:uv.ptech.powerplay] aby zdalnie aktywować najbliższy Spowalniacz Pościgu.
uv.tip.racer.pt.juggernaut1=Problemy z Blokadami? Użyj [string:uv.ptech.juggernaut] aby zwiększyć siłę taranowania swojego Pojazdu.
uv.tip.racer.pt.ghost1=Użyj [string:uv.ptech.ghost] aby tymczasowo wyłączyć sobie kolizję z innymi pojazdami lub obiektami.

uv.tip.racer.pt.killswitch1=Uniknij [string:uv.ptech.killswitch] odjeżdżając od użytkownika lub przy użyciu [string:uv.ptech.jammer].
# uv.tip.racer.pt.skyhammer1=Dodge a [uv.ptech.skyhammer] by getting under cover, driving away from the helicopter or using the [string:uv.ptech.jammer]
uv.tip.racer.pt.shockram1=Jednostki mogą posiadać [string:uv.ptech.shockram] co jednocześnie uszkadza i odpycha pojazdy dookoła.
uv.tip.racer.pt.gpsdart1=Trafiono Cię [string:uv.ptech.gpsdart]? Pozbądź się problemu wjeżdżając w ścianę lub obiekt lub używając [string:uv.ptech.jammer].
uv.tip.racer.pt.grappler1=Złapano [string:uv.ptech.grappler]? Użyj pędu aby odrzucić Jednostkę lub zerwać linę, lub wyłącz ją używając [string:uv.ptech.jammer].

uv.tip.racer.cooldown=Podczas oczekiwania po pościgu, znajdź dobrą kryjówkę i wyłącz silnik aby szybciej zgubić gliny.
uv.tip.racer.aitactics1=Jednostki SI nie radzą sobie na szosie, więc wjeżdżając na piach, do lasu, lub na plac budowy możesz je zmylić i zgubić.
uv.tip.racer.aitactics2=Jednostki SI używają toczących blokad aby Cię zatrzymać. Spowolnij albo znajdź sposób żeby je ominąć.
uv.tip.racer.pb=Wjedź w <color=255,255,0>Spowalniacze Pościgu</color> (oznaczone czerwonymi trójkątami) aby zawalić struktury które uprzykrzą dzień Jednostkom które odważyły się Ciebie gonić.
# uv.tip.racer.comunits1=<color=255,255,0>Commander Units</color> do not spawn with repair kits, and may not be able to repair themselves at the Repair Shop.
uv.tip.racer.comunits2=<color=255,255,0>Jednostki Dowodzące</color> są odporne na dachowanie. Rozwal je <color=255,255,0>Spowalniaczem Pościgu</color> lub <color=255,255,0>utop</color>.
# uv.tip.racer.comunits3=Resource Points will not drain if there's a <color=255,255,0>Commander Unit</color> around - take them out first!
uv.tip.racer.airunits1=Zgub Jednostki Powietrzne ukrywając się pod dachem, lub używając [string:uv.ptech.jammer] aby spowodować utratę kontroli nad śmigłowcem.
uv.tip.racer.leastagro=Jednostki Patrolowe i Wsparcia są najmniej agresywne. Głównie będą Cię tylko śledzić, i nie pojawiają się z Narzędziami Pościgu.
uv.tip.racer.roadblocks1=Jeśli jest za późno aby ominąć Blokadę, celuj w lżejsze obiekty lub pojazdy.
uv.tip.racer.roadblocks2=Uważaj na dziury w Blokadach - często chowają się w nich [string:uv.ptech.spikes].
uv.tip.racer.boxedin=Przyblokowali Cię? Użyj [string:uv.ptech.ghost] lub [string:uv.ptech.shockwave] aby łatwo uciec!
uv.tip.racer.upgradedunits=Jednostki Dowodzące i Specjalne posiadają ulepszone Narzędzia Pościgu.
uv.tip.racer.stuck=Jeśli twój pojazd utknął, wciśnij [key:unitvehicle_keybind_resetposition] aby zresetować pozycję.
# uv.tip.racer.disorient=Take sharp, sudden turns, or take huge jumps to disorient Units.
uv.tip.racer.rhinounits=Unikaj kolizji czołowych z <color=255,255,0>Taranami</color>.

# Unit
uv.tip.unit.pt.killswitch1=Spróbuj użyć [string:uv.ptech.killswitch] na celach którym ciężko uciec, na przykład na prostej, lub na celu który jest w trakcie bycia aresztowanym.
uv.tip.unit.pt.killswitch2=Po namierzeniu celu, [string:uv.ptech.killswitch] wyłączy silnik pojazdu na krótką chwilę, ułatwiając aresztowanie.
uv.tip.unit.pt.shockram1=Użyj [string:uv.ptech.shockram] aby uszkodzić pojazd przed tobą.
uv.tip.unit.pt.gpsdart1=Podejrzani trafieni [string:uv.ptech.gpsdart] nie mogą uciec.
uv.tip.unit.pt.grappler1=Podczas używania [string:uv.ptech.grappler], spowolnij aby cel nie mógł tobą rzucić lub urwać liny.

uv.tip.unit.pt.shockwave1=Podejrzani którzy są w pułapce mogą użyć [string:uv.ptech.shockwave] aby odepchnąć Jednostki.
uv.tip.unit.pt.juggernaut1=Podejrzani pod wpływem [string:uv.ptech.juggernaut] NIE SĄ niezniszczalni i mogą zostać uszkodzeni.
# uv.tip.unit.pt.ghost1=Suspects using [string:uv.ptech.ghost] can still get hit with [string:uv.ptech.spikes], [string:uv.ptech.emp], [string:uv.ptech.killswitch] and the [string:uv.ptech.shockram].

uv.tip.unit.pit=Przeprowadź manewr PIT na celu, wjeżdżając w tył celu i skręcając w niego, co powoduje wykręcenie pojazdu.
uv.tip.unit.teamwork=Pracujcie razem jako Jednostki aby osiągnąć sukces. Dogońcie cel i nie wjeżdżajcie w Siebie, co daje celowi czas na ucieczkę.
uv.tip.unit.roadblocks=Możesz rozstawiać własne [string:uv.ptech.spikes] aby uzupełnić dziury w blokadach.
uv.tip.unit.loneunit=Jako pojedyncza Jednostka staraj się nie jechać przed celem, ponieważ może on skręcić, nagle zjechać z drogi, albo użyć Narzędzi Pościgu aby Cię zneutralizować.
uv.tip.unit.comunit=Jako <color=255,255,0>Dowódca</color>, powinno trzymać się blisko celu, ale nie atakować dopóki nie jest to potrzebne.
uv.tip.unit.nocooldown=Jako Jednostka, nie widzisz ani czasu Oczekiwania podczas uciekania celu, ani powiadomienia o uciekaniu.
uv.tip.unit.respawn=Możesz wcisnąć [key:unitvehicle_keybind_resetposition] w każdej chwili aby się pojawić jako nowa Jednostka.
uv.tip.unit.pbnote=<color=255,255,0>Spowalniacze Pościgu</color> mogą zniszczyć twój pojazd jeśli w nie wjedziesz.
