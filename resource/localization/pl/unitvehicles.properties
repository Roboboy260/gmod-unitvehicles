uv.ptech.maxdistance=Zasięg
uv.ptech.maxdistance.desc=Dystans w którym cel musi się znaleźć by aktywować narzędzie.\nLiczone w jednostkach Hammera.

uv.ptech.force=Siła
uv.ptech.force.desc=Jaka siła nadawana jest na cel.

uv.ptech.lockontime=Czas namierzania
uv.ptech.lockontime.desc=Ile czasu zanim narzędzie namierzy cel.

uv.ptech.disableduration=Czas wyłączenia
uv.ptech.disableduration.desc=Jak długo pojazdy trafione narzędziem pozostaną wyłączone.

uv.ptech.length=Długość
uv.ptech.length.desc=Jak długie jest ograniczenie Narzędzia Pościgu.

uv.ptech.strength=Moc
uv.ptech.strength.desc=Jak mocne jest ograniczenie Narzędzia Pościgu.

# Shared
uv.ptech.emp=Puls elektromagnetyczny
uv.ptech.emp.short=EMP
uv.ptech.emp.desc=Puls elektromagnetyczny (EMP) namierza samochody przed sobą i wystrzeliwuje wielki elektrostatyczny puls który tymczasowo wyłącza elektronikę trafionych pojazdów

uv.ptech.emp.activated=AKTYWOWANO EMP
uv.ptech.emp.lockingon=NAMIERZANIE EMP
uv.ptech.emp.missed=CHYBIENIE EMP
uv.ptech.emp.dodged=OMINIĘTO EMP
uv.ptech.emp.notarget=BRAK PRAWIDŁOWYCH CELÓW DLA EMP

uv.ptech.emp.hit=Trafiono %s z EMP
uv.ptech.emp.hit.you=%s udało się trafić Cię EMP.

uv.ptech.esf=Pole eektrostatyczne
uv.ptech.esf.short=ESF
uv.ptech.esf.desc=Pole elektrostatyczne (ESF) naładowuje twój pojazd silnym polem statycznym które chroni go przed Minami Ogłuszającymi i namierzaniem EMP, i mocno razi kogokolwiek kto dotknie twój wóz.

uv.ptech.esf.activated=AKTYWOWANO ESF
uv.ptech.esf.hit=Trafiono %s z ESF
uv.ptech.esf.hit.you=%s udało się trafić Cię z ESF

uv.ptech.repairkit=Zestaw Naprawczy
uv.ptech.repairkit.short=NAPRAWA
uv.ptech.repairkit.desc=Wewnętrzny Zestaw Naprawczy który aktywuje nagłe pole naprawcze dla twojego pojazdu. Zaprojektowany z myślą o sytuacjach wypadkowych i taktycznym czasie reakcji, Moduł Samo-Naprawy przywraca integralność strukturalną pojazdu przy użyciu wbudowanych samouszczelniających komponentów i wzmacnianej hydrauliki.

uv.ptech.repairkit.activated=UŻYTO ZESTAWU NAPRAWCZEGO

# Racers Only
uv.ptech.jammer=Zakłócacz
uv.ptech.jammer.short=ZAKŁ
uv.ptech.jammer.desc=Zakłócacz otacza twój wóz tymczasowym polem które chroni go przed uderzeniami z narzędzi pościgu, i zakłóca wyświetlacze pobliskich kierowców blokując używanie Narzędzi Pościgu.

uv.ptech.jammer.activated=UŻYTO ZAKŁÓCACZA
uv.ptech.jammer.hit.you=ZAKŁÓCONO

uv.ptech.shockwave=Fala Uderzeniowa
uv.ptech.shockwave.short=FUDRZ
uv.ptech.shockwave.desc=Fala Uderzeniowa wywołuje soniczny wybuch ze środka pojazdu który odpycha i uszkadza pobliskie pojazdy.

uv.ptech.shockwave.activated=UŻYTO FALI UDERZENIOWEJ
uv.ptech.shockwave.hit=Trafiono %s z Fali Uderzeniowej
uv.ptech.shockwave.hit.you=%s udało się trafić Cię z Fali Uderzeniowej

uv.ptech.stunmine=Mina Ogłuszająca
uv.ptech.stunmine.short=MINA
uv.ptech.stunmine.desc=Miny Ogłuszające zrzucane są z tyłu twojego pojazdu. Przy trafieniu pojazdu przeciąża elektronikę uszkadzając go i powoduje utratę kontroli.

uv.ptech.stunmine.activated=ZRZUCONO MINĘ OGŁUSZAJĄCĄ
uv.ptech.stunmine.hit=Trafiono %s z Miny Ogłuszającej
uv.ptech.stunmine.hit.you=%s udało się trafić Cię z Miny Ogłuszającej

uv.ptech.powerplay=Taktyczne Zawalenie
uv.ptech.powerplay.short=TKZW
uv.ptech.powerplay.desc=Użycie Taktycznego Zawalenia powoduje upadek najbliższego Spowalniacza Pościgu.

uv.ptech.powerplay.activated=UŻYTO TAKTYCZNEGO ZAWALENIA
uv.ptech.powerplay.nopb=BRAK POBLISKICH SPOWALNIACZY POŚCIGU

uv.ptech.juggernaut=Dżuggernaut
uv.ptech.juggernaut.short=DGNT
uv.ptech.juggernaut.desc=Dżuggernaut zwiększa siłę taranowania w twoim pojeździe, ułatwiając wjeżdżanie w obiekty i pojazdy przed tobą.

uv.ptech.juggernaut.activated=AKTYWOWANO DŻUGGERNAUTĘ

uv.ptech.ghost=Duch
uv.ptech.ghost.short=DUCH
uv.ptech.ghost.desc=Aktywacja Ducha sprawia że pojazd kierowcy nie koliduje z obiektami lub innymi pojazdami.

uv.ptech.ghost.activated=UŻYTO DUCHA

