uv.ptech.killswitch=Wyłącznik
uv.ptech.killswitch.short=WYŁ
uv.ptech.killswitch.desc=Wyłącznik namierza pojazdy przed sobą i wystrzeliwuje wielki elektrostatyczny puls który tymczasowo wyłącza ich elektronikę.

uv.ptech.killswitch.activated=UŻYTO WYŁĄCZNIKA
