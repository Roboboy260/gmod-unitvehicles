#---------- First Time Settings
uv.ft=Первоначальная Настройка

uv.ft.title=Добро пожаловать в Unit Vehicles!
uv.ft.desc=Unit Vehicles - это аддон, ориентированный на песочницу, который позволяет игрокам в Мультиплеере с другими или Синглплеере с ИИ участвовать в высокоскоростных погонях за или против полиции (Юнитов), а также в захватывающих гонках на любой карте.\n\nПри первоначальной настройке будут использовани различные параметры, которые помогут вам получить наилучшие впечатления.

uv.ft.preset.title=Выбрать Пресет
uv.ft.preset.desc=Unit Vehicles позволяет тебе участвовать в погонях за или против ИИ или Юнитов, контролируемых игроками. Ты можешь изменить каждую переменную, такие как сколько Юнитов может быть, сколько потребуется времени подкреплению для прибытия или могут ли Вертолёты и заграждения появляться.\n\nПожалуйста, выбери Пресет Уровня Жары, чтобы продолжить.
uv.ft.preset.desc2=Ты можешь найти эти настройки в [string:uv.pm] -- [string:uv.hm].

uv.ft.bases=Базы Машин
uv.ft.bases.desc=Unit Vehicles позволяет тебе использовать различные базы машин. В прочем, ИИ может появляться только используя одну выбранную базу машин.\n\nПожалуйста, ознакомься, какие Базы Машин ты бы хотел использовать для ИИ.

uv.ft.bases.units=База Юнитов
uv.ft.bases.airacer=База ИИ Гонщиков
uv.ft.bases.traffic=База Трафика

uv.ft.general.desc=Unit Vehicles имеет широкий спектр настроек, которые доступны для кастомизации.\n\nПожалуйста, ознакомься с различными настройками, такими как выбор Интерфейса, Профиля UVTrax™, а также других вещей.

uv.ft.racing.desc=Unit Vehicles позволяет тебе участвовать в кольцевых гонках и спринтах, созданных игроками с другими или против других игроков с ИИ Гонщиками.\n\nПожалуйста, ознакомься Настройками Гонок.
uv.ft.racing.desc2=Ты можешь найти эти настройки в [string:uv.rm] -- [string:uv.rm.options] после того, как загрузишь трассу.

uv.ft.racing.ai.title=Гонки с ИИ
uv.ft.racing.ai.desc=Ты можешь участвовать в гонках с ИИ опонентами и есть два способа это сделать:
uv.ft.racing.ai.desc2=1) Поставь галочку на кнопке [string:uv.airacer.override] ниже, затем выбери машины, в которых должны появляться ИИ, исползуя [+attack2].\n2) Не ставь галочку и самостоятельно создай машины, которые ИИ могут использовать, используя инструмент [string:tool.uvracermanager.name].\n\nТы можешшь найти эту настройку в [string:uv.airacer].

uv.ft.end.title=ГОТОВО
uv.ft.end.desc=И это всё!\n\nТеперь ты можешь отправиться и испытать высокоскоростные погони и захватывающие гонки на любой карте, какую только можешь представить!
uv.ft.end.desc2=Ты можешь ознакомиться с [string:uv.faq], если у тебя остались ещё вопросы.\n\nЕсли ты обнаружил баг или глюк или тебе нужна помощь с тем, что не упомянуто в [string:uv.faq], пожалуйста, посети наш Discord сервер!

uv.ft.next=Следующий
uv.ft.prev=Предыдущий
uv.ft.finish=Финиш

uv.ft.force=Повторная Первоначальная Настройка
uv.ft.force.desc=Если включено, в следующий раз при открытии UV Меню, ты пройдёшь через Первоначальную Настройку снова.

uv.ft.skip=Пропустить (Не рекомендуется)

#---------- New Settings Menu, Race Manager
uv.rm=Менеджер Гонки

uv.rm.startrace=Начать Гонку
uv.rm.startrace.desc=Начинает гонку с приглашёнными гонщиками и ИИ.

uv.rm.stoprace=Закончить Гонку
uv.rm.cancelrace=Отменить Гонку

uv.rm.sendinvite=Пригласить в Гонку

uv.rm.loadrace=Загрузить Трассу
uv.rm.changerace=Сменить Трассу

uv.rm.author=Автор: %s
uv.rm.checkpoints=Кол-во Контрольных Точек: %s
uv.rm.startslots=Места Старта: %s

uv.rm.hasprops=Пропы: %s
uv.rm.hasnodes=Путевые Точки: %s

uv.rm.options=Настройки Гонки
uv.rm.options.laps=Кол-во Кругов
uv.rm.options.laps.desc=Количество кругов, которое следует пройти.\n\nДолжен быть установлен 1 круг, если гонка от точки до точки или драг.
uv.rm.options.dnftimer=Таймер НФ
uv.rm.options.dnftimer.desc=Начинается отсчёт, когда первый участник финиширует; когда отсчёт достигнет 0, гонка автоматически закончится, дисквалифицируя всех, кто не пересёк финишную черту.\n\nУстанови значение 0, чтобы отключить.
uv.rm.options.visiblecheckpoints=Видимые Контрольные Точки
uv.rm.options.visiblecheckpoints.desc=Видны ли контрольные точки игрокам во время гонок.
# uv.rm.options.legacyspawn=Legacy Spawn Method
# uv.rm.options.legacyspawn.desc=If enabled, legacy spawning method will be used.\n\nLegacy method re-creates each racer's vehicle & places them on the grid slot, which makes it way slower than the new method.\n\nThis should only be used if you're experiencing issues with certain bases and the way they're positioned on the grid.

uv.rm.options.pursuitstart=Авто-Начало Погони
uv.rm.options.pursuitstart.desc=Начинает погоню через это количество секунд после начала гонки.\n\nУстанови значение 0, чтобы выключить.

uv.rm.options.pursuitclear=Авто-Конец Погони после Гонки
uv.rm.options.pursuitclear.desc=Автоматически заканчивает погоню, когда гонка завершается.
uv.rm.options.pursuitclear.ai=Также удалить ИИ Юнитов
uv.rm.options.pursuitclear.ai.desc=Также удаляются все ИИ Юниты, присутствующие в данный момент.

uv.rm.options.clearai=Удалить ИИ Гонщиков после Гонки
uv.rm.options.clearai.desc=Автоматически удаляет всех ИИ Гонщиков и их машины, когда гонка завершается.

uv.rm.options.rubberband.pursuits=Также в Погонях
uv.rm.options.rubberband.pursuits.desc=Когда включено, улучшение также применится даже в течение погонь.

uv.rm.startrace.addai=Добавить %s ИИ и Начать Гонку
uv.rm.startrace.addai.desc=Создаёт это количество ИИ и автоматически приглашает их на гонку, а затем запускает её.\n\nПредупреждение: Создание большого количества ИИ может вызвать зависание игры.
uv.rm.startrace.fillai=Заполнить Места ИИ и Начать Гонку
uv.rm.startrace.fillai.desc=Создаёт %s ИИ и автоматически приглашает их на гонку, а затем запускает её.\n\nПредупреждение: Создание большого количества ИИ может вызвать зависание игры.

#---------- New Settings Menu, Pursuit Manager
uv.pm=Менеджер Погони

uv.pm.spawnas=Появиться в качестве Юнита
uv.pm.spawnas.desc=Открывает Меню Выбора Юнита, позволяя выбрать Юнита, чтобы присоединиться к Юнитам, противостоящим уходящим подозреваемым.

uv.pm.spawnai=Появиться в качестве ИИ Юнита
uv.pm.spawnai.desc=Появиться в качестве случайного ИИ Юнита.

uv.pm.spawnai.val=Разместить %s ИИ Юнитов
uv.pm.spawnai.val.desc=Размещает это количество ИИ Юнитов.\n\nПредупреждение: Размещение большого количество ИИ может вызвать зависание игры.

uv.pm.clearai=Очистить активных ИИ Юнитов
uv.pm.clearai.desc=Удаляет всех текущих ИИ Юнитов.

uv.pm.pursuit.toggle=Переключить Состояние Погони
uv.pm.pursuit.toggle.desc=Начинает погоню, если нет действующей.\n\nЗаканчивает погоню, если есть действующая.

uv.pm.pursuit.start=Начать Погоню
uv.pm.pursuit.stop=Закончить Погоню

uv.pm.heatlevel=Установить Уровень Жары
uv.pm.heatlevel.desc=При включении устанавливает текущий Уровень Жары на желаемое значение.

uv.pm.misc=Разное
uv.pm.clearbounty=Очистить Награду
uv.pm.clearbounty.desc=Устанавливает значение награды обратно на 0.
uv.pm.wantedtable=Напечатать "Таблицу Разыскиваемых" в консоль

#---------- New Settings Menu, Heat Level Manager
uv.hm=Менеджер Уровней Жары
uv.hm.open=Открыть Менеджер Уровней Жары
uv.hm.open.desc=Открывает Менеджера Уровней Жары, в котором ты можешь изменить всё, связанное с Уровнями Жары, Преследующами Юнитами, Наградой и так далее.

uv.hm.presets=Пресеты
uv.hm.presets.warning=ВНИМАНИЕ
uv.hm.presets.confirm=Это перезапишет все твои настройки.\nЭто не получится изменить.\nТы уверен, что хочешь загрузить пресет "%s"?

uv.hm.presets.presetname=Название Пресет - [+attack2] по Пресету, чтобы вставить это здесь
uv.hm.presets.presetname.require=Требуется название пресета!

uv.hm.presets.save=Сохранить Пресет
uv.hm.presets.save.desc=Сохраняет пресет с желаемым именем и текущими выбранными настройками.

uv.hm.presets.delete=Удалить Пресет
uv.hm.presets.delete.desc=Удаляет последний выбранный пресет, используя [+attack2].

uv.hm.presets.export=Экспорт Загруженных Настроек для Дополнения в Мастерской
uv.hm.presets.export.desc=Экспортирует настройки в файл, совместимые с Мастерской.\n\nПроверь чат, чтобы узнать точный путь.

uv.hm.lvl=Уровень Жары %s

uv.hm.timedhl=Временные Уровни Жары
uv.hm.timedhl.desc=Если включено, Уровни Жары будут повышаться со временем вместо того, чтобы полагаться на сумму Награды.

uv.hm.minhl=Минимальный Уровень Жары
uv.hm.minhl.desc=Устанавливает минимальный Уровень Жары, которого вы можете достичь в погоне. Более высокие уровни обеспечивают более агрессивных юнитов.

uv.hm.maxhl=Максимальный Уровень Жары
uv.hm.maxhl.desc=Устанавливает максимальный Уровень Жары, которого вы можете достичь в погоне. Менее высокие уровни обеспечивают менее агрессивных юнитов.

uv.hm.enablept=Юниты могут появляться с Технологиями Погони
uv.hm.enablept.desc=Позволяет Юнитам появляться с Технологиями Погони.\n\nПатрульные и Юниты Поддержки никогда не появятся с Технологиями Погони независимо от того, включена ли опция.

uv.hm.pt.spawnwith=Позволить Технологии Погони
uv.hm.pt.spawnwith.desc=Включите, если ИИ и Юниты, контролируемые игроками могут появляться с этой Технологией Погони и использовать ею.
uv.hm.pt.spawnwith.desc.air=Включите, если Воздушный Юнит может использовать эту Технологию Погони.

uv.hm.commander=Настройки Командира
uv.hm.commander.solo=Один Командир
uv.hm.commander.solo.desc=Если включено, будет только один Командир, отправленный в погоню.\n\nПока Командир активен, будут бесконечные подкрепления Юнитов.

uv.hm.commander.health=Здоровье Командира
uv.hm.commander.health.desc=Сколько здоровья имеет Командир.\n\nПовысь, если слишком легко для тебя!

uv.hm.commander.norepair=Запрет Мастерской
uv.hm.commander.norepair.desc=Если включено, Командир не сможет использовать мастерскую, чтобы починить машину.\n\nПримечание: Командир всё ещё может пополнять Технологии Погони.

uv.hm.air=Настройки Воздушного Юнита
uv.hm.air.model=Модель Юнита
uv.hm.air.model.desc=Какая модель должна использоваться для Вертолёта.

uv.hm.air.canbust=Может арестовывать Гонщиков
uv.hm.air.canbust.desc=Если включено, Вертолёт сможет арестовывать гонщиков, летая рядом с ними.

uv.hm.air.pt.exp=Позволить Взрывные Бочки
uv.hm.air.pt.spikes=Позволить Полосы с Шипами
uv.hm.air.pt.desc=Если включено, Вертолёт сможет использовать эту Технологию Погони.\n\nНичего не делает, если "Позволить Технологии Погони" выключено.

uv.hm.disablebounty=Награда за Устранение Юнитов
uv.hm.disablebounty.desc=Сколько Награды ты получаешь за устранение Юнита этого типа.

uv.hm.vp=Голосовые Профили
uv.hm.vp.desc=Выбери, какой Голосовой Профиль используется для этого ИИ Юнита.
uv.hm.vp.dispatch.desc=Выбери, какой Голосовой Профиль используется для Диспетчера.
uv.hm.vp.misc.desc=Выбери, какой Голосовой Профиль используется для Других.

uv.hm.heat=Настройки Уровней Жары

uv.hm.heat.bounty.10s=Награда каждые 10 секунд
uv.hm.heat.bounty.10s.desc=Сколько Награды ты получаешь каждые 10 секунды.

uv.hm.heat.heatlvl.time=Время Жары
uv.hm.heat.heatlvl.time.desc=Сколько времени пройдёт до повышения вашего Уровня Погони.\nНичего не делает, если "Временные Уровни Погони" отключены.

uv.hm.heat.minbounty=Минимальная Награда
uv.hm.heat.minbounty.desc=Сколько Награды требуется, чтобы достичь этого Уровня Жары?\n\nНе перекрывай для других Уровней Жары!\n\nНичего не делает, если "Временные Уровни Жары" включено.

uv.hm.heat.maxunits=Максимальное кол-во Юнитов
uv.hm.heat.maxunits.desc=Сколько Юнитов могут преследовать тебя за один раз?\n\nБолее высокие значения влияют на производительность.

uv.hm.heat.avaunits=Доступные Юниты
uv.hm.heat.avaunits.desc=Сколько Юнитов может появиться для преследования перед тем, как будет вызвано подкрепление?

uv.hm.heat.backuptime=Время Подкреплениия
uv.hm.heat.backuptime.desc=Сколько времени пройдет до прибытия подкрепления, чтобы присоединиться к погоне.

uv.hm.heat.bustspeed=Скорость для Ареста (М/Ч)
uv.hm.heat.bustspeed.desc=На какой скорости гонщику следует ехать, чтобы избежать ареста.

uv.hm.heat.cooldowntime=Время Ожидания
uv.hm.heat.cooldowntime.desc=Сколько времени нужно потратить на Ожидание, чтобы успешно скрыться.

uv.hm.heat.roadblocks=Включить Заграждения
uv.hm.heat.roadblocks.desc=Если включено, заграждения могут появляться на этом Уровне Жары.

uv.hm.heat.helicopter=Включить Вертолёты
uv.hm.heat.helicopter.desc=Если включено, Вертолёты могут появляться на этому Уровне Жары.\nСледите за небом и найдите укрытие над головой!

uv.hm.units=Юниты
uv.hm.units.desc=Выбирает Юинтов, которые будут появлятся в этом слоте в течение погонь.

uv.hm.units.selected=Выбранные Юниты
uv.hm.units.selected.desc=Юниты, которые будут появляться в этом слоте в течение погонь.

uv.hm.units.spawnchance=Шанс Появлеия
uv.hm.units.spawnchance.desc=Шансы для этого Юнита, чтобы появиться в течение выбранного Уровня Жары.

uv.hm.units.limit=Лимит Появления
uv.hm.units.limit.desc=Сколько Юнитов этого типа может быть частью погони.\n\nУстанови 0 для отсутствия лимита.\n\nУстанови -1 для появления только в заграждениях.

uv.hm.units.override=Использовать Базы Машин
uv.hm.units.override.desc=Юниты будут выбирать машины из списка ниже за место выбора машин из базы данных.

#---------- New Settings Menu, Traffic Manager
uv.tm=Менеджер Трафика

uv.tm.clear=Очистить активные Машины Трафика
uv.tm.clear.desc=Удаляет все текущие Машины Трафика.

uv.tm.override.desc=Трафика будут выбирать машины из списка ниже за место выбора машин из базы данных.

#---------- New Settings Menu, AI Racer Manager
uv.airacer=Менеджер ИИ Гонщиков

uv.airacer.spawnai=Разместить ИИ Гонщика
uv.airacer.spawnai.desc=Размещает случайного ИИ Гонщика.

uv.airacer.spawnai.val=Разместить %s ИИ Гонщиков
uv.airacer.spawnai.val.desc=Размещает это количество ИИ.\n\nПредупреждение: Размещение большого количество ИИ может вызвать зависание игры.

uv.airacer.clear=Очистить активных ИИ Гонщиков
uv.airacer.clear.desc=Удаляет всех текущих ИИ Гонщиков.

uv.airacer.override=Управление Машиной
uv.airacer.override.desc=ИИ Гонщики будут выбирать машины из списка ниже за место выбора машин из базы данных.

uv.airacer.overridelist=Назначенные Машины: %s
uv.airacer.overridelist.desc=ПКМ по машине, чтобы добавить её в список.\n\nПКМ по ней опять, чтобы удалить из списка.
uv.airacer.overridelist.hover=ПКМ по машине, чтобы добавить её в список.\nПКМ по ней опять, чтобы удалить из списка.

#---------- New Settings Menu, Addons
uv.addons=Дополнения

uv.addons.builtin=Включённые Дополнения
uv.addons.builtin.desc=Дополнения, включённые в Unit Vehicles.

uv.addons.extern=Сторонние Дополнения
uv.addons.extern.desc=Дополнения, скачанные в Мастерской или установленные в папке addons.
uv.addons.none=None found.

