uv.ui.custhud.pursuit=Элементы Погони
uv.ui.custhud.race=Элементы Гонок

uv.ui.custhud.leaderboard=Таблица лидеров

uv.ui.custhud.raceramount=Кол-во Гонщиков
uv.ui.custhud.raceramount.desc=Сколько гонщиков должно появляться в таблице лидеров во время гонок.\n\nНе влияет на числовое расположение элементов.

