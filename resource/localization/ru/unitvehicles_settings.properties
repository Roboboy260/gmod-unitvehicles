uv.faq=ЧаВо

uv.faq.intro=Введение
uv.faq.racing=Гонки
uv.faq.pursuits=Погони
uv.faq.tools=Инструменты
uv.faq.other=Другое

#---------- New Settings Menu, Credits
uv.credits=Титры

uv.credits.uvteam=UV Команда
uv.credits.translations=Переводы
uv.credits.contributors=Участники

#---------- New Settings Menu, Settings
uv.settings=Настройки

#---------- New Settings Menu, User Interface
uv.ui.title=Интерфейс
uv.ui.main=Главный Интерфейс
uv.ui.backup=Запасной Вариант
uv.ui.main.desc=Изменяет внешний вид интерфейса гонок и погонь, чтобы он напоминал интерфейс конкретной игры.\n\nПримечание: Интерфейс не соответствует соотношению 1:1 и имеет незначительные отличия.
uv.ui.backup.desc=Если Главный Интерфейс не имеет Интерфейс Погони, он будет использовать запасной Интерфейс Погони.\n\nПримечание: Интерфейс не соответствует соотношению 1:1 и имеет незначительные отличия.

uv.ui.original=Оригинальный
uv.ui.none=Без интерфейса

uv.ui.speedometer.enable=Включить Пользовательские Спидометры
uv.ui.speedometer.enable.desc=Заменяет обычный спидометр на тот, который подходит к Основному Интерфейсу.\n\nПримечание: Работает только для машин, мотоциклов и танков <color=255,255,0>Glide</color>.\n\n<color=255,100,100>Предупреждение</color>: При включении некоторые функции Glide не будут работать.

uv.ui.speedometer=Стиль Спидометра
uv.ui.speedometer.desc=Выбери, какой стиль спидометра использовать.

uv.ui.speedometer.cust=Кастомизировать Спидометр
uv.ui.speedometer.cust.desc=Кастомизировать выбранный спидометр.

uv.ui.custhud=Кастомизировать Интерфейс
uv.ui.custhud.desc=Кастомизировать различные элементы для выбранного Основного Интерфейса.

uv.ui.racertags=Таблички с именами
uv.ui.racertags.desc=Гонка: Отображает таблички над участниками гонки с их именем и текущей позицией.\n\nПогоня: Отображает таблички над подозреваемыми. Также отображает имя над Командиром.

uv.ui.racertags.thickness=Толщина Контура
uv.ui.racertags.thickness.desc=Насколько толстым контуру следует быть на именных табличках.\n\nУстанови значение 0, чтобы выключить контур.

uv.ui.racertags.distance=Расстояние для Затухания
uv.ui.racertags.distance.desc=Насколько далеко тебе надо быть, чтобы именные таблички полностью исчезли.\n\nИзмеряется в метрах.

uv.ui.racertags.maxnr=Макс. Кол-во на экране
uv.ui.racertags.maxnr.desc=Выбери максимальное количество именных табличек, видимые на экране одновременно.\n\nНе влияет на именную табличку Командира.

uv.ui.policescanner=Полицейский Сканнер
uv.ui.policescanner.desc=Отображает полицейский сканнер, направленный на ближайшего Юнита.\n\nВидимый вне погонь и пока есть Юниты, а также во время погони и во время Ожидания.

uv.ui.policescanner.vehicle=Выровнять по Машине
uv.ui.policescanner.vehicle.desc=Выравнивает переднюю часть сканера по передней оси машины, а не по направлению камеры.

uv.ui.preracepopup=Информация Перед Гонкой
uv.ui.preracepopup.desc=При запуске гонки, отображает информацию о ней; Кол-во кругов, кол-во контрольных точек и начальную позицию.

uv.ui.subtitles=Субтитры для Радиопереговоров
uv.ui.subtitles.desc=Отображает субтитры для  Радиопереговоров.\n\nПримечание: Только действует на стандартные Радиопереговоры.\n\nТолько доступно на Английском.

uv.ui.vehnametakedown=Использовать Название Машин для Уничтожения
uv.ui.vehnametakedown.desc=Отображает названия машин вместо названий юнитов для их уничтожения.

uv.ui.unitstype=Единицы Отображения
uv.ui.unitstype.desc=Выбери, какую единицу отображения нужно использовать для отображения дистанции.
uv.ui.unitstype.meter=Метры
uv.ui.unitstype.feet=Футы
uv.ui.unitstype.yards=Ярды

uv.ui.deadzone=Мёртвая зона Оси X
uv.ui.deadzone.desc=Двигает элементы Интерфейса ближе к центру экрана.\n\nПолезно для широких мониторов.

uv.ui.scale=Размер по Оси X
uv.ui.scale.desc=Увеличивает или уменьшает элементы Интерфейса.\n\nПолезно для широкиэ мониторов.

uv.ui.xaxis=Ось X
uv.ui.xaxis.desc=Двигает элемент Интерфейса влево или вправо.

uv.ui.yaxis=Ось Y
uv.ui.yaxis.desc=Двигает элемент Интерфейса вверх или вниз.

