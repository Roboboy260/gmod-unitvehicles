uv.keybind.slot1.desc=Aktiverar jakt teknologin som är i plats 1.
uv.keybind.slot2=Höger plats
uv.keybind.slot2.desc=Aktiverar jakt teknologin som är i plats 2.

uv.controls.anybutton=Tryck på valfri knapp

uv.controls.controllermode=Kontrollervänligt läge
uv.controls.controllermode.enable=Aktivera kontrollervänligt läge
uv.controls.controllermode.enable.desc=Om påslaget så kommer visa åtgärder ändras/avaktiveras.\n\n1. Musen stängs av under resultatskärmar.\n2. Vissa knappar ändras: \n\n[+attack] = [+jump]\n[+attack2] = [+reload]

uv.controls.glyphs=Glyfer
uv.controls.glyphs.enable=Åsidosätt glyfer
uv.controls.glyphs.enable.desc=Aktiverar förmågan att Åsidosätta knapparnas glyfer i UV-menyn och diverse UV-gränssnittelement.\n\nNotera: Detta åsidosätter inte knapparna. Det är endast kosmetiskt.

uv.controls.glyphs.uvkeybinds=UV-knappar

uv.controls.glyphs.action=Handling
uv.controls.glyphs.action.desc=Välj en handling att tillämpa en glyf till.

uv.controls.glyphs.glyph=Glyf
uv.controls.glyphs.glyph.desc=Välj en glyf att tillämpa till handlingen.

uv.controls.glyphs.active=Aktiv
uv.controls.glyphs.active.desc=En lista av alla aktiva glyfer.

#---------- New Settings Menu, Camera
uv.camera=Kamera
uv.camera.actioncam=Aktivera händelsekamera
uv.camera.actioncam.desc=Om påslaget så kommer kameran att visa dramatiska vinklar under vissa händelser.\n\nSpelet kan saktas ned i enspelarläge.\n\nAnvänd Speedbreakern för att hindra att Händelsekameran aktiveras.

uv.camera.actioncam.wrecked=Vid totalkrossning, arrestering eller död
uv.camera.actioncam.wrecked.desc=Visar en dramatisk vinkel när du totalkrossas, blir arresterad eller dör.

uv.camera.actioncam.racestart=När ett race påbörjas
uv.camera.actioncam.racestart.desc=Visar en dramatisk vinkel när du påbörjar ett race.

uv.camera.actioncam.racefinish=När ett race avslutas
uv.camera.actioncam.racefinish.desc=Visar en dramatisk vinkel när du slutför ett race.\n\nDitt fordon blir övertagen av en AI när den är aktiv.\n\nI enspelarläge så blir ditt fordon temporärligt immun mot kollisioner och spikmattor.

uv.camera.actioncam.crash=När du krockar med ditt fordon
uv.camera.actioncam.crash.desc=Visar en dramatisk vinkel när du krockar med ditt fordon.
uv.camera.actioncam.crash.threshold=Skada för att aktivera

uv.camera.actioncam.jump=I luften
uv.camera.actioncam.jump.desc=Visar en dramatisk vinkel när du tar ett gupp.
uv.camera.actioncam.jump.threshold=Höjd för att aktivera

uv.camera.actioncam.spotted=När en jakt påbörjas
uv.camera.actioncam.spotted.desc=Visar en dramatisk vinkel när du blir sedd av den närmsta enheten när en jakt påbörjas.

uv.camera.actioncam.roadblock=När du träffar en vägspärr
uv.camera.actioncam.roadblock.desc=Visar en dramatisk vinkel när du kör in i vägspärrar.
uv.camera.actioncam.roadblock.threshold=Hastighet att aktivera

uv.camera.actioncam.takedown=Vid utslagning
uv.camera.actioncam.takedown.desc=Visar en dramatisk vinkel när du slår ut enheter eller andra racers.
uv.camera.actioncam.takedown.threshold=Avstånd för att aktivera

uv.camera.actioncam.pursuitbreaker=När du träffar Pursuit Breakers
uv.camera.actioncam.pursuitbreaker.desc=Visar en dramatisk vinkel när du träffar Pursuit Breakers.\n\nDitt fordon blir övertagen av en AI när den är aktiv.\n\nI enspelarläge så blir ditt fordon temporärligt immun mot kollisioner och spikmattor.

#---------- New Settings Menu, Pursuit Settings
uv.pursuit=Jaktinställningar

uv.pursuit.heatlevels=Spaningsnivåer
uv.pursuit.heatlevels.enable=Aktivera Spåningsnivåer
uv.pursuit.heatlevels.enable.desc=Aktiverar spaningsnivåer, då när belöningen når vissa trösklar så ökar den spaningsnivån, vilket ökar Enhetsantalet, aggressivitet och variationen.
uv.pursuit.heatlevels.aiunits=AI-Enhet Spawnande
uv.pursuit.heatlevels.aiunits.desc=Huvud AI-enheter (Patrull, Understöd, osv.) kommer spawna nära för att gå med jakter.\n\nRhino- och Luftenheter kan aktiveras via verktyget Hanterare: Enheter.

uv.pursuit.randomplayerunits=Slumpmässiga spelareenheter
uv.pursuit.randomplayerunits.desc=Om påslaget så väljs spelare-kontrollerade Enheter slumpmässigt från tillgängliga enheter.
uv.pursuit.autohealth=Oändlig Hållbarhet
uv.pursuit.autohealth.desc=Misstänkta fordon får oändligt med liv, och ditt liv som misstänkt väljs beroende på din fordons vikt.\n\nAktivera ifall du inte vill bli totalkrossad, eller om du vill ha tuffare misstänkta.
uv.pursuit.wheelsdetaching=Lossning av hjul
uv.pursuit.wheelsdetaching.desc=Om påslaget så kan hjul lossas från förstörda fordon.
uv.pursuit.canexitvehicle=Tillåt att gå ur fordon
uv.pursuit.canexitvehicle.desc=Om påslaget så kan användare går ur deras fordon under ett pågående race eller en pågående jakt.
uv.pursuit.repaircooldown=Reperation Nedkylning
uv.pursuit.repaircooldown.desc=Hur länge innan reperationsverkstäder kan användas igen.\n\nSätt till 0 för att göra dem till engångsbruk.
uv.pursuit.repairrange=Reperation Räckvidd
uv.pursuit.repairrange.desc=Avstånd i "Hammer Units" för att reperationsverkstäder ska reparera ditt fordon.
uv.pursuit.noevade=Kom Aldrig Undan
uv.pursuit.noevade.desc=Om påslaget så kan du aldrig gå in i "Undvik"-skicket.\n\nLycka till!
uv.pursuit.bustedtime=Tid tills Arresterad
uv.pursuit.bustedtime.desc=Tid i sekunder innan en misstänkt blir arresterad.\n\nSätt till 0 för att avaktivera.
uv.pursuit.respawntime=Återuppståndelsetid (Snut)
uv.pursuit.respawntime.desc=Tid i sekunder innan spelare kan återuppstå som ett Enhetsfordon.\n\nSätt till 0 för att avaktivera.
uv.pursuit.spikeduration=Tid att Återuppblåsa Däck
uv.pursuit.spikeduration.desc=Hur länge, i sekunder, tills däck som träffats av spikmattor blir återuppblåsta.\n\nSätt till 0 för att göra att däck aldrig blir återuppblåsta.

uv.pursuit.roadblocks=Vägspärr Inställningar
uv.pursuit.roadblocks.maxnr=Högst antal vägspärrar
uv.pursuit.roadblocks.maxnr.desc=Hur många vägspärrar kan laddas på en och samma gång.\n\nSätt till 0 för att avaktivera att Vägspärrar kan uppstå.

uv.pursuit.roadblocks.alwaysjoinpursuit=Åsidosätt gå med jakt efter förbikörning
uv.pursuit.roadblocks.alwaysjoinpursuit.desc=Välj ifall Enheter som är del i en vägspärr alltid går med jakten när en misstänkt kör föbri, aldrig går med, eller om det bestäms av varje individuell vägspärr.

uv.pursuit.roadblocks.alwaysjoinpursuit.off=Avstängd
uv.pursuit.roadblocks.alwaysjoinpursuit.always=Alltid
uv.pursuit.roadblocks.alwaysjoinpursuit.never=Aldrig

uv.chatter=Radioprat
uv.chatter.enable=Aktivera Radioprat
uv.chatter.enable.desc=Aktiverar röstkommunikationer mellan AI-enheter och centralen.

uv.response=Nödsamtalssvar
uv.response.enable=Aktivera Nödsamtalssvar
uv.response.enable.desc=AI-enheter spawnar och svarar på diverse samtal runt kartan.
uv.response.speedlimit=Hastighetsbegränsning (MPH)
uv.response.speedlimit.desc=Stillastående AI-enheter hävdar till denna satta hastighetsbegränsningen.\n\nPatrullerande AI-enheter hävdar till hastighetsbegränsningen på DV Waypoints.\n\nSätt till 0 för att avaktivera.

#---------- New Settings Menu, Pursuit Tech
uv.ptech=Jakt Teknologi
uv.ptech.racer=Jakt Teknologi till Racers
uv.ptech.racer.desc=Aktivera ifall tävlande ska spawna med Jakt Teknologi.
uv.ptech.friendlyfire=Vådabekämpning till Racers
uv.ptech.friendlyfire.desc=Aktivera ifall tävlande kan använda Jakt Teknologi på varandra.
uv.ptech.roadblockfriendlyfire=Vägspärr vådabekämpning
uv.ptech.roadblockfriendlyfire.desc=Aktivera ifall Enheter ska påverkas av Spikmattor som finns med i vägspärrar.

#---------- New Settings Menu, Pursuit Breakers
uv.pb=Pursuit Breakers
uv.pb.maxnr=Högst antal
uv.pb.maxnr.desc=Hur många Pursuit Breakers kan vara aktiva på en och samma gång.\n\nSätt till 0 för att avaktivera att Pursuit Breakers uppstår.

uv.pb.cooldown=Nedkylning vid uppståelse
uv.pb.cooldown.desc=Hur länge, i sekunder, det tar innan en Pursuit Breaker tas bort och en annan uppstår för att ta dess plats.

#---------- New Settings Menu, Repair Shops
uv.rs=Reperationsverkstad
uv.rs.maxnr=Högst antal
uv.rs.maxnr.desc=Hur många reperationsverkstäder kan vara aktiva på en och samma gång.\n\nSätt till 0 för att avaktivera att reperationsverkstäder uppstår.

uv.rs.cooldown=Nedkylning vid uppståelse
uv.rs.cooldown.desc=Hur länge, i sekunder, det tar innan reperationsverkstaden tas bort och en annan uppstår för att ta dess plats.

#---------- New Settings Menu, AI
uv.ai.title=AI-Inställningar

uv.aidifficulty=Svårighetsgrad på AI

uv.aidifficulty.racer=Svårighetsgrad på Racers
uv.aidifficulty.racer.desc=Välj svårighetsgraden som du vill ha på AI-racers.\n\nHögre svårighetsgrader ger alla AI-motståndare gradvis ökad hastighet och svängförmåga.\n\nOm den ändras under ett race så kommer ändringarna tillämpas efter racet avslutats.
uv.aidifficulty.racer.rubberband="Rubberband"
uv.aidifficulty.racer.rubberband.desc=Om påslaget så kommer AI som är för långt bak få en gradvis ökad hastighet och stabilitet för att hjälpa dem komma ikapp snabbare.\n\nEffekten skalas med svårighetsgraden.\n\nTillämpas ej under jakter.

uv.aidifficulty.racer.rubberbandrev=Omvänd "Rubberband"
uv.aidifficulty.racer.rubberbandrev.desc=Om påslaget så kommer AI som är för långt framför få en gradvis sänkning på deras hastighet.\n\nEffekten skalar med avståndet framför.\n\nTillämpas ej under jakter, eller om de samtidigt har "rubberband" aktiverat på en spelare framför.

uv.aidifficulty.racer.rubberband.gap=Gap för att aktivera
uv.aidifficulty.racer.rubberband.gap.desc=Hur långt bak AI-racers ska vara till nästa spelare innan de aktiverar rubberbanding.
uv.aidifficulty.racer.rubberbandrev.gap.desc=Hur långt framför AI-racers ska vara till spelaren bakom innan de aktiverar rubberbanding.

uv.aidifficulty.racer.cautious=Försiktigt läge
uv.aidifficulty.racer.cautious.desc=Om påslaget så kommer AI-racers vara med försiktiga, vilket gör att dem är mer uppmärksamma om andra racers och är mindre aggressiva.
uv.aidifficulty.racer.cautiousrandomness=Slumpmässighet i försiktigt läge
uv.aidifficulty.racer.cautiousrandomness.desc=Om det ska vara slumpmässigt om AI-racers ska vara försiktiga.

uv.aidifficulty.unit=Svårighetsgrad på Enheter
uv.aidifficulty.unit.desc=Välj svårighetsgraden som du vill ha på AI-enheterna.\n\nHögre svårighetsgrader ger alla AI-enheterna gradvis ökad hastighet och svängförmåga.
uv.aidifficulty.unit.rubberband=Tillåt "Catch-up"
uv.aidifficulty.unit.rubberband.desc=Om påslaget så kommer AI som är för långt bak få en gradvis ökad hastighet och stabilitet för att hjälpa dem komma ikapp snabbare.\n\nEffekten skalas med svårighetsgraden.

uv.ailogic=AI-Logik

uv.ailogic.drivermodel=Förarmodeller
uv.ailogic.drivermodel.desc=AI kommer uppstå med förarmodeller beroende på NPC-klassen.
uv.ailogic.optimizerespawn=Optimera återskapelse
uv.ailogic.optimizerespawn.desc=Enheter kommer teleportera framför misstänkta istället för att återuppstå.\n\nFörbättrar prestandan.
uv.ailogic.trafficstreaming=Trafik Streaming
uv.ailogic.trafficstreaming.desc=Trafik och patrullerande enheter kommer tas bort när dem är för långt borta från spelaren, vilket tillåter nya att uppstå.\n\nPåverkar prestandan.
uv.ailogic.relentless=Galenskap
uv.ailogic.relentless.desc=AI-enheter kommer vara mer aggressiva, likt snutarna i NFS Rivals.\n\nDe ignorerar dess egna säkerhet för bättre resultat.\n\nDe vet också vart du gömmer dig, oavsett om du är i nedkylning.
uv.ailogic.wrecking=Aktivera Totalkrossning
uv.ailogic.wrecking.desc=AI-fordon kan totalkrossas.
uv.ailogic.detectionrange=Upptäckningsräckvidd
uv.ailogic.detectionrange.desc=Minimum uppståelseavstånd till fordonet i "Hammer Units" när du manuellt spawnar enheter.\n\nAnvänd högre värden ifall du har problem att spawna enheter.

uv.ailogic.headlights=Aktivera Strålkastare
uv.ailogic.headlights.desc=AI-fordon använder deras strålkastare.\n\nHelikopterenheter använder också deras strålkastare.\n\nPåverkar prestandan.
uv.ailogic.headlights.off=Alltid av
uv.ailogic.headlights.auto=Automatisk
uv.ailogic.headlights.always=Alltid på

uv.ailogic.usenitrousracer=Lustgas till AI-Racers
uv.ailogic.usenitrousracer.desc=Tillåter AI Racers att använda Lustgas.\n\nNotera: Endast tillgänglig på Glide-fordon.
uv.ailogic.usenitrousunit=Lustgas till AI-Enheter
uv.ailogic.usenitrousunit.desc=Tillåter AI-Enheter att använda Lustgas.\n\nNotera: Endast tillgänglig på Glide-fordon.

uv.ailogic.autohealthracer=Oändlig Hållbarhet till AI-Racers
uv.ailogic.autohealthracer.desc=Ger AI-Racers oändlig fordonshållbarhet.

uv.ailogic.customizeracer=Trimma AI-Racerfordon
uv.ailogic.customizeracer.desc=AI-Racers tillämpar en slumpmässig färg, utseende och val av kroppgrupp när de spawnar i fordon.\n\nNotera: Gäller inte för Glide-fordon med kroppgrupp-baserade skada skriptet.

uv.ailogic.tractioncontrol=Antispinn
uv.ailogic.tractioncontrol.desc=AI-Racers och Enheter kommer tillämpa sänkt gas när de tappar kontroll.\n\nNotis: Fungar endast på Glide- och Simfphys-fordon.

uv.ailogic.disengageonheatchange=Reträtt vid ändring av spaningsnivå
uv.ailogic.disengageonheatchange.desc=AI-enheter kommer dra sig tillbaks om deras fordon inte matchar tillämpade fordon när spaningsnivån ändras.\n\nResurspoäng kommer inte ändras under processen.\n\nNotera: Gäller inte Lednings-, Noshörnings- eller AI-enheter som läggs till manuellt.

uv.ainav=AI-Navigering
uv.ainav.pathfind=Vägfinnare
uv.ainav.pathfind.desc=AI:n använder ett* vägfinnande algoritm med navmesh / Decent Vehicles waypoints för att navigera.\n\nPåverkar prestandan.
uv.ainav.dvpriority=DV Waypoint Prioritet
uv.ainav.dvpriority.desc=AI:n kommer försöka navigera med Decent Vehicle Waypoints innan den försöker navigera med navmesh (om tillgänglig).
uv.ainav.dvdistancebased=DV Waypoint distansbaserat
uv.ainav.dvdistancebased.desc=AI:n kommer använda distansbaserat tillvägagångssätt för att navigera på Decent Vehicle waypoints.\n\nAvstängt: Direkt engagerande när misstänkt är i vy.\n\nAktiverat: Navigera via waypoints om för långt bort från misstänkt.
uv.ainav.dvnavoptimized=Optimerade DV-navigering
uv.ainav.dvnavoptimized.desc=Om påslaget så kommer AI:n använda en optimerad vägfinnande algoritm för att navigera DV Waypoints. Avaktivera om du upptäcker problem med enheternas navigering.\n\nAnvänds bäst på InfMap-kartor med många waypoints.\n\n<color=255,255,0>EXPERIMENTAL FUNKTION</color>


#---------- New Settings Menu, AI
uv.uvset.title=UV-Inställningar

uv.ui.menu=UV-Menyn
uv.ui.menu.desc=Ändra hur UV-menyn ser ut genom att ändra dess färger och diverse funktioner i denna meny.

uv.ui.menu.hidedesc=Tvinga att beskrivningen göms
uv.ui.menu.hidedesc.desc=Tvingar att beskrivning-fliken göms i alla UV-Meny-flikar, och gör att menyns bredd blir kortare.\n\nMåste ladda om menyinstansen för att ändringen ska visas.

uv.ui.menu.hideprompts=Force-Tvinga att knappar göms
uv.ui.menu.hideprompts.desc=Tvingar att knapp-fliken göms i alla UV-Meny-flikar.\n\nMåste ladda om menyinstansen för att ändringen ska visas.

uv.ui.menu.openspeed=Öppna hastighet
uv.ui.menu.openspeed.desc=Hur länge det tar för menyn att öppnas.\n\nMäts i sekunder.

uv.ui.menu.closespeed=Stäng hastighet
uv.ui.menu.closespeed.desc=Hur länge det tar för menyn att stängas.\n\nMäts i sekunder.

uv.ui.menu.custcol=Anpassa färger
uv.ui.menu.custcol.desc=Anpassa färgerna i UV-menyn.

uv.ui.dataimport=Dataimport
uv.ui.dataimport.desc=Ändrar hur importerande av första- och tredjeparti data hanteras.

uv.ui.dataimport.enableimport=Aktivera dataimport
uv.ui.dataimport.enableimport.desc=Tillåt automatisk skanning efter ny UV-Data vid uppstart.\n\n<color=255,100,100>Varning</color>: Kan göra att spelet hänger sig beroende på hur mycket data som finns i dina tillägg.

uv.ui.dataimport.enablereplace=Aktivera dataersättning
uv.ui.dataimport.enablereplace.desc=Aktiverar automatisk skanning efter ändrad UV-Data vid uppstart.\n\n<color=255,100,100>Varning</color>: Kan göra att spelet hänger sig beroende på hur mycket data som finns i dina tillägg.

uv.ui.dataimport.scan=Skanna efter ny och ändrad data
uv.ui.dataimport.scan.desc=Skannar manuellt efter ny och ändrad UV-Data.\n\n<color=255,100,100>Varning</color>: Kan göra att spelet hänger sig beroende på hur mycket data som finns i dina tillägg.

uv.ui.dataimport.replaceserver=[SERVER] Gå igenom ändrad data
uv.ui.dataimport.replaceserver.desc=Öppnar UV-Data ersättningsnotisen som tillåter att en administratör godkänner ersättningen av UV-Data.\n\n<color=255,100,100>Varning</color>: Kan göra att spelet hänger sig beroende på hur mycket data som finns i dina tillägg.

uv.ui.dataimport.workshoppriority=Workshop prioritet
uv.ui.dataimport.workshoppriority.desc=Om påslaget så kommer innehåll från Workshop prioriteras över lokalt innehåll.\n\nDetta tillåter Workshop-tillägg att fortsätta uppdateras ifall du har deras filer i din lokala data-mapp (som du borde kanske plocka bort).\nAvaktivera detta ifall du vill använda/jobba med lokalt innehåll istället för Workshop-innehåll.\n\n<color=255,255,0>Notera</color>: Ändring av denna inställning kräver att kartan laddas om!

#---------- Built-in Addons
uv.vcmod.els=VCMod ELS-Prioritet
uv.vcmod.els.desc=Enheter som användar bas HL2-fordon kommer försöka använda VCMods ELS istället för Photon ifall båda är installerade.

uv.lvs.alwaysfullthrottle=Alltid full gas
uv.lvs.alwaysfullthrottle.desc=Använd alltid full gas utan att behöva hålla inne gaspedal modiferaren.


#---------- New Settings Menu, Debug
uv.debug=Debug-Meny

uv.debug.warning=GÅR IN I DEBUG-MENY
uv.debug.warning.desc=Du håller på att gå in i debug-menyn till Unit Vehicles.\n\nDessa element är inte för allmän användning men kan användas för att testa diverse element och funktioner för att försäkra att dem fungerar.\n\nNotera att dessa funktioner är gjorda för utvecklare och bidragsgivare, och alla klagomål gjorda av normala användare angående användningen, inklusive fel, kommer ignoreras.\n\nÄr du säker på att du vill fortsätta?

uv.debug.confirm=Godkänn & fortsätt
uv.debug.cancel=Avbryt & återvänd

uv.debug.raceresults=Inbillade Raceresultat - %s Racers

uv.debug.pursuitresults.racer=Inbillade Jaktresultat (Racers)
uv.debug.pursuitresults.units=Inbillade Jaktresultat (Enheter)
uv.debug.pursuitresults.escaped=Undkom
uv.debug.pursuitresults.busted=Arresterad

uv.debug.infraction=%s inbillade överträdelser
