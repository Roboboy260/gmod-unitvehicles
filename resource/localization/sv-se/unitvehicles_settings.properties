#---------- First Time Settings
uv.ft=Förstagångsinstallation

uv.ft.title=Välkommen till Unit Vehicles!
uv.ft.desc=Unit Vehicles är ett Sandbox-orienterat tillägg som tillåter spelare, i både flerpselareläget med andra, eller i enkelspelare med AI, att ta del i jakter i hög hastighet som eller mot polisen, och häftiga race på vilken karta som helst.\n\nDenna förstagångsinstallation kommer gå igenom vissa inställningar som kommer ge dig den bästa möjliga upplevelsen.

uv.ft.preset.title=Välj en förinställning
uv.ft.preset.desc=Unit Vehicles tillåter dig att ta del i jakter som eller mot AI och spelare-kontrollerade enheter. Du kan justera varje variabel, exempelvis hur många enheter som finns, hur länge förstärkning tar, och om Luftenheten och vägspärrar kan uppstå.\n\nVänligen välj en Spaningsnivå Förinställning för att fortsätta.
uv.ft.preset.desc2=Du hittar dessa inställningar i [string:uv.pm] -- [string:uv.hm].

uv.ft.bases=Fordonsbaser
uv.ft.bases.desc=Unit Vehicles tillåter dig att använda olika fordonsbaser. Däremot så kan AI:n endast uppstå med en förinställd fordonsbas.\n\nVänligen gå igenom vila Fordonsbaser du vill att AI:n skall använda.

uv.ft.bases.units=Enheternas bas
uv.ft.bases.airacer=AI-Racer bas
uv.ft.bases.traffic=Trafikens bas

uv.ft.general.desc=Unit Vehicles har en massiv lista av olika inställningar du kan justera.\n\nVänligen gå igenom dem olika inställningarna, exempelvis välja ditt gränssnitt, UVTrax™-profil och diverse andra grejer.

uv.ft.racing.desc=Unit Vehicles tillåter dig att köra på spelare-skapade banor och sprint-banor med eller mot andra spelare och AI-racers.\n\nVänligen gå igenom dina Raceinställningar.
uv.ft.racing.desc2=Du hittar dessa inställningar i [string:uv.rm] -- [string:uv.rm.options] efter du laddat en bana.

uv.ft.racing.ai.title=Racing med AI
uv.ft.racing.ai.desc=Du kan köra race med AI-motståndare, och det finns två sätt att göra det:
uv.ft.racing.ai.desc2=1) Bocka [string:uv.airacer.override]-knappen nedanför, och välj därefter fordonen du vill att AI:n ska uppstå i med [+attack2].\n2) Bocka den inte, och skapa fordon manuellt som AI:n kan använda med verktyget [string:tool.uvracermanager.name].\n\nDu hittar denna inställning i [string.uv.airacer]-fliken.

uv.ft.end.title=FÄRDIG
uv.ft.end.desc=Så var vi klara!\n\nDu kan nu gå och uppleva jakter i hög hastighet och häftiga race på vilken bana du kan tänka på!
uv.ft.end.desc2=Du kan gå igenom [string:uv.faq]-fliken om du har några frågor.\n\nOm du upptäcker en bugg eller glitch, eller behöver hjälp med något som [string:uv.faq] inte tar upp, vänligen besök oss på vår Discord-server!

uv.ft.next=Nästa
uv.ft.prev=Föregående
uv.ft.finish=Färdig

uv.ft.force=Tvinga på förstagångsinstallation igen
uv.ft.force.desc=Om påslaget så kommer förstagångsinstallationen öppnas igen nästa gång du öppnar UV-menyn.

uv.ft.skip=Skippa (Ej rekommenderat)

