uv.rm.options.dnftimer.desc=Påbörjar en timer när första tävlande kör över mållinjen; när den når noll så avslutas racet automatiskt och diskvalificerar alla som inte ännu kört över linjen.\n\nSätt till 0 för att avaktivera.
