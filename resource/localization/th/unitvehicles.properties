uv.ptech.spikes=แผงตะปูหยุดรถ
uv.ptech.spikes.short=สไปค์
uv.ptech.spikes.desc=แผงตะปูหยุดรถจะขยายตัวอย่างรวดเร็วเมื่อกางออกจากด้านหลังของรถ เพื่อสร้างความเสียหายให้กับยางรถยนต์ทุกคันที่วิ่งทับ และอาจตกลงมาโดนรถหลายคันได้หากไม่สามารถหลีกเลี่ยงได้.

uv.ptech.spikes.activated=แผงตะปูหยุดรถถูกนำไปใช้งาน

uv.ptech.spikes.tiresreinflate=การเติมลมยาง

uv.ptech.shockram=โช้คอัพแรม
uv.ptech.shockram.short=ชราม
uv.ptech.shockram.desc=ระบบโช้คอัพแรมสร้างคลื่นกระแทกเสียงจากด้านหน้าของรถ ซึ่งจะผลักและสร้างความเสียหายให้กับรถคันใดก็ตามที่เข้ามาติดกับดัก

uv.ptech.shockram.activated=โช้คอัพแรมทำงานแล้ว
uv.ptech.shockram.hit=คุณตี %s ด้วยโช้คอัพแรม
uv.ptech.shockram.hit.you=%s กระแทกคุณด้วยโช้คอัพแรม

uv.ptech.gpsdart=GPS Dart
uv.ptech.gpsdart.short=GPS
uv.ptech.gpsdart.desc=GPS Dart คือระบบติดแท็กยานพาหนะที่ปล่อยออกมาจากด้านหน้าของยานพาหนะ เพื่อติดแท็ก ติดตาม และระบุตำแหน่งของยานพาหนะที่กำลังหลบหนี

uv.ptech.gpsdart.activated=GPS DART ใช้งานแล้ว
uv.ptech.gpsdart.missed=GPS DART พลาด

uv.ptech.gpsdart.hit=คุณตี %s ด้วย GPS Dart
uv.ptech.gpsdart.hit.you=%s ยิงคุณด้วยลูกดอก GPS

uv.ptech.expbarrel=ถังระเบิด

