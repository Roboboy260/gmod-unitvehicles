# Units Only
uv.ptech.killswitch=สวิตช์ตัดการทำงานฉุกเฉิน
uv.ptech.killswitch.short=KILLSW
uv.ptech.killswitch.desc=สวิตช์ตัดการทำงานฉุกเฉินจะเล็งเป้าหมายและล็อกเป้าหมายไปที่รถคันข้างหน้าก่อนจะส่งคลื่นไฟฟ้าสถิตย์จำนวนมหาศาลเพื่อปิดระบบไฟฟ้าของรถชั่วคราว.

uv.ptech.killswitch.activated=สวิตช์ตัดการทำงานฉุกเฉินเปิดใช้งานแล้ว
uv.ptech.killswitch.lockingon=สวิตช์ตัดการทำงานฉุกเฉินล็อคอยู่
uv.ptech.killswitch.dodged=สวิตช์ตัดการทำงานฉุกเฉินหลีกเลี่ยง
uv.ptech.killswitch.hit=คุณตี %s ด้วยสวิตช์ตัดการทำงานฉุกเฉิน
uv.ptech.killswitch.hit.you=%s ตีคุณด้วยสวิตช์ตัดการทำงานฉุกเฉิน

uv.ptech.killswitch.engine.on=เครื่องยนต์สตาร์ทใหม่
uv.ptech.killswitch.getclose=เข้าใกล้เพื่อใช้สวิตช์ตัดการทำงานฉุกเฉิน
uv.ptech.killswitch.novalid=ไม่มีเป้าหมายที่ถูกต้องสำหรับสวิตช์ตัดการทำงานฉุกเฉิน

