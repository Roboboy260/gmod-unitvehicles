# Shared
uv.ptech.emp=พัลส์แม่เหล็กไฟฟ้า
uv.ptech.emp.short=EMP
uv.ptech.emp.desc=พัลส์แม่เหล็กไฟฟ้า (EMP) เป้าหมายและล็อคเป้าหมายที่รถคันข้างหน้าก่อนจะส่งพัลส์ไฟฟ้าสถิตขนาดใหญ่เพื่อปิดระบบไฟฟ้าชั่วคราว.

uv.ptech.emp.activated=เปิดใช้งานอีเอ็มพีแล้ว
uv.ptech.emp.lockingon=ล็อค EMP
uv.ptech.emp.missed=EMP พลาด
uv.ptech.emp.dodged=หลีกเลี่ยง EMP
uv.ptech.emp.notarget=ไม่มีเป้าหมายที่ถูกต้องสำหรับ EMP

uv.ptech.emp.hit=คุณตี %s ด้วย EMP
uv.ptech.emp.hit.you=%s ตีคุณด้วย EMP

uv.ptech.esf=สนามไฟฟ้าสถิต
uv.ptech.esf.short=ESF
uv.ptech.esf.desc=สนามไฟฟ้าสถิต (ESF) ชาร์จพลังให้กับตัวรถของคุณด้วยสนามไฟฟ้าสถิตอันทรงพลังที่ช่วยปกป้องรถของคุณจากระเบิดไฟฟ้าและการล็อก EMP และสร้างแรงกระแทกอันทรงพลังให้กับใครก็ตามที่สัมผัสมัน.

uv.ptech.esf.activated=ESF เปิดใช้งานแล้ว
uv.ptech.esf.hit=คุณตี %s ด้วย ESF
uv.ptech.esf.hit.you=%s ตีคุณด้วย ESF

uv.ptech.repairkit=ชุดซ่อม
uv.ptech.repairkit.short=ซ่อมแซม
uv.ptech.repairkit.desc=ชุดซ่อมจะติดตั้งระบบซ่อมแซมออนบอร์ดที่เปิดใช้งานการซ่อมแซมภาคสนามอย่างรวดเร็วสำหรับรถของคุณ โมดูลซ่อมแซมอัตโนมัติได้รับการออกแบบโดยคำนึงถึงการรับมือกับเหตุฉุกเฉินและการเคลื่อนที่เชิงยุทธวิธี ช่วยฟื้นฟูโครงสร้างรถของคุณให้กลับมาสมบูรณ์ด้วยส่วนประกอบแบบซีลในตัวและระบบไฮดรอลิกเสริมแรง.

uv.ptech.repairkit.activated=ชุดซ่อมพร้อมใช้งานแล้ว

# Racers Only
uv.ptech.jammer=เครื่องรบกวนสัญญาณ
uv.ptech.jammer.short=Jam
uv.ptech.jammer.desc=เครื่องรบกวนสัญญาณล้อมรอบรถของคุณด้วยสนามชั่วคราวที่ช่วยปกป้องรถของคุณจากการกระทบของเทคโนโลยี และรบกวน HUD ของผู้ขับขี่รายอื่นในบริเวณใกล้เคียง ป้องกันไม่ให้เพอร์ซูทเทคถูกใช้งาน.

uv.ptech.jammer.activated=เปิดใช้งานเครื่องรบกวนสัญญาณแล้ว
uv.ptech.jammer.hit.you=ติดขัด

uv.ptech.shockwave=คลื่นกระแทก
uv.ptech.shockwave.short=SHWAV
uv.ptech.shockwave.desc=คลื่นกระแทกจะสร้างคลื่นกระแทกโซนิคจากบริเวณกลางรถซึ่งจะผลักรถออกไปและสร้างความเสียหายให้กับรถที่อยู่ใกล้เคียง.

uv.ptech.shockwave.activated=คลื่นกระแทกถูกนำมาใช้
uv.ptech.shockwave.hit=คุณตี %s ด้วยคลื่นกระแทก
uv.ptech.shockwave.hit.you=%s กระแทกคุณด้วยคลื่นกระแทก

uv.ptech.stunmine=เหมืองสตัน
uv.ptech.stunmine.short=MINE
uv.ptech.stunmine.desc=มีการติดตั้งทุ่นระเบิดไว้ด้านหลังรถของคุณ ซึ่งหากเกิดการชนจนเกินพิกัด ระบบไฟฟ้าของรถจะเสียหายและสูญเสียการควบคุม.

uv.ptech.stunmine.activated=ระเบิดสตันถูกใช้งาน
uv.ptech.stunmine.hit=คุณตี %s ด้วยระเบิดสตัน
uv.ptech.stunmine.hit.you=%s โจมตีคุณด้วยระเบิดสตัน

uv.ptech.powerplay=Powerplay
uv.ptech.powerplay.short=PWR
uv.ptech.powerplay.desc=การเปิดใช้งาน Powerplay จะทำให้ผู้ทำลายการแสวงหาที่อยู่ใกล้คนขับที่สุดทำงาน ส่งผลให้รถพังทลายลงมา

uv.ptech.powerplay.activated=เปิดใช้งาน POWERPLAY แล้ว
uv.ptech.powerplay.nopb=ไม่มีผู้ทำลายการไล่ล่าในบริเวณใกล้เคียง

uv.ptech.juggernaut=จั๊กเกอร์นอต
uv.ptech.juggernaut.short=จั๊กก์
uv.ptech.juggernaut.desc=จั๊กเกอร์นอตเพิ่มพลังการพุ่งชนของยานพาหนะของคุณอย่างมหาศาล ทำให้สามารถทำลายสิ่งกีดขวางและยานพาหนะที่ปิดกั้นได้ง่ายขึ้น

uv.ptech.juggernaut.activated=จั๊กเกอร์นอตเปิดใช้งานแล้ว

