uv.ptech.slot.right=ช่องที่ 2

# Stats
uv.ptech.duration=ระยะเวลา
uv.ptech.duration.desc=เพอร์ซูทเทคนี้จะยังคงใช้งานอยู่ได้นานแค่ไหน

uv.ptech.power=พลัง
uv.ptech.power.desc=เพอร์ซูทเทคนี้มีพลังขนาดไหน

uv.ptech.damage=ความเสียหายจากการโจมตี
uv.ptech.damage.desc=คูณความเสียหายที่เกิดขึ้นเมื่อถูกโจมตี.\nตั้งเป็น 1 เพื่อสร้างความเสียหายเต็มที่.

uv.ptech.damagecommander=ความเสียหายจากการโจมตีของผู้บัญชาการ
uv.ptech.damagecommander.desc=คูณความเสียหายที่เกิดขึ้นเมื่อโจมตีผู้บัญชาการ.\nตั้งเป็น 1 เพื่อสร้างความเสียหายเต็มที่.

uv.ptech.cooldown=เวลาคูลดาวน์
uv.ptech.cooldown.desc=ต้องใช้เวลานานแค่ไหนจึงจะสามารถนำเพอร์ซูทเทคนี้กลับมาใช้ได้อีกครั้ง.

uv.ptech.maxammo=จำนวนกระสุนที่บรรจุได้สูงสุด
uv.ptech.maxammo.desc=อุปกรณ์ Pursuit Tech นี้สามารถใช้งานได้กี่ครั้งก่อนที่จะหมดพลังงาน?\nตั้งค่าเป็น 0 เพื่อใช้งานได้ไม่จำกัด.

uv.ptech.maxdistance=พิสัย
uv.ptech.maxdistance.desc=เป้าหมายต้องอยู่ใกล้แค่ไหน เทคโนโลยีติดตามเป้าหมายนี้จึงจะทำงาน.\nวัดเป็นหน่วยแฮมเมอร์ (Hammer Units)

uv.ptech.force=บังคับ
uv.ptech.force.desc=แรงที่ใช้ในการโจมตีเป้าหมายมีปริมาณเท่าใด.

uv.ptech.lockontime=เวลาล็อกเป้าหมาย
uv.ptech.lockontime.desc=เทคโนโลยีติดตามเป้าหมายนี้ใช้เวลานานแค่ไหนในการล็อกเป้าหมาย?

uv.ptech.disableduration=ระยะเวลาปิดใช้งาน
uv.ptech.disableduration.desc=รถยนต์ที่ถูกเทคโนโลยี Pursuit Tech นี้ชนจะใช้งานไม่ได้นานแค่ไหน.

