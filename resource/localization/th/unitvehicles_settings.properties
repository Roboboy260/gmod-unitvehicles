uv.ft.force=เปิดใช้งานการตั้งค่าครั้งแรกอีกครั้ง
uv.ft.force.desc=หากเปิดใช้งานไว้ ครั้งต่อไปที่คุณเปิดเมนู UV คุณจะต้องทำการตั้งค่าครั้งแรกอีกครั้ง

