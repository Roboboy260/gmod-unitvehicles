uv.hm.minhl=ระดับความร้อนต่ำสุด
uv.hm.minhl.desc=กำหนดระดับความร้อนขั้นต่ำที่คุณสามารถเข้าถึงได้ในการไล่ล่า ระดับที่สูงขึ้นจะทำให้มีหน่วยรบที่ดุดันมากขึ้น

uv.hm.maxhl=ระดับความร้อนสูงสุด
uv.hm.maxhl.desc=กำหนดระดับความร้อนสูงสุดที่คุณสามารถเข้าถึงได้ในการไล่ล่า ระดับที่ต่ำกว่าจะทำให้หน่วยรบมีความก้าวร้าวน้อยลง

uv.hm.enablept=หน่วยรบสามารถเกิดมาพร้อมกับเทคโนโลยีการไล่ล่าได้
uv.hm.enablept.desc=อนุญาตให้หน่วยรบเกิดมาพร้อมกับเทคโนโลยีการไล่ล่า\n\nหน่วยลาดตระเวนและหน่วยสนับสนุนจะไม่ปรากฏพร้อมกับเทคโนโลยีการไล่ล่า ไม่ว่าคุณจะเปิดใช้งานเทคโนโลยีนี้หรือไม่ก็ตาม

uv.hm.pt.spawnwith=อนุญาตให้ Pursuit Tech ดำเนินการ
uv.hm.pt.spawnwith.desc=เปิดใช้งานหากยูนิตที่ควบคุมโดย AI และผู้เล่นสามารถเกิดมาพร้อมกับและใช้เทคโนโลยีการไล่ล่านี้ได้
uv.hm.pt.spawnwith.desc.air=เปิดใช้งานหากหน่วยบินตำรวจสามารถใช้เทคโนโลยี Pursuit Tech นี้ได้

uv.hm.commander=การตั้งค่าผู้บัญชาการ
