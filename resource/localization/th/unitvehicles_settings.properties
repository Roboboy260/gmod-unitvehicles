uv.hm.commander.norepair=จำกัดร้านซ่อม
uv.hm.commander.norepair.desc=หากเปิดใช้งานฟังก์ชันนี้ หน่วยบัญชาการจะไม่สามารถใช้ร้านซ่อมเพื่อซ่อมยานพาหนะของตนได้\n\nโปรดทราบว่าพวกเขายังสามารถใช้มันเพื่อเติมพลังให้กับ Pursuit Tech ได้

uv.hm.air=ตั้งค่าหน่วยบินตำรวจ
