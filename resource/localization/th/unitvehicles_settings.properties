uv.ailogic=ตรรกะ AI

uv.ailogic.optimizerespawn=เพิ่มประสิทธิภาพการเกิดใหม่
uv.ailogic.optimizerespawn.desc=หน่วยรบจะเทเลพอร์ตไปข้างหน้าผู้ต้องสงสัยแทนที่จะเกิดใหม่\n\nช่วยเพิ่มประสิทธิภาพ
# uv.ailogic.trafficstreaming=Traffic Streaming
# uv.ailogic.trafficstreaming.desc=Traffic and patrolling Units will despawn when they are too far away from the player, thus allowing new ones to spawn.\n\nImpacts performance.
uv.ailogic.relentless=ไม่ย่อท้อ
uv.ailogic.relentless.desc=หน่วย AI จะมีพฤติกรรมก้าวร้าวมากขึ้น เหมือนกับตำรวจในเกม NFS Rivals\n\nพวกเขาจะละเลยความปลอดภัยของตนเองเพื่อให้งานสำเร็จลุล่วง
uv.ailogic.wrecking=เปิดใช้งานการทำลายล้าง
uv.ailogic.wrecking.desc=ยานพาหนะประเภทต่างๆ อาจเสียหายจนใช้การไม่ได้
uv.ailogic.detectionrange=ระยะการตรวจจับ
uv.ailogic.detectionrange.desc=ระยะห่างขั้นต่ำในการเกิดของยูนิตจากยานพาหนะใน Hammer Units เมื่อทำการสร้างยูนิตด้วยตนเอง\n\nให้ใช้ค่าที่สูงขึ้นหากคุณมีปัญหาในการสร้างยูนิต

uv.ailogic.headlights=เปิดไฟหน้า
uv.ailogic.headlights.desc=รถยนต์ AI จะใช้ไฟหน้า\n\nส่งผลต่อประสิทธิภาพการทำงาน
uv.ailogic.headlights.off=ปิดตลอดเวลา
uv.ailogic.headlights.auto=อัตโนมัติ
uv.ailogic.headlights.always=เปิดใช้งานตลอดเวลา

uv.ailogic.usenitrousracer=ไนตรัสสำหรับนักแข่ง AI
uv.ailogic.usenitrousracer.desc=อนุญาตให้ผู้เล่น AI ใช้ไนโตรได้\n\nหมายเหตุ: ใช้ได้เฉพาะกับรถยนต์ Glide เท่านั้น
uv.ailogic.usenitrousunit=ไนตรัสสำหรับหน่วย AI
uv.ailogic.usenitrousunit.desc=อนุญาตให้หน่วย AI ใช้ไนตรัสออกไซด์ได้\n\nหมายเหตุ: ใช้ได้เฉพาะกับรถยนต์ Glide เท่านั้น

uv.ailogic.autohealthracer=ความทนทานไม่จำกัดสำหรับนักแข่ง AI
uv.ailogic.autohealthracer.desc=มอบความทนทานของยานพาหนะแบบไม่จำกัดให้กับนักแข่ง AI

uv.ailogic.customizeracer=ปรับแต่งรถของนักแข่ง AI
uv.ailogic.customizeracer.desc=นักแข่ง AI จะเลือกสี สกิน และกลุ่มตัวถังแบบสุ่มเมื่อถูกสร้างขึ้นในยานพาหนะ\n\nหมายเหตุ: ใช้ไม่ได้กับยานพาหนะ Glide ที่ใช้สคริปต์ความเสียหายแบบอิงตาม bodygroup

uv.ailogic.tractioncontrol=ระบบควบคุมการยึดเกาะ
uv.ailogic.tractioncontrol.desc=นักแข่งและยูนิต AI จะลดกำลังเครื่องยนต์ลงเมื่อสูญเสียการยึดเกาะ\n\nหมายเหตุ: ใช้ได้เฉพาะกับยานพาหนะ Glide และ Simfphys เท่านั้น

# uv.ailogic.disengageonheatchange=Disengage on Heat Change
# uv.ailogic.disengageonheatchange.desc=AI Units will fall back if their vehicle does not match any of the assigned vehicles when the Heat Level changes.\n\nResource Points does not get drained in the process.\n\nNote: Does not apply to Commander Units, Rhino Units and AI Units that are spawned in manually.

uv.ainav=ระบบนำทาง AI
uv.ainav.pathfind=การค้นหาเส้นทาง
uv.ainav.pathfind.desc=AI จะใช้อัลกอริธึมการค้นหาเส้นทาง A* โดยใช้ navmesh / Decent Vehicle waypoints เพื่อการนำทาง\n\nส่งผลต่อประสิทธิภาพการทำงาน
uv.ainav.dvpriority=ลำดับความสำคัญของจุดอ้างอิง DV
uv.ainav.dvpriority.desc=AI จะพยายามนำทางโดยใช้ Decent Vehicle Waypoints ก่อนที่จะลองนำทางผ่านระบบนำทาง (ถ้ามี)
# uv.ainav.dvdistancebased=DV Waypoint Distance-Based
# uv.ainav.dvdistancebased.desc=AI will use a distance-based approach to navigate on Decent Vehicle Waypoints.\n\nDisabled = Direct engaging when suspect is in view.\n\nEnabled = Navigate via waypoints if too far from suspect.
# uv.ainav.dvnavoptimized=Optimized DV Navigation
# uv.ainav.dvnavoptimized.desc=If enabled, AI will use an optimized pathfinding algorithm to navigate on DV Waypoints. Disable if you are encountering issues with Units navigating.\n\nMost useful on InfMap maps with many waypoints present.\n\n<color=255,255,0>EXPERIMENTAL FEATURE</color>


