uv.hm.air.pt.desc=หากเปิดใช้งาน หน่วยเฮลิคอปเตอร์สามารถใช้เทคโนโลยีการไล่ล่านี้ได้\n\nหากปิดใช้งาน "อนุญาตเทคโนโลยีติดตาม" จะไม่มีผลใดๆ

