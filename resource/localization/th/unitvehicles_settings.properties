uv.hm.commander.solo.desc=หากเปิดใช้งาน จะมีการส่งหน่วยบัญชาการเพียงหน่วยเดียวไปไล่ล่า\n\nในขณะที่หน่วยบัญชาการกำลังปฏิบัติการ จะมีหน่วยสนับสนุนไม่จำกัดจำนวน

uv.hm.commander.health=ผู้บัญชาการสุขภาพ
