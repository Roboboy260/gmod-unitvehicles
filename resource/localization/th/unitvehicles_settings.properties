uv.ui.menu=เมนู UV
uv.ui.menu.desc=เปลี่ยนรูปลักษณ์ของเมนู UV โดยการปรับเปลี่ยนสีและฟังก์ชันต่างๆ ในเมนูนี้

uv.ui.menu.hidedesc=บังคับซ่อนคำอธิบาย
uv.ui.menu.hidedesc.desc=คำสั่งนี้จะซ่อนแท็บคำอธิบายในแท็บ UV Menu ทั้งหมดโดยทันที และส่งผลให้ความกว้างของเมนูลดลง\n\nต้องรีโหลดเมนูเพื่อให้การเปลี่ยนแปลงปรากฏขึ้น

uv.ui.menu.hideprompts=บังคับซ่อนข้อความแจ้งเตือน
uv.ui.menu.hideprompts.desc=ซ่อนข้อความแจ้งเตือนในแท็บเมนู UV ทั้งหมดโดยเด็ดขาด\n\nต้องรีโหลดเมนูเพื่อให้การเปลี่ยนแปลงปรากฏขึ้น

uv.ui.menu.openspeed=ความเร็วเปิด
uv.ui.menu.openspeed.desc=เมนูใช้เวลานานแค่ไหนในการเปิดขึ้นมา\n\nวัดเป็นวินาที

uv.ui.menu.closespeed=ความเร็วในการเข้าใกล้
uv.ui.menu.closespeed.desc=เมนูใช้เวลาปิดนานเท่าใด\n\nวัดเป็นวินาที

uv.ui.menu.custcol=ปรับแต่งสี
uv.ui.menu.custcol.desc=ปรับแต่งสีของเมนู UV ได้ตามต้องการ

