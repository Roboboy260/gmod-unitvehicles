#---------- First Time Settings
uv.ft=การตั้งค่าครั้งแรก

uv.ft.title=ยินดีต้อนรับสู่ Unit Vehicles!
uv.ft.desc=Unit Vehicles เป็นแอดออนที่เน้นโหมดแซนด์บ็อกซ์ ซึ่งเปิดโอกาสให้ผู้เล่นทั้งในโหมดมัลติเพลเยอร์กับผู้อื่น หรือโหมดซิงเกิลเพลย์ออฟกับ AI ได้มีส่วนร่วมในการไล่ล่าด้วยความเร็วสูงในบทบาทตำรวจหรือต่อสู้กับตำรวจ และการแข่งขันสุดเร้าใจบนแผนที่ใดก็ได้\n\nการตั้งค่าครั้งแรกนี้จะอธิบายการตั้งค่าต่างๆ ที่จะช่วยให้คุณได้รับประสบการณ์ที่ดีที่สุดเท่าที่จะเป็นไปได้

uv.ft.preset.title=เลือกค่าที่ตั้งไว้ล่วงหน้า
uv.ft.preset.desc=Unit Vehicles ช่วยให้คุณสามารถไล่ล่าหรือต่อสู้กับหน่วยที่ควบคุมโดย AI หรือผู้เล่นได้ คุณสามารถปรับแต่งตัวแปรทุกอย่างได้ เช่น จำนวนหน่วยที่มีอยู่ ความถี่ในการส่งกำลังเสริมมาถึง หรือว่าหน่วยทางอากาศและด่านตรวจสามารถปรากฏตัวได้หรือไม่\n\nโปรดเลือกค่าระดับความร้อนที่ตั้งไว้ล่วงหน้าเพื่อดำเนินการต่อ
uv.ft.preset.desc2=คุณสามารถค้นหาการตั้งค่าเหล่านี้ได้ใน [string:uv.pm] -- [string:uv.hm].

uv.ft.bases=ฐานยานพาหนะ
uv.ft.bases.desc=Unit Vehicles ช่วยให้คุณสามารถใช้ฐานยานพาหนะได้หลากหลายรูปแบบ อย่างไรก็ตาม AI จะสามารถสร้างได้โดยใช้ฐานยานพาหนะที่เลือกไว้ล่วงหน้าเพียงฐานเดียวเท่านั้น\n\nโปรดตรวจสอบว่าคุณต้องการให้ AI ใช้ฐานยานพาหนะใดบ้าง

uv.ft.bases.units=ฐานหน่วย
uv.ft.bases.airacer=ฐานนักแข่ง AI
uv.ft.bases.traffic=ฐานการจราจร

uv.ft.general.desc=Unit Vehicles มีการตั้งค่าต่างๆ มากมายให้เลือกปรับแต่งได้\n\nโปรดตรวจสอบการตั้งค่าต่างๆ เช่น การเลือกประเภท HUD ที่ต้องการ โปรไฟล์ UVTrax™ และอื่นๆ อีกมากมาย

uv.ft.racing.desc=Unit Vehicles ช่วยให้คุณสามารถแข่งในสนามแข่งที่ผู้เล่นสร้างขึ้น และแข่งแบบสปรินต์กับผู้เล่นคนอื่น ๆ และนักแข่ง AI ได้\n\nโปรดตรวจสอบการตั้งค่าการแข่งขันของคุณ
uv.ft.racing.desc2=คุณสามารถค้นหาการตั้งค่าเหล่านี้ได้ใน [string:uv.rm] -- [string:uv.rm.options], หลังจากที่คุณโหลดแทร็กเสร็จแล้ว

uv.ft.racing.ai.title=การแข่งรถกับ AI
uv.ft.racing.ai.desc=คุณสามารถแข่งกับคู่ต่อสู้ที่เป็น AI ได้ และมีสองวิธีที่จะทำเช่นนั้นได้:
uv.ft.racing.ai.desc2=1) ทำเครื่องหมายถูกที่ช่อง [string:uv.airacer.override] คลิกปุ่มด้านล่าง จากนั้นเลือกยานพาหนะที่คุณต้องการให้ AI ใช้ในการสร้างตัวละครโดยใช้ปุ่มนั้น [+attack2].\n2) อย่าติ๊กช่องนี้ และสร้างยานพาหนะที่ AI สามารถใช้งานได้ด้วยตนเองโดยใช้ [string:tool.uvracermanager.name] เครื่องมือ.\n\nคุณสามารถค้นหาการตั้งค่านี้ได้ใน [string:uv.airacer].

uv.ft.end.title=เสร็จแล้ว
uv.ft.end.desc=จบเพียงเท่านี้!\n\nตอนนี้คุณสามารถไปสัมผัสประสบการณ์การไล่ล่าความเร็วสูงและการแข่งขันสุดเร้าใจบนแผนที่ใดก็ได้ที่คุณนึกออก!
uv.ft.end.desc2=คุณสามารถตรวจสอบได้ [string:uv.faq] หากคุณมีคำถามเพิ่มเติมใดๆ\n\nหากคุณพบข้อผิดพลาดหรือความบกพร่อง หรือต้องการความช่วยเหลือในเรื่องใดๆ [string:uv.faq] หากไม่ได้ระบุไว้ โปรดเยี่ยมชมเราได้ที่เซิร์ฟเวอร์ Discord ของเรา!

