uv.ptech.killswitch=Вимикач
uv.ptech.killswitch.short=ВМКЧ
uv.ptech.killswitch.desc=Вимикач націлюється і фіксує автомобілі попереду, після чого випускає потужний електростатичний імпульс, тимчасово вимикаючи їх електроніку.

uv.ptech.killswitch.activated=ВИМИКАЧ АКТИВОВАНО
uv.ptech.killswitch.lockingon=ВИМИКАЧ ФІКСУЄ ЦІЛЬ
uv.ptech.killswitch.dodged=ВИМИКАЧ УНИКНУТО
uv.ptech.killswitch.hit=Ви влучили %s Вимикачем
uv.ptech.killswitch.hit.you=%s влучив по вам Вимикачем

uv.ptech.killswitch.engine.on=ДВИГУН ПЕРЕЗАПУЩЕНО
uv.ptech.killswitch.getclose=НАБЛИЖТЕСЯ ДЛЯ АКТИВАЦІЇ ВИМИКАЧА
uv.ptech.killswitch.novalid=Немає дійсної цілі для Вимикача

