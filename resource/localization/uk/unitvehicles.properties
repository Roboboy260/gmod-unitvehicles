uv.ptech.spikes=Шипові смуги
uv.ptech.spikes.short=ШИПИ
uv.ptech.spikes.desc=Будучи випущеними позаду машини, Шипові смгуи швидко розгортаються, щоб пробити шини будь-якої машини, що проїхала крізь них, а також можуть нашкодити декільком машинам якщо їх неможливо оминути.

uv.ptech.spikes.activated=ШИПОВУ СМУГУ ВИПУЩЕНО

uv.ptech.spikes.tiresreinflate=ШИНИ ВІДНОВЛЕНО

uv.ptech.shockram=Шоковий таран
uv.ptech.shockram.short=ШКТРН
uv.ptech.shockram.desc=Шоковий таран створює надзвуковий удар попереду вашого транспорту що відкидає та пошкоджує будь-який транспорт, що потрапив в нього.

uv.ptech.shockram.activated=ВИПУЩЕНО ШОКОВИЙ ТАРАН
uv.ptech.shockram.hit=Ви вдарили %s шоковим тараном
uv.ptech.shockram.hit.you=%s вдарив(ла) вас шоковим тараном

uv.ptech.gpsdart=GPS-мітка
uv.ptech.gpsdart.short=GPS
uv.ptech.gpsdart.desc=GPS-мітка - це система помічання транспорту, що випускається спереду транспорту та вислідковує транспорт гонщика, який сховався з поля зору.

uv.ptech.gpsdart.activated=GPS-МІТКУ ВИПУЩЕНО
uv.ptech.gpsdart.missed=GPS-МІТКА ПРОМАЗАЛА

uv.ptech.gpsdart.hit=Ви поцілили в %s GPS-міткою
uv.ptech.gpsdart.hit.you=%s поцілив(ла) в вас GPS-міткою

uv.ptech.expbarrel=Вибухова бочка

