# Strings
uv.ptech=Техніка переслідування

uv.ptech.slot.left=Слот 1
uv.ptech.slot.right=Слот 2

# Stats
uv.ptech.duration=Тривалість
uv.ptech.duration.desc=Скільки часу ця технологія залишатиметься активною.

uv.ptech.power=Сила
uv.ptech.power.desc=Скільки міці ця технологія матиме.

uv.ptech.damage=Урон при ударі
uv.ptech.damage.desc=Помножує кількість шкоди, нанесеної при ударі.\nУстановіть 1 для повного значення шкоди.

uv.ptech.damagecommander=Урон при ударі командиру
uv.ptech.damagecommander.desc=Помножує кількість шкоди, нанесеної при ударі командиру.\nУстановіть 1 для повного значення шкоди.

uv.ptech.cooldown=Час на відновлення
uv.ptech.cooldown.desc=Скільки часу потрібно для перезарядки цієї технології.

uv.ptech.maxammo=К-сть зарядів
uv.ptech.maxammo.desc=Скільки разів цю технологію можна використати до повного розрядження.\nУстановіть 0 для нескінченного використання.

uv.ptech.maxdistance=Дальність
uv.ptech.maxdistance.desc=Як близько має бути ціль, щоб ця технологія активувалася.\nВимірюється в Hammer одиницях.

uv.ptech.force=Сила
uv.ptech.force.desc=Скільки сили завдається при ударі по цілі.

uv.ptech.lockontime=Час для прицілу
uv.ptech.lockontime.desc=Скільки часу знадобиться цій технології для зафіксування цілі.

uv.ptech.disableduration=Час виключення
uv.ptech.disableduration.desc=Скільки часу машини, що були вдарені цією технологією, залишатимуться вимкненими.

