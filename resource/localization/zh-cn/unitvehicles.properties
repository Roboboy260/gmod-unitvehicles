uv.ptech.killswitch=断电开关
uv.ptech.killswitch.short=断电开关
uv.ptech.killswitch.desc=断电开关将会寻找并锁定前方的载具，然后发射强大的静电脉冲信号，暂时瘫痪它的电气系统。

