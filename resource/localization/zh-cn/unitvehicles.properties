#---------- [ 追击科技字符串 ]
# 字符串
uv.ptech=追击科技

uv.ptech.slot.left=槽位 1
uv.ptech.slot.right=槽位 2

# 属性
uv.ptech.duration=持续时间
uv.ptech.duration.desc=该追击科技将保持活跃状态多长时间。

uv.ptech.power=能量
uv.ptech.power.desc=这个追击科技的能量有多少。

uv.ptech.damage=命中时造成的伤害
uv.ptech.damage.desc=命中目标时造成的伤害倍率。\n设为 1 则为全额伤害。

uv.ptech.damagecommander=指挥官命中时造成的伤害
uv.ptech.damagecommander.desc=命中指挥官单位时造成的伤害倍率。\n设为 1 则为全额伤害。

uv.ptech.cooldown=冷却时间
uv.ptech.cooldown.desc=多久之后才能再次使用这个追击科技。

uv.ptech.maxammo=充能次数
uv.ptech.maxammo.desc=该追击科技在耗尽前最多可使用多少次？\n设为 0可实现无限使用。

uv.ptech.maxdistance=范围
uv.ptech.maxdistance.desc=该追击科技可激活的目标距离。\n以 Hammer 单位（游戏内部距离单位）为测量标准。

uv.ptech.force=冲击力
uv.ptech.force.desc=撞击目标时施加的力量大小。

uv.ptech.lockontime=锁定时间
uv.ptech.lockontime.desc=该追击科技锁定目标所需的时间。

uv.ptech.disableduration=瘫痪时间
uv.ptech.disableduration.desc=被此追击科技击中的车辆将保持瘫痪状态多长时间。

uv.ptech.length=长度
uv.ptech.length.desc=追击科技约束的长度。

uv.ptech.strength=强度
uv.ptech.strength.desc=追击科技约束的强度。

# 通用
uv.ptech.emp=电磁脉冲
uv.ptech.emp.short=电磁脉冲
uv.ptech.emp.desc=电磁脉冲（EMP）会锁定前方的车辆，并释放巨大的静电脉冲，使其电子系统暂时瘫痪。\n\n升级后：锁定距离、伤害与作用力翻倍。

uv.ptech.emp.activated=EMP 已激活
uv.ptech.emp.lockingon=EMP 正在锁定
uv.ptech.emp.missed=EMP 未命中
uv.ptech.emp.dodged=已避开 EMP
uv.ptech.emp.notarget=没有可对 EMP 使用的有效目标

uv.ptech.emp.hit=你用 EMP 击中了 %s
uv.ptech.emp.hit.you=%s 用 EMP 击中了你

uv.ptech.esf=静电场
uv.ptech.esf.short=静电场
uv.ptech.esf.desc=静电场（ESF）为车身充能，形成强大的静电场，可抵御眩晕地雷与 EMP 锁定，并对任何触碰它的对象造成强力电击。\n\n升级后：威力与伤害翻倍。

uv.ptech.esf.activated=ESF 已激活
uv.ptech.esf.hit=你用 ESF 击中了 %s
uv.ptech.esf.hit.you=%s 用 ESF 击中了你

uv.ptech.repairkit=维修套件
uv.ptech.repairkit.short=维修套件
uv.ptech.repairkit.desc=维修套件会启动车载快速修复系统，为你的载具进行战地抢修。自动维修模块专为应急响应与战术机动而设计，通过内置的自密封组件与强化液压系统恢复载具的结构完整性。\n\n升级后：补满你的氮气。

uv.ptech.repairkit.activated=维修套件已部署

# 仅车手
uv.ptech.jammer=干扰器
uv.ptech.jammer.short=干扰器
uv.ptech.jammer.desc=干扰器会在你的车周围形成临时力场，抵御科技攻击，并干扰附近其他驾驶者的 HUD，使其无法使用追击科技。\n\n升级后：持续时间翻倍。

uv.ptech.jammer.activated=干扰器已激活
uv.ptech.jammer.hit.you=受到干扰

uv.ptech.shockwave=冲击波
uv.ptech.shockwave.short=冲击波
uv.ptech.shockwave.desc=冲击波会从车身中心爆发出音爆冲击，将附近的载具推开并造成伤害。\n\n升级后：伤害与作用力翻倍。

uv.ptech.shockwave.activated=冲击波已部署
uv.ptech.shockwave.hit=你使用冲击波击中了 %s
uv.ptech.shockwave.hit.you=%s 使用冲击波击中了你

uv.ptech.stunmine=眩晕地雷
uv.ptech.stunmine.short=眩晕地雷
uv.ptech.stunmine.desc=眩晕地雷会部署在车后，被其撞上的载具电子系统会过载，造成伤害并失控。\n\n升级后：伤害与作用力翻倍。

uv.ptech.stunmine.activated=眩晕地雷已部署
uv.ptech.stunmine.hit=你使用眩晕地雷击中了 %s
uv.ptech.stunmine.hit.you=%s 使用眩晕地雷击中了你

uv.ptech.powerplay=强力行动
uv.ptech.powerplay.short=强力行动
uv.ptech.powerplay.desc=启动强力行动会触发距离驾驶员最近的追击破坏点，迫使其坍塌。\n\n升级后：触发距离翻倍。

uv.ptech.powerplay.activated=强力行动已激活
uv.ptech.powerplay.nopb=附近没有追击破坏点

uv.ptech.juggernaut=暴走
uv.ptech.juggernaut.short=暴走
uv.ptech.juggernaut.desc=暴走会大幅提升车辆的撞击力，更容易撞开道具和拦路的车辆。\n\n升级后：持续时间翻倍。

uv.ptech.juggernaut.activated=暴走已激活

uv.ptech.ghost=幽灵
uv.ptech.ghost.short=幽灵
uv.ptech.ghost.desc=启动幽灵后，驾驶员的载具将与道具和其他载具失去碰撞。\n\n升级后：持续时间翻倍。

uv.ptech.ghost.activated=幽灵已激活

# 仅单位
uv.ptech.killswitch=断电开关
uv.ptech.killswitch.short=断电开关
uv.ptech.killswitch.desc=断电开关会锁定前方的车辆，并释放巨大的静电脉冲，使其电子系统暂时瘫痪。\n\n升级后：瘫痪时间翻倍。

uv.ptech.killswitch.activated=断电开关已激活
uv.ptech.killswitch.lockingon=断电开关锁定已开启
uv.ptech.killswitch.dodged=断电开关已脱离
uv.ptech.killswitch.hit=你使用断电开关击中了 %s
uv.ptech.killswitch.hit.you=%s 使用断电开关击中了你

uv.ptech.killswitch.engine.on=引擎重启完毕
uv.ptech.killswitch.getclose=再靠近点才能使用断电开关
uv.ptech.killswitch.novalid=无有效目标可对其使用断电开关

uv.ptech.skyhammer=天锤
uv.ptech.skyhammer.lockingon=天锤正在锁定
uv.ptech.skyhammer.dodged=已避开天锤
uv.ptech.skyhammer.hit.you=%s 用天锤击中了你

uv.ptech.spikes=钉刺带
uv.ptech.spikes.short=钉刺带
uv.ptech.spikes.desc=钉刺带从车尾部署后会迅速展开，对驶过其上的车辆轮胎造成损伤，若无法避开则可能同时命中多辆载具。\n\n升级后：部署两条钉刺带。

uv.ptech.spikes.activated=钉刺带已部署
uv.ptech.spikes.tiresreinflate=轮胎重新充气
uv.ptech.spikes.hit=你用钉刺带击中了 %s
uv.ptech.spikes.hit.you=%s 用钉刺带击中了你

uv.ptech.shockram=冲击冲锋
uv.ptech.shockram.short=冲撞
uv.ptech.shockram.desc=冲击冲锋会从车头爆发音爆冲击波，推开并伤害被波及的车辆。\n\n升级后：伤害与作用力翻倍。

uv.ptech.shockram.activated=冲击冲锋已部署
uv.ptech.shockram.hit=你用冲击冲锋击中了 %s
uv.ptech.shockram.hit.you=%s 用冲击冲锋击中了你

uv.ptech.gpsdart=GPS 飞镖
uv.ptech.gpsdart.short=GPS
uv.ptech.gpsdart.desc=GPS 追踪镖是一种载具标记系统，从车头发射，可标记、追踪并定位逃逸的载具。\n\n升级后：发射两枚 GPS 追踪镖。

uv.ptech.gpsdart.activated=GPS 飞镖已发射
uv.ptech.gpsdart.missed=GPS 飞镖未命中

uv.ptech.gpsdart.hit=你用 GPS 飞镖击中了 %s
uv.ptech.gpsdart.hit.you=%s 用 GPS 飞镖击中了你

uv.ptech.expbarrel=炸药桶

uv.ptech.grappler=抓钩
uv.ptech.grappler.short=抓钩
uv.ptech.grappler.desc=抓钩是一种使用高强度尼龙网缠住逃逸车辆轮胎的装置，可使其受控停下。\n\n升级后：拉力翻倍。

uv.ptech.grappler.activated=抓钩已部署
uv.ptech.grappler.missed=抓钩未命中

uv.ptech.grappler.hit=你用抓钩击中了 %s
uv.ptech.grappler.hit.you=%s 用抓钩击中了你

#---------- [ 提示字符串 ]
uv.tip=提示：%s

# 通用
uv.tip.repairshop=使用 [string:uv.repairshop] 修复你的载具并补满追击科技。如果你安装了 <color=255,255,0>Glide // Circular Functions</color>，还能补满氮气。

uv.tip.pt.emp1=使用 [string:uv.ptech.emp] 对前方的载具施以致命电击。
uv.tip.pt.emp2=急打方向避开 [string:uv.ptech.emp]，或使用 [string:uv.ptech.jammer] 将其挡下。
uv.tip.pt.emp3=车手可以使用 [string:uv.ptech.emp] 迫使 [string:uv.unit.helicopter] 退出追捕。
uv.tip.pt.esf1=使用 [string:uv.ptech.esf] 在自身周围形成攻击性静电场，对任何触碰它的对象造成电击伤害。
uv.tip.pt.esf2=使用 [string:uv.ptech.esf] 反制 [string:uv.ptech.stunmine] 或 [string:uv.ptech.emp]。
uv.tip.pt.repairkit1=车辆损毁严重？用 [string:uv.ptech.repairkit] 立刻恢复满状态！
uv.tip.pt.spikes1=使用 [string:uv.ptech.spikes] 扎破目标车辆的轮胎，让他们极难再控制住车辆。
uv.tip.pt.spikes2=使用 [string:uv.ptech.shockwave] 或 [string:uv.ptech.shockram] 把钉刺带推开。
uv.tip.pt.jammer=如果某个对手还能使用其他追击科技，就说明他当前没有启用 [string:uv.ptech.jammer]。

uv.tip.drafting=跟在其他车手或单位后面吸尾流时要小心，他们可能直接在你要走的路线前丢下 [string:uv.ptech.spikes] 或 [string:uv.ptech.stunmine]。

# 车手
uv.tip.racer.pt.jammer1=[string:uv.ptech.jammer] 不仅能干扰其他驾驶者的 HUD，还会立即禁用任何正在生效的追击科技。
uv.tip.racer.pt.jammer2=使用 [string:uv.ptech.jammer] 可以阻止 AI 单位生成，给你制造逃脱的机会。
uv.tip.racer.pt.shockwave1=使用 [string:uv.ptech.shockwave] 把周围的载具推开。
uv.tip.racer.pt.stunmine1=[string:uv.ptech.stunmine] 会部署在你的车后，对驶近的任何载具造成伤害。
uv.tip.racer.pt.powerplay1=使用 [string:uv.ptech.powerplay] 远程触发最近的追击破坏点。
uv.tip.racer.pt.juggernaut1=被路障挡住了？试试用 [string:uv.ptech.juggernaut] 提升车辆的撞击力。
uv.tip.racer.pt.ghost1=使用 [string:uv.ptech.ghost] 可暂时让载具与道具和其他驾驶者失去碰撞。

uv.tip.racer.pt.killswitch1=远离攻击者，或使用 [string:uv.ptech.jammer]，即可躲开 [string:uv.ptech.killswitch]。
uv.tip.racer.pt.skyhammer1=躲进掩体、驶离直升机，或使用 [string:uv.ptech.jammer]，即可躲开 [string:uv.ptech.skyhammer]。
uv.tip.racer.pt.shockram1=单位可能装备了 [string:uv.ptech.shockram]，它既能造成伤害，也能把前方的载具推开。
uv.tip.racer.pt.gpsdart1=被 [string:uv.ptech.gpsdart] 击中了？把它撞到墙或物体上，或使用 [string:uv.ptech.jammer] 将其清除。
uv.tip.racer.pt.grappler1=被 [string:uv.ptech.grappler] 抓住了？利用惯性把单位甩开，甚至扯断绳索，或用 [string:uv.ptech.jammer] 直接解除。

uv.tip.racer.cooldown=处于冷却状态时，找个安静的地方关掉引擎，能更快摆脱他们。
uv.tip.racer.aitactics1=AI 单位不擅长应对复杂地形，往泥地、森林或工地里钻可以让它们被困住或迷失方向。
uv.tip.racer.aitactics2=AI 单位会用滚动路障来拦截你。踩下刹车，或者找路绕开。
uv.tip.racer.pb=冲过<color=255,255,0>追击破坏点</color>（以红色三角标记）可以摧毁建筑，并让那些跟着你的倒霉单位动弹不得。
uv.tip.racer.comunits1=<color=255,255,0>指挥官单位</color>生成时不会携带维修套件，也可能无法在维修站自行修复。
uv.tip.racer.comunits2=<color=255,255,0>指挥官单位</color>无法通过翻车来击倒。把他们推进<color=255,255,0>追击破坏点</color>或<color=255,255,0>水中</color>即可直接消灭。
uv.tip.racer.comunits3=只要附近还有<color=255,255,0>指挥官单位</color>，资源点就不会消耗——先解决它们！
uv.tip.racer.airunits1=躲进掩体即可甩开空中单位，或使用 [string:uv.ptech.jammer] 让它们暂时失去控制。
uv.tip.racer.leastagro=巡逻单位与支援单位是最不具攻击性的单位。在低热度等级下，它们大多只会跟着你。
uv.tip.racer.roadblocks1=如果必须撞开路障，尽量挑轻的道具或车辆撞。
uv.tip.racer.roadblocks2=注意路障之间的空隙——[string:uv.ptech.spikes] 可能就藏在那里。
uv.tip.racer.boxedin=被包围了？使用 [string:uv.ptech.ghost] 或 [string:uv.ptech.shockwave] 轻松脱身！
uv.tip.racer.upgradedunits=特种单位与指挥官单位可能会正面撞向你。
uv.tip.racer.stuck=卡住了就按 [key:unitvehicle_keybind_resetposition] 回到道路上。
uv.tip.racer.disorient=急转、猛拐，或者来个飞跃，都能让单位失去方向感。
uv.tip.racer.rhinounits=避免与<color=255,255,0>犀牛单位</color>正面相撞。

# 单位
uv.tip.unit.pt.killswitch1=尽量对难以躲避的目标使用 [string:uv.ptech.killswitch]，比如在直道上，或目标正被围堵的时候。
uv.tip.unit.pt.killswitch2=锁定成功后，[string:uv.ptech.killswitch] 会短暂瘫痪目标车辆的引擎，让逮捕更轻松。
uv.tip.unit.pt.shockram1=使用 [string:uv.ptech.shockram] 伤害你前方的任何载具。
uv.tip.unit.pt.gpsdart1=被 [string:uv.ptech.gpsdart] 击中的嫌疑人将无处可逃。
uv.tip.unit.pt.grappler1=使用 [string:uv.ptech.grappler] 时，务必逐渐减速，以免被甩来甩去或绳索被扯断。

uv.tip.unit.pt.shockwave1=被困住的嫌疑人可能会用 [string:uv.ptech.shockwave] 把单位推开。
uv.tip.unit.pt.juggernaut1=使用 [string:uv.ptech.juggernaut] 的嫌疑人并非无敌，仍然会因碰撞而受到伤害。
uv.tip.unit.pt.ghost1=使用 [string:uv.ptech.ghost] 的嫌疑人仍然会被 [string:uv.ptech.spikes]、[string:uv.ptech.emp]、[string:uv.ptech.killswitch] 和 [string:uv.ptech.shockram] 命中。

uv.tip.unit.pit=撞向目标车尾即可执行 PIT 机动，让目标打转失控。
uv.tip.unit.teamwork=与队友配合擒获嫌疑人。拉近距离，但避免互相撞击，那会给嫌疑人留下逃跑的空间。
uv.tip.unit.roadblocks=你可以自行放置 [string:uv.ptech.spikes] 来填补路障的空隙。
uv.tip.unit.loneunit=作为单独行动的单位，尽量不要冲到嫌疑人前面，他们可能突然转弯、提前下高速，或用追击科技解决你。
uv.tip.unit.comunit=作为<color=255,255,0>指挥官单位</color>，你应始终待在目标车辆附近，但非必要不要主动交锋。
uv.tip.unit.nocooldown=作为单位，你不仅看不到冷却进度条，也看不到躲藏提示。
uv.tip.unit.respawn=你可以随时按 [key:unitvehicle_keybind_resetposition] 重生为新的单位。
uv.tip.unit.pbnote=如果撞到<color=255,255,0>追击破坏点</color>结构上的任何道具，你的车辆也可能被摧毁。
