uv.ptech.gpsdart=GPS 飞镖
uv.ptech.gpsdart.short=GPS
uv.ptech.gpsdart.desc=GPS 飞镖是一种从车辆前方发射的标记系统，可标记、追踪并定位逃跑车辆。

