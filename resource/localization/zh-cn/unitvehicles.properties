uv.ptech.duration=持续时间
uv.ptech.duration.desc=该追击科技将保持活跃状态多长时间。

uv.ptech.power=能量
uv.ptech.power.desc=这个追击科技的能量有多少。

uv.ptech.damage=命中时造成的伤害
uv.ptech.damage.desc=命中目标时造成的伤害倍率。\n设为 1 则为全额伤害。

uv.ptech.damagecommander=指挥官命中时造成的伤害
uv.ptech.damagecommander.desc=命中指挥官单位时造成的伤害倍率。\n设为 1 则为全额伤害。

uv.ptech.cooldown=冷却时间
uv.ptech.cooldown.desc=多久之后才能再次使用这个追击科技。

uv.ptech.maxammo=充能次数
uv.ptech.maxammo.desc=该追击科技在耗尽前最多可使用多少次？\n设置为0可实现无限使用。

uv.ptech.maxdistance=范围
uv.ptech.maxdistance.desc=此追捕科技可激活的目标距离。\n以 Hammer 单位（游戏内部距离单位）为测量标准。

uv.ptech.force=冲击力
uv.ptech.force.desc=撞击目标时施加的力量大小。

uv.ptech.lockontime=锁定时间
uv.ptech.lockontime.desc=追击科技锁定目标需要多次时间？

uv.ptech.disableduration=瘫痪时间
uv.ptech.disableduration.desc=被此追击科技击中的车辆将保持瘫痪状态多长时间。

