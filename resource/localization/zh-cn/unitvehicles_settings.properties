#---------- 首次设置
uv.ft=首次设置

uv.ft.title=欢迎使用单位载具！
uv.ft.desc=单位载具是一款面向沙盒模式的插件，让你无论是在多人游戏中与其他玩家一起，还是在单人游戏中与 AI 一起，都能扮演警察或与警察对抗，展开高速追捕，并在任意地图上体验刺激的竞速。\n\n本次首次设置将介绍各项设置，帮助你获得最佳游戏体验。

uv.ft.preset.title=选择预设
uv.ft.preset.desc=单位载具让你可以与 AI 或玩家控制的单位一起进行追捕。你可以调整所有变量，例如单位数量、增援到达所需时间，以及是否允许空中单位和路障生成。\n\n请选择一个热度等级预设以继续。
uv.ft.preset.desc2=你可以在 [string:uv.pm] -- [string:uv.hm] 中找到这些设置。

uv.ft.bases=载具框架
uv.ft.bases.desc=单位载具支持多种载具框架。不过，AI 只能使用一种预先选定的载具框架生成。\n\n请确认你希望 AI 使用哪种载具框架。

uv.ft.bases.units=单位载具框架
uv.ft.bases.airacer=AI 车手载具框架
uv.ft.bases.traffic=交通载具框架

uv.ft.general.desc=单位载具提供了大量可自定义设置。\n\n请查看各项设置，例如选择你喜欢的 HUD 类型、UVTrax™ 配置以及其他各种选项。

uv.ft.racing.desc=单位载具让你可以在玩家创建的环形赛道和冲刺赛道上，与其他玩家和 AI 车手同场竞速。\n\n请查看你的竞速设置。
uv.ft.racing.desc2=加载赛道后，你可以在 [string:uv.rm] -- [string:uv.rm.options] 中找到这些设置。

uv.ft.racing.ai.title=与 AI 竞速
uv.ft.racing.ai.desc=你可以与 AI 对手一起竞速，实现方式有两种：
uv.ft.racing.ai.desc2=1) 勾选下方的 [string:uv.airacer.override] 按钮，然后用 [+attack2] 选择你希望 AI 生成的载具。\n2) 保持不勾选，并使用 [string:tool.uvracermanager.name] 工具手动创建 AI 可用的载具。\n\n你可以在 [string:uv.airacer] 中找到该设置。

uv.ft.end.title=完成
uv.ft.end.desc=就这样！\n\n现在你可以去任意你能想到的地图上，体验高速追捕与刺激的竞速了！
uv.ft.end.desc2=如果你还有其他问题，可以查看 [string:uv.faq]。\n\n如果你发现 bug 或故障，或需要 [string:uv.faq] 中未提及的帮助，欢迎到我们的 Discord 服务器找我们！

uv.ft.next=下一步
uv.ft.prev=上一步
uv.ft.finish=完成

uv.ft.force=重新启用首次设置
uv.ft.force.desc=如果启用，下次打开 UV 菜单时会再次进入首次设置。

uv.ft.skip=跳过（不推荐）

#---------- 新版设置菜单：赛事管理器
uv.rm=赛事管理

uv.rm.startrace=开始赛事
uv.rm.startrace.desc=使用当前受邀的车手与 AI 开始比赛。

uv.rm.stoprace=停止赛事
uv.rm.cancelrace=取消比赛

uv.rm.sendinvite=邀请车手

uv.rm.loadrace=加载赛道
uv.rm.changerace=更换赛道

uv.rm.author=作者：%s
uv.rm.checkpoints=检查点数量：%s
uv.rm.startslots=起跑位：%s

uv.rm.hasprops=道具：%s
uv.rm.hasnodes=路径节点：%s

uv.rm.options=赛事选项
uv.rm.options.laps=圈数
uv.rm.options.laps.desc=比赛使用的圈数。\n\n若为点对点或直线加速赛，请设为 1。
uv.rm.options.dnftimer=未完成比赛计时器
uv.rm.options.dnftimer.desc=当第一位参赛者越过终点线时开始计时；计时归零时比赛自动结束，并取消所有尚未越过终点线的车手的参赛资格。\n\n设为 0 可禁用。
uv.rm.options.visiblecheckpoints=显示检查点
uv.rm.options.visiblecheckpoints.desc=比赛中是否对玩家显示检查点。
uv.rm.options.legacyspawn=旧版生成方式
uv.rm.options.legacyspawn.desc=如果启用，将使用旧版生成方式。\n\n旧版方式会为每位车手重新创建载具并放置到起跑位上，因此比新方式慢得多。\n\n只有在你使用某些载具框架、且它们在起跑位上的摆放出现问题时，才应启用。

uv.rm.options.pursuitstart=自动开始追捕
uv.rm.options.pursuitstart.desc=比赛开始后多少秒自动启动追捕。\n\n设为 0 可禁用。

uv.rm.options.pursuitclear=比赛结束后自动结束追捕
uv.rm.options.pursuitclear.desc=比赛结束时自动结束追捕。
uv.rm.options.pursuitclear.ai=同时移除 AI 单位
uv.rm.options.pursuitclear.ai.desc=同时移除当前存在的所有 AI 单位。

uv.rm.options.clearai=比赛结束后移除 AI 车手
uv.rm.options.clearai.desc=比赛结束时自动移除所有 AI 车手及其载具。

uv.rm.options.rubberband.pursuits=在追捕中也生效
uv.rm.options.rubberband.pursuits.desc=启用后，加速效果在追捕期间也会生效。

uv.rm.startrace.addai=添加 %s 名 AI 并开始比赛
uv.rm.startrace.addai.desc=生成指定数量的 AI，自动邀请并开始比赛。\n\n警告：生成大量 AI 可能导致游戏卡顿。
uv.rm.startrace.fillai=填充起跑位并开始比赛
uv.rm.startrace.fillai.desc=生成 %s 名 AI 并自动邀请后开始比赛。\n\n警告：生成大量 AI 可能导致游戏卡顿。

#---------- 新版设置菜单：追捕管理器
uv.pm=追捕管理

uv.pm.spawnas=以单位进行生成
uv.pm.spawnas.desc=打开单位选择菜单，允许你选择一个单位，加入对逃逸嫌疑人的追捕行动。

uv.pm.spawnai=生成 AI 单位
uv.pm.spawnai.desc=生成一个随机的 AI 单位。

uv.pm.spawnai.val=生成 %s 个 AI 单位
uv.pm.spawnai.val.desc=生成指定数量的 AI 单位。\n\n警告：生成大量 AI 可能会导致游戏卡顿或短暂无响应。

uv.pm.clearai=清除所有活动中的 AI 单位
uv.pm.clearai.desc=移除当前场景中所有正在活动的 AI 单位。

uv.pm.pursuit.toggle=切换追捕状态
uv.pm.pursuit.toggle.desc=若未进行追捕则开始追捕。\n\n若正在追捕则停止。

uv.pm.pursuit.start=强制开始追捕
uv.pm.pursuit.stop=强制停止追捕

uv.pm.heatlevel=设置热度等级
uv.pm.heatlevel.desc=应用后，将当前热度等级设为指定值。

uv.pm.misc=杂项
uv.pm.clearbounty=清除赏金
uv.pm.clearbounty.desc=将赏金重置为 0。
uv.pm.wantedtable=打印“通缉名单”到控制台中

#---------- 新版设置菜单：热度等级管理器
uv.hm=热度等级管理器
uv.hm.open=打开热度等级管理器
uv.hm.open.desc=打开热度等级管理器，你可以在这里调整所有与热度等级、追捕单位、悬赏系统等相关的设置。

uv.hm.presets=预设
uv.hm.presets.warning=警告
uv.hm.presets.confirm=此操作将覆盖你当前的所有设置。\n该操作无法撤销。\n你确定要加载预设“%s”吗？

uv.hm.presets.presetname=预设名称 - 在预设上按 [+attack2] 可粘贴到此处
uv.hm.presets.presetname.require=必须填写预设名称！

uv.hm.presets.save=保存预设
uv.hm.presets.save.desc=使用指定的名称和当前选中的设置保存一个预设。

uv.hm.presets.delete=删除预设
uv.hm.presets.delete.desc=删除最近一次使用 [+attack2] 选中的预设。

uv.hm.presets.export=导出当前设置为创意工坊插件
uv.hm.presets.export.desc=将当前设置导出为兼容创意工坊的文件。\n\n请查看聊天窗口以获取具体路径。

uv.hm.lvl=热度等级 %s

uv.hm.timedhl=定时热度等级
uv.hm.timedhl.desc=如果启用，热度等级将随着时间的推移而增加，而不是依赖于赏金金额。

uv.hm.minhl=最小热度等级
uv.hm.minhl.desc=设置你在追捕中可以达到的最低热度等级。等级越高，单位越具攻击性。

uv.hm.maxhl=最大热度等级
uv.hm.maxhl.desc=设置你在追捕中可以达到的最高热度等级。等级越低，单位攻击性越弱。

uv.hm.enablept=单位可在生成时携带追击科技
uv.hm.enablept.desc=允许单位在生成时携带追击科技。\n\n无论此选项是否启用，巡逻单位和支援单位都不会生成追击科技。

uv.hm.pt.spawnwith=允许追击科技
uv.hm.pt.spawnwith.desc=启用后，AI 单位和玩家控制的单位在生成时可携带并使用该追击科技。
uv.hm.pt.spawnwith.desc.air=启用后，空中单位可使用该追击科技。

uv.hm.commander=指挥官设置
uv.hm.commander.solo=一位指挥官
uv.hm.commander.solo.desc=如果启用，将只会有一个指挥官单位被派往追捕。\n\n当指挥官单位处于活动状态时，将会有无限的后备单位。

uv.hm.commander.health=指挥官生命值
uv.hm.commander.health.desc=指挥官单位有多少生命值。\n如果对于你来说太简单了就再增大一些吧！

uv.hm.commander.canrepair=指挥官可以维修吗？
uv.hm.commander.canrepair.desc=如果启用，指挥官单位可以使用维修站或维修套件追击科技修复自己的载具。\n\n如果禁用，他们仍然可以使用维修站或维修套件修补爆胎。

uv.hm.air=空中单位设置
uv.hm.air.model=单位模型
uv.hm.air.model.desc=空中单位应该用什么模型。

uv.hm.air.canbust=可逮捕车手
uv.hm.air.canbust.desc=如果启用，空中单位可以通过在车手附近飞行来逮捕他们。

uv.hm.air.pt.exp=允许使用爆炸桶
uv.hm.air.pt.spikes=允许使用钉刺带
uv.hm.air.pt.skyhammer=允许天锤
uv.hm.air.pt.desc=如果启用，空中单位可以使用该追击科技。\n\n若未启用“允许追击科技”，此选项将不起作用。

uv.hm.air.fuel.min=最短滞空时间
uv.hm.air.fuel.min.desc=空中单位耗尽燃料并退出追捕前的最短滞空时间。\n\n设为 0 可禁用燃料限制。
uv.hm.air.fuel.max=最长滞空时间
uv.hm.air.fuel.max.desc=空中单位耗尽燃料并退出追捕前的最长滞空时间。

uv.hm.air.cooldown=冷却时间
uv.hm.air.cooldown.desc=空中单位被移除后，需要等待多久才能重新生成。\n\n设为 0 可禁用冷却。

uv.hm.disablebounty=瘫痪单位获得赏金
uv.hm.disablebounty.desc=瘫痪该类型单位时你能获得多少赏金。

uv.hm.dm=驾驶员模型
uv.hm.dm.desc=选择该 AI 单位使用的驾驶员模型。

uv.hm.vp=语音配置文件
uv.hm.vp.desc=选择该 AI 单位所使用的语音配置组。
uv.hm.vp.dispatch.desc=选择调度系统所使用的语音配置组。
uv.hm.vp.misc.desc=选择用于其他杂项音效的语音配置组。

uv.hm.heat=热度等级设置

uv.hm.heat.bounty.10s=每 10 秒获得的赏金
uv.hm.heat.bounty.10s.desc=你每10秒赚多少赏金。

uv.hm.heat.heatlvl.time=热度时间
uv.hm.heat.heatlvl.time.desc=在提升热度等级前所需的时间。\n\n若未启用“计时热度等级”，则无效。

uv.hm.heat.minbounty=最低赏金
uv.hm.heat.minbounty.desc=达到这个热度需要多少赏金？\n\n不要与其他热度等级重叠！\n\n如果启用“定时热度等级”，则不执行任何操作。

uv.hm.heat.maxunits=最大单位数
uv.hm.heat.maxunits.desc=同一时间最多能有多少个单位追捕你？\n\n数值越高越影响性能。

uv.hm.heat.avaunits=可调度单位
uv.hm.heat.avaunits.desc=在需要申请支援前，可以生成多少个单位进行追捕？

uv.hm.heat.backuptime=支援计时器
uv.hm.heat.backuptime.desc=支援单位多久才能加入追捕。

uv.hm.heat.bustspeed=逮捕速度（英里/小时）
uv.hm.heat.bustspeed.desc=驾驶员需保持此速度行驶，方可避免遭到拦截。

uv.hm.heat.cooldowntime=冷却计时器
uv.hm.heat.cooldowntime.desc=你需要在冷却中度过多长时间才能成功逃脱。

uv.hm.heat.roadblocks=启用路障
uv.hm.heat.roadblocks.desc=如果启用，路障可以在这个热度等级下生成。

uv.hm.heat.helicopter=启用空中单位
uv.hm.heat.helicopter.desc=如果启用，空中单位可以在此热度等级下生成。\n\n请留意天空，并寻找带头顶掩护的位置！

uv.hm.units=单位
uv.hm.units.desc=选择在追捕中于该槽位出现的单位。

uv.hm.units.selected=已选单位
uv.hm.units.selected.desc=在追捕中将出现在该槽位的单位。

uv.hm.units.spawnchance=生成概率
uv.hm.units.spawnchance.desc=该单位在所选热度等级中生成的概率。

uv.hm.units.limit=生成上限
uv.hm.units.limit.desc=该类型的单位最多能有多少个参与追捕。\n\n设为 0 表示不限制。\n\n设为 -1 表示只出现在路障中。
uv.hm.units.limit.helicopter.desc=最多可以有多少个空中单位参与追捕。

uv.hm.units.override=使用基础载具
uv.hm.units.override.desc=单位将优先从下方列表选择载具，而不是从数据库中随机选择。

#---------- 新版设置菜单：交通管理器
uv.tm=交通管理器

uv.tm.clear=清除当前交通载具
uv.tm.clear.desc=移除所有当前生成的交通载具。

uv.tm.override.desc=交通载具将优先从下方列表选择载具，而不是从数据库中随机选择。

#---------- 新版设置菜单：AI 车手管理器
uv.airacer=AI 车手管理器

uv.airacer.spawnai=生成 AI 车手
uv.airacer.spawnai.desc=生成一名随机 AI 车手。

uv.airacer.spawnai.val=生成 %s 名 AI 车手
uv.airacer.spawnai.val.desc=生成指定数量的 AI。\n\n警告：生成过多 AI 可能导致游戏卡顿或短暂无响应。

uv.airacer.clear=清除当前 AI 车手
uv.airacer.clear.desc=移除所有当前生成的 AI 车手。

uv.airacer.override=载具覆盖
uv.airacer.override.desc=AI 车手将优先从下方列表中选择载具，而不是从数据库中随机挑选。

uv.airacer.overridelist=已分配载具：%s
uv.airacer.overridelist.desc=右键点击载具将其加入列表。\n\n再次右键点击可将其移除。
uv.airacer.overridelist.hover=右键点击载具将其加入列表。\n再次右键点击可将其移除。

#---------- 新版设置菜单：插件
uv.addons=附加组件

uv.addons.builtin=内置附加组件
uv.addons.builtin.desc=随 Unit Vehicles 一同提供的附加组件。

uv.addons.extern=第三方附加组件
uv.addons.extern.desc=通过创意工坊下载或安装于 addons 文件夹中的组件。
uv.addons.none=未找到任何组件。

