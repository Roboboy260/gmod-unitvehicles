uv.ui.menu=UV 菜单
uv.ui.menu.desc=通过更改颜色和功能来自定义 UV 菜单外观。

uv.ui.menu.hidedesc=强制隐藏说明
uv.ui.menu.hidedesc.desc=强制隐藏所有 UV 菜单标签页中的说明区域，从而缩短菜单宽度。\n\n需要重新加载菜单实例后生效。

uv.ui.menu.hideprompts=强制隐藏提示
uv.ui.menu.hideprompts.desc=强制隐藏 UV 菜单各标签页的操作提示。\n\n需要重新打开菜单后生效。

uv.ui.menu.openspeed=打开速度
uv.ui.menu.openspeed.desc=菜单打开所需时间。\n\n以秒为单位。

uv.ui.menu.closespeed=关闭速度
uv.ui.menu.closespeed.desc=菜单关闭所需时间。\n\n以秒为单位。

uv.ui.menu.custcol=自定义颜色
uv.ui.menu.custcol.desc=自定义 UV 菜单的颜色。

