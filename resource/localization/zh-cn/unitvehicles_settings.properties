uv.settings=设置

#---------- 新版设置菜单：用户界面
uv.ui.title=UI
uv.ui.main=主 UI
uv.ui.backup=回退
uv.ui.main.desc=更改竞速与追捕 UI 的外观，使其近似某款特定游戏的 UI。\n\n注意：这些 UI 并非 1:1 复刻，会有细微差异。
uv.ui.backup.desc=如果所选的主 UI 没有追捕 UI，就会使用备用的追捕 UI。\n\n注意：这些 UI 并非 1:1 复刻，会有细微差异。

uv.ui.original=原版
uv.ui.none=无UI

uv.ui.speedometer.enable=启用自定义速度表
uv.ui.speedometer.enable.desc=用与主 UI 风格一致的自制速度表替换基础速度表。\n\n注意：仅适用于<color=255,255,0>Glide</color> 的汽车、摩托车与坦克。\n\n<color=255,100,100>警告</color>：启用后部分 Glide 功能将无法使用。

uv.ui.speedometer=速度表样式
uv.ui.speedometer.desc=选择要使用的速度表样式。

uv.ui.speedometer.cust=自定义速度表
uv.ui.speedometer.cust.desc=自定义所选的速度表。

uv.ui.custhud=自定义 HUD
uv.ui.custhud.desc=自定义所选主 UI 的各个元素。

uv.ui.racertags=名字标签
uv.ui.racertags.desc=竞速：在其他参赛者头顶显示姓名标签，包含其名称与当前名次。\n\n追捕：在嫌疑人头顶显示姓名标签，并在指挥官单位上方额外显示一个姓名标签。

uv.ui.racertags.thickness=描边粗细
uv.ui.racertags.thickness.desc=名称标签描边的粗细。\n\n设为 0 可禁用描边。

uv.ui.racertags.distance=淡出距离
uv.ui.racertags.distance.desc=距离多远时名称标签会完全淡出。\n\n以米为单位。

uv.ui.racertags.maxnr=同屏最大数量
uv.ui.racertags.maxnr.desc=同一时间最多在屏幕上显示多少个名称标签。\n\n不影响指挥官单位的名称标签。

uv.ui.policescanner=警用扫描仪
uv.ui.policescanner.desc=显示一台指向最近单位的警用扫描仪。\n\n在非追捕状态且单位已生成时可见，在追捕途中以及冷却期间也可见。

uv.ui.policescanner.vehicle=对齐载具
uv.ui.policescanner.vehicle.desc=让扫描仪前端对齐载具的前进方向，而不是镜头朝向。

uv.ui.detection=显示视觉侦测
uv.ui.detection.desc=显示一个指示环，用来表示单位有多接近发现你。\n\n在非追捕状态且单位已生成时可见，在追捕途中以及冷却期间也可见。

uv.ui.preracepopup=赛前信息
uv.ui.preracepopup.desc=比赛开始时显示与比赛相关的信息：圈数、检查点数量与起跑位置。

uv.ui.subtitles=警用通讯字幕
uv.ui.subtitles.desc=显示警用通讯的字幕。\n\n注意：仅对默认的警用通讯生效。\n\n仅支持英文。

uv.ui.vehnametakedown=击倒时显示载具名称
uv.ui.vehnametakedown.desc=在单位击倒时显示载具名称而非单位名称。

uv.ui.unitstype=距离单位
uv.ui.unitstype.desc=选择用于显示距离的单位。
uv.ui.unitstype.meter=米
uv.ui.unitstype.feet=英尺
uv.ui.unitstype.yards=码

uv.ui.deadzone=X 轴死区
uv.ui.deadzone.desc=将 UI 元素向屏幕中心靠拢。\n\n适用于超宽屏显示器。

uv.ui.scale=X 轴缩放
uv.ui.scale.desc=对 UI 元素进行缩放（放大/缩小）。\n\n适用于超宽屏显示器。

uv.ui.xaxis=X 轴
uv.ui.xaxis.desc=左右移动该 UI 元素。

uv.ui.yaxis=Y 轴
uv.ui.yaxis.desc=上下移动该 UI 元素。

#---------- 新版设置菜单：自定义 UI
uv.ui.custhud.pursuit=追捕元素
uv.ui.custhud.race=竞速元素

uv.ui.custhud.leaderboard=排行榜

uv.ui.custhud.raceramount=车手数量
uv.ui.custhud.raceramount.desc=比赛中排行榜应显示多少位车手。\n\n不影响名次数字元素。

#---------- 新版设置菜单：用户界面
uv.ui.menu.col=颜色
uv.ui.menu.col.desc=更改此元素的颜色。

uv.ui.menu.col.background=颜色（背景）
uv.ui.menu.col.background.desc=更改此元素背景的颜色。

uv.ui.menu.col.active=颜色（激活）
uv.ui.menu.col.active.desc=元素启用时的颜色。

