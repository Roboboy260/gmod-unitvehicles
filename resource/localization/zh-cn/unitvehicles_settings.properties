uv.ailogic=AI 逻辑

uv.ailogic.optimizerespawn=优化重生
uv.ailogic.optimizerespawn.desc=单位将传送到嫌犯的前方，而不是直接重生。\n\n提高性能。
# uv.ailogic.trafficstreaming=Traffic Streaming
# uv.ailogic.trafficstreaming.desc=Traffic and patrolling Units will despawn when they are too far away from the player, thus allowing new ones to spawn.\n\nImpacts performance.
uv.ailogic.relentless=野兽模式
uv.ailogic.relentless.desc=AI单位将表现得更具有攻击性，就像极品飞车中的警察一样。\n\n他们会不顾一切的完成自己的本职工作。\n\n即使你处于冷却时间中，他们也始终知道你藏身的位置。
uv.ailogic.wrecking=启用破坏性
uv.ailogic.wrecking.desc=单位/交通车辆可能会被完全摧毁。
uv.ailogic.detectionrange=侦测距离
uv.ailogic.detectionrange.desc=手动生成单位时，与车辆的最小生成距离（单位：锤子单位）。若生成单位时遇到问题，可使用更高数值。

uv.ailogic.headlights=启用前照明
uv.ailogic.headlights.desc=AI单位会启用他们的前照明。\n\n空中单位也将启用聚光灯。\n\n会电脑性能。
uv.ailogic.headlights.off=Always off
uv.ailogic.headlights.auto=Automatic
uv.ailogic.headlights.always=Always on

uv.ailogic.usenitrousracer=AI驾驶员氮气加速
uv.ailogic.usenitrousracer.desc=允许AI驾驶员使用氮气加速。\n\n注：仅适用于 Glide 载具。
uv.ailogic.usenitrousunit=AI单位氮气加速
uv.ailogic.usenitrousunit.desc=允许AI单位使用氮气加速。\n\n注：仅适用于 Glide 载具。

uv.ailogic.autohealthracer=AI 赛车无限耐久
uv.ailogic.autohealthracer.desc=为 AI 赛车提供无限载具耐久。

uv.ailogic.customizeracer=自定义 AI 竞速者载具
uv.ailogic.customizeracer.desc=AI 竞速者生成时会随机应用颜色、涂装和车身部件。\n\n注意：不适用于带有基于车身部件损坏脚本的 Glide 载具。

uv.ailogic.tractioncontrol=牵引力控制
uv.ailogic.tractioncontrol.desc=当失去抓地力时，AI 赛车与单位将减少油门。\n\n注意：仅适用于 Glide 与 Simfphys 载具。

# uv.ailogic.disengageonheatchange=Disengage on Heat Change
# uv.ailogic.disengageonheatchange.desc=AI Units will fall back if their vehicle does not match any of the assigned vehicles when the Heat Level changes.\n\nResource Points does not get drained in the process.\n\nNote: Does not apply to Commander Units, Rhino Units and AI Units that are spawned in manually.

uv.ainav=AI 导航
uv.ainav.pathfind=寻路
uv.ainav.pathfind.desc=寻路AI将使用满分寻路算法，使用导航网格或平民车辆导航点进行导航。\n\n会电脑性能。
uv.ainav.dvpriority=DV路径点优先
uv.ainav.dvpriority.desc=AI会在使用导航网格前先尝试使用DV路径点（如果可行的话）。
# uv.ainav.dvdistancebased=DV Waypoint Distance-Based
# uv.ainav.dvdistancebased.desc=AI will use a distance-based approach to navigate on Decent Vehicle Waypoints.\n\nDisabled = Direct engaging when suspect is in view.\n\nEnabled = Navigate via waypoints if too far from suspect.
# uv.ainav.dvnavoptimized=Optimized DV Navigation
# uv.ainav.dvnavoptimized.desc=If enabled, AI will use an optimized pathfinding algorithm to navigate on DV Waypoints. Disable if you are encountering issues with Units navigating.\n\nMost useful on InfMap maps with many waypoints present.\n\n<color=255,255,0>EXPERIMENTAL FEATURE</color>


