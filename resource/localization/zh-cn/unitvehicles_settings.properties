uv.pursuit.heatlevels=热度等级
uv.pursuit.heatlevels.enable=启用热度等级
uv.pursuit.heatlevels.enable.desc=启用热度等级系统，当赏金达到特定阈值时提升热度等级，从而增加单位数量、攻击性和多样性。
uv.pursuit.heatlevels.aiunits=AI单位生成中
uv.pursuit.heatlevels.aiunits.desc=主要的AI单位（普巡、支援等）将在附近生成，加入追逐。\n\n越野和空中单位可以通过单位管理器工具启用。

uv.pursuit.randomplayerunits=随机玩家单位
uv.pursuit.randomplayerunits.desc=启用后，玩家控制的单位将从可用单位中随机选择。
uv.pursuit.autohealth=无限耐久
uv.pursuit.autohealth.desc=让嫌疑人车辆的耐久度不受限制，当你作为嫌疑人时耐久度是根据车辆的质量设置的。\n\n如果你不想继续被撞坏，或者你想要更耐打的嫌疑人，可以设为启用。
uv.pursuit.wheelsdetaching=车轮脱落
uv.pursuit.wheelsdetaching.desc=启用后，损毁的车辆将会脱落车轮。
uv.pursuit.spottedfreezecam=[仅单人] 发现冻结镜头
uv.pursuit.spottedfreezecam.desc=在追逐开始时减慢游戏速度，并将镜头对准最近的单位。
# uv.pursuit.canexitvehicle=Allow Vehicle Exit
# uv.pursuit.canexitvehicle.desc=If enabled, users can exit their vehicles in the middle of races and pursuits.
uv.pursuit.repaircooldown=维修冷却期
uv.pursuit.repaircooldown.desc=维修站多久才能使用一次。\n\n设置为0可使其变为一次性使用。
uv.pursuit.repairrange=维修距离
uv.pursuit.repairrange.desc=距离修理站的锤子单位数（在此距离内可修复你的车辆）。
uv.pursuit.noevade=永不逃避
uv.pursuit.noevade.desc=如果启用，则永远无法进入冷却状态。\n\n祝你好运！
uv.pursuit.bustedtime=逮捕时间
uv.pursuit.bustedtime.desc=嫌疑人被捕前的时间（秒）。\n\n设置为0以禁用。
uv.pursuit.respawntime=重生冷却期（警察）
uv.pursuit.respawntime.desc=玩家在单位车辆中重生前的时间（秒）。\n\n设置为0以禁用。
uv.pursuit.spikeduration=轮胎充气时间
uv.pursuit.spikeduration.desc=多长时间（秒），才能让被钉刺带扎中的轮胎重新充气。\n\n设置为0以禁用轮胎重新重启。

uv.pursuit.roadblocks=路障设置
uv.pursuit.roadblocks.maxnr=最大路障数量
uv.pursuit.roadblocks.maxnr.desc=每次最多加载多少路障。\n\n设置为0以禁用生成路障。

uv.pursuit.roadblocks.alwaysjoinpursuit=通过路障后加入追逐
uv.pursuit.roadblocks.alwaysjoinpursuit.desc=决定路障中的单位在嫌疑车辆通过后是否加入追逐：始终加入、从不加入，或由每个路障单独决定。

uv.pursuit.roadblocks.alwaysjoinpursuit.off=禁用
uv.pursuit.roadblocks.alwaysjoinpursuit.always=始终加入
uv.pursuit.roadblocks.alwaysjoinpursuit.never=从不加入

uv.chatter=电台播报
uv.chatter.enable=启用电台播报
uv.chatter.enable.desc=启用 AI 单位与调度中心之间的语音通讯。

uv.response=呼叫增援
uv.response.enable=启用呼叫增援
uv.response.enable.desc=AI单位将生成并自动响应地图上的增援呼叫。
uv.response.speedlimit=速度上限 (MPH)
uv.response.speedlimit.desc=空闲的AI单位按照速度上限运行。\n\n普巡AI单位将强制以速度上限的速度在DV路径点运行。\n\n设置为0以禁用。

#---------- New Settings Menu, Pursuit Tech
uv.ptech=追捕技能
uv.ptech.racer=赛车手追捕技能
uv.ptech.racer.desc=如果你想让追捕技能随赛车手生成则设为启用。
uv.ptech.friendlyfire=赛车手友军伤害
uv.ptech.friendlyfire.desc=如果你想让追捕技能作用到其他友方单位身上则设为启用。
uv.ptech.roadblockfriendlyfire=路障友军伤害
uv.ptech.roadblockfriendlyfire.desc=如果单位会受到与路障一同生成的钉刺带附属的效果，请启动这个选项。

#---------- New Settings Menu, Pursuit Breakers
uv.pb=追捕阻断器
uv.pb.maxnr=最大数量
uv.pb.maxnr.desc=每次最多可加载多少个追捕阻断器。\n\n设置为0以禁用追捕阻断器生成。

uv.pb.cooldown=生成冷却期
uv.pb.cooldown.desc=多长时间（秒），坏掉的追捕破坏者会生成另一个来取代旧的它。

#---------- New Settings Menu, Repair Shops
# uv.rs=Repair Shops
# uv.rs.maxnr=Max Amount
# uv.rs.maxnr.desc=How many Repair Shops can be loaded at one time.\n\nSet to 0 to disable Repair Shops from spawning.

# uv.rs.cooldown=Spawning Cooldown
# uv.rs.cooldown.desc=How long, in seconds, it takes before the Repair Shop despawns and another spawns to take its place.

