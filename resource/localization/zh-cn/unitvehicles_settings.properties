#---------- 新版设置菜单：音频
uv.audio.title=音频
uv.audio.volume=音乐音量
uv.audio.volume.desc=设置播放时的音量大小。
uv.audio.copchatter=警用通讯
uv.audio.copchatter.desc=设置单位语音的播放音量。
uv.audio.mutecp=禁用检查点音效
uv.audio.mutecp.desc=在比赛中禁用经过检查点的音效。

uv.audio.uvtrax=UVTrax™
uv.audio.uvtrax.enable=启用 UVTrax™
uv.audio.uvtrax.desc=开关比赛过程中的音乐。
uv.audio.uvtrax.profile=UVTrax™ 配置
uv.audio.uvtrax.profile.desc=选择 UVTrax™ 使用的类别。
uv.audio.uvtrax.freeroam=自由漫游时启用 UVTrax™
uv.audio.uvtrax.freeroam.desc=如果启用，UVTrax™ 将在自由探索时播放。
uv.audio.uvtrax.pursuits=追捕场景下启用 UVTrax™
uv.audio.uvtrax.pursuits.desc=启用后，UVTrax™ 将在追捕（非比赛中）时替换追捕主题音乐。
uv.audio.uvtrax.shuffle=随机播放 UVTrax™
uv.audio.uvtrax.shuffle.desc=启用后，每次加载 UVTrax™ 时都会随机打乱播放列表。

uv.audio.uvtrax.editor=UVTrax™ 播放列表管理器
uv.audio.uvtrax.editor.desc=创建并管理自定义播放列表：添加/移除曲目，并设置每个播放列表允许播放的曲目。

uv.audio.uvtrax.profiles=配置文件
uv.audio.uvtrax.profiles.desc=为每个 UVTrax™ 配置文件切换可播放的曲目。
uv.audio.uvtrax.profiles.loaded=当前配置文件已加载曲目数量 / 总曲目数量。

uv.audio.uvtrax.tracks=曲目列表

uv.audio.pursuit=追捕
uv.audio.pursuit.enable=启用追捕主题音乐
uv.audio.pursuit.desc=开关追捕时的音乐。
uv.audio.pursuit.sfx=追捕音效
uv.audio.pursuit.sfx.desc=追捕过程中播放相关音效。
uv.audio.pursuittheme=追捕主题曲
uv.audio.pursuittheme.desc=选择追捕主题音乐所使用的类别。
uv.audio.pursuitpriority=比赛中的追捕主题音乐
uv.audio.pursuitpriority.desc=启用后，当比赛中发生追捕时，追捕主题音乐将替换 UVTrax™。
uv.audio.pursuittheme.random=随机热度等级主题曲
uv.audio.pursuittheme.random.desc=从你选择的追捕主题曲中抽取并播放热度等级主题曲。
uv.audio.pursuittheme.random.type=随机模式
uv.audio.pursuittheme.random.type.desc=顺序：随机歌曲依次播放。\n\n每 X 分钟：歌曲将每隔 X 分钟随机切换一次。
uv.audio.pursuittheme.random.minutes=每 X 分钟
uv.audio.pursuittheme.random.minutes.desc=歌曲主题切换的时间间隔（分钟）。\n\n需要将“随机模式”设置为“每 X 分钟”。

uv.audio.pursuittheme.random.type.sequential=顺序

uv.audio.racing=赛事
uv.audio.racing.sfx=赛事音效
uv.audio.racing.sfx.desc=选择竞速音效所使用的音效分类。

uv.audio.menu.sfx=菜单音效
uv.audio.menu.sfx.desc=在浏览 UV 菜单时播放音效。
uv.audio.menu.sfx.profile=菜单音效配置
uv.audio.menu.sfx.profile.desc=选择菜单音效所使用的音效分类。

#---------- 新版设置菜单：操控
uv.controls=控制
uv.controls.races=竞速
uv.controls.pt=追击科技

uv.keybind.skipsong=下一首
uv.keybind.skipsong.desc=跳过当前的 UVTrax™ 歌曲。

uv.keybind.prevsong=上一首
uv.keybind.prevsong.desc=播放上一首 UVTrax™ 歌曲。

uv.keybind.resetposition=重置位置
uv.keybind.resetposition.desc=将车辆重置到上一个检查点。

uv.keybind.showresults=显示比赛结果
uv.keybind.showresults.desc=比赛结束后显示比赛结果。

uv.keybind.slot1=左槽位
uv.keybind.slot1.desc=激活分配到槽位 1 的追击科技。
uv.keybind.slot2=右槽位
uv.keybind.slot2.desc=激活分配到槽位 2 的追击科技。

uv.controls.anybutton=按下任意按键

uv.controls.controllermode=手柄适配模式
uv.controls.controllermode.enable=启用手柄适配模式
uv.controls.controllermode.enable.desc=启用后，部分操作会被更改或禁用：\n\n1. 结算界面中禁用鼠标。\n2. 部分按键绑定会被调整：\n\n[+attack] = [+jump]\n[+attack2] = [+reload]

uv.controls.glyphs=按键图标
uv.controls.glyphs.enable=覆盖按键图标
uv.controls.glyphs.enable.desc=允许在 UV 菜单及部分 UV UI 元素上自定义按键提示图标。\n\n注意：这不会修改任何按键绑定，仅改变显示效果。

uv.controls.glyphs.uvkeybinds=UV 按键绑定

uv.controls.glyphs.action=操作
uv.controls.glyphs.action.desc=选择要绑定图标的操作。

uv.controls.glyphs.glyph=图标
uv.controls.glyphs.glyph.desc=选择要分配给该操作的图标。

uv.controls.glyphs.active=已启用
uv.controls.glyphs.active.desc=当前启用的图标列表。

#---------- 新版设置菜单：镜头
uv.camera=镜头
uv.camera.actioncam=启用动作镜头
uv.camera.actioncam.desc=启用后，在特定事件中镜头会切换为戏剧化视角。\n\n单人游戏中画面可能会变慢。\n\n使用速度破坏器可阻止动作镜头触发。

uv.camera.actioncam.wrecked=被损毁、被捕或被击杀时
uv.camera.actioncam.wrecked.desc=当你被损毁、被捕或被击杀时显示戏剧化视角。

uv.camera.actioncam.racestart=比赛开始时
uv.camera.actioncam.racestart.desc=比赛开始时显示戏剧化视角。

uv.camera.actioncam.racefinish=比赛结束时
uv.camera.actioncam.racefinish.desc=比赛结束时显示戏剧化视角。\n\n生效期间，你的车辆将由 AI 驾驶。\n\n在单人游戏中，你的车辆将暂时免疫碰撞与钉刺带。

uv.camera.actioncam.crash=车辆发生碰撞时
uv.camera.actioncam.crash.desc=车辆发生碰撞时显示戏剧化视角。
uv.camera.actioncam.crash.threshold=触发所需伤害

uv.camera.actioncam.jump=腾空时
uv.camera.actioncam.jump.desc=飞跃跳台时显示戏剧化视角。
uv.camera.actioncam.jump.threshold=触发所需高度

uv.camera.actioncam.spotted=追捕开始时
uv.camera.actioncam.spotted.desc=开始追捕时，被最近的单位发现将显示戏剧化视角。

uv.camera.actioncam.roadblock=撞上路障时
uv.camera.actioncam.roadblock.desc=撞上路障时显示戏剧化视角。
uv.camera.actioncam.roadblock.threshold=触发所需速度

uv.camera.actioncam.takedown=击倒时
uv.camera.actioncam.takedown.desc=击倒车手或单位时显示戏剧化视角。
uv.camera.actioncam.takedown.threshold=触发所需距离

uv.camera.actioncam.pursuitbreaker=撞上追击破坏点时
uv.camera.actioncam.pursuitbreaker.desc=撞上追击破坏点时显示戏剧化视角。\n\n生效期间，你的车辆将由 AI 驾驶。\n\n在单人游戏中，你的车辆将暂时免疫碰撞与钉刺带。

#---------- 新版设置菜单：追捕设置
uv.pursuit=追捕设置

uv.pursuit.heatlevels=热度等级
uv.pursuit.heatlevels.enable=启用热度等级
uv.pursuit.heatlevels.enable.desc=启用热度等级系统，当赏金达到特定阈值时提升热度等级，从而增加单位数量、攻击性和多样性。
uv.pursuit.heatlevels.aiunits=AI 单位生成
uv.pursuit.heatlevels.aiunits.desc=主要的 AI 单位（巡逻、支援等）会在附近生成并加入追捕。\n\n犀牛单位与空中单位可通过“创建器：单位”工具启用。

uv.pursuit.randomplayerunits=随机玩家单位
uv.pursuit.randomplayerunits.desc=启用后，玩家控制的单位将从可用单位中随机选择。
uv.pursuit.autohealth=无限耐久
uv.pursuit.autohealth.desc=让嫌疑人车辆的耐久度不受限制，当你作为嫌疑人时耐久度是根据车辆的质量设置的。\n\n如果你不想继续被撞坏，或者你想要更耐打的嫌疑人，可以设为启用。
uv.pursuit.wheelsdetaching=车轮脱落
uv.pursuit.wheelsdetaching.desc=启用后，损毁的车辆将会脱落车轮。
uv.pursuit.canexitvehicle=允许离开载具
uv.pursuit.canexitvehicle.desc=如果启用，玩家可以在比赛和追捕途中离开载具。
uv.pursuit.repaircooldown=维修冷却期
uv.pursuit.repaircooldown.desc=维修站多久才能使用一次。\n\n设为 0可使其变为一次性使用。
uv.pursuit.repairrange=维修距离
uv.pursuit.repairrange.desc=距离修理站的锤子单位数（在此距离内可修复你的车辆）。
uv.pursuit.noevade=永不逃避
uv.pursuit.noevade.desc=如果启用，则永远无法进入冷却状态。\n\n祝你好运！
uv.pursuit.bustedtime=逮捕时间
uv.pursuit.bustedtime.desc=嫌疑人被捕前的时间（秒）。\n\n设为 0以禁用。
uv.pursuit.respawntime=重生冷却时间（单位）
uv.pursuit.respawntime.desc=玩家在单位车辆中重生前的时间（秒）。\n\n设为 0以禁用。
uv.pursuit.spikeduration=轮胎充气时间
uv.pursuit.spikeduration.desc=被钉刺带扎中的轮胎需要多长时间（秒）才能重新充气。\n\n设为 0 可禁用轮胎重新充气。

uv.pursuit.roadblocks=路障设置
uv.pursuit.roadblocks.maxnr=最大路障数量
uv.pursuit.roadblocks.maxnr.desc=每次最多加载多少路障。\n\n设为 0以禁用生成路障。

uv.pursuit.roadblocks.alwaysjoinpursuit=通过路障后加入追捕
uv.pursuit.roadblocks.alwaysjoinpursuit.desc=决定路障中的单位在嫌疑车辆通过后是否加入追捕：始终加入、从不加入，或由每个路障单独决定。

uv.pursuit.roadblocks.alwaysjoinpursuit.off=禁用
uv.pursuit.roadblocks.alwaysjoinpursuit.always=始终加入
uv.pursuit.roadblocks.alwaysjoinpursuit.never=从不加入

uv.chatter=电台播报
uv.chatter.enable=启用电台播报
uv.chatter.enable.desc=启用 AI 单位与调度中心之间的语音通讯。

uv.response=呼叫增援
uv.response.enable=启用呼叫增援
uv.response.enable.desc=AI单位将生成并自动响应地图上的增援呼叫。
uv.response.speedlimit=速度上限（英里/小时）
uv.response.speedlimit.desc=空闲的 AI 单位会遵守此限速。\n\n巡逻中的 AI 单位会遵守 DV 路径点上设定的限速。\n\n设为 0 可禁用。

#---------- 新版设置菜单：追击科技
uv.ptech=追击科技
uv.ptech.racer=车手追击科技
uv.ptech.racer.desc=启用后，车手将自动装备追击科技。
uv.ptech.friendlyfire=车手友军伤害
uv.ptech.friendlyfire.desc=启用后，车手之间可以互相使用追击科技。
uv.ptech.roadblockfriendlyfire=路障友军伤害
uv.ptech.roadblockfriendlyfire.desc=启用后，随路障一同出现的钉刺带也会影响单位。

#---------- 新版设置菜单：追击破坏点
uv.pb=追击破坏点
uv.pb.maxnr=最大数量
uv.pb.maxnr.desc=同一时间最多能加载多少个追击破坏点。\n\n设为 0 可禁用追击破坏点生成。

uv.pb.cooldown=生成冷却期
uv.pb.cooldown.desc=追击破坏点消失并由新的接替所需的时间（秒）。

#---------- 新版设置菜单：维修站
uv.rs=维修站
uv.rs.maxnr=最大数量
uv.rs.maxnr.desc=同一时间最多能加载多少个维修站。\n\n设为 0 可禁用维修站生成。

uv.rs.cooldown=生成冷却
uv.rs.cooldown.desc=维修站消失并由新的接替所需的时间（秒）。

#---------- 新版设置菜单：AI
uv.ai.title=AI 设置

uv.aidifficulty=AI 难度

uv.aidifficulty.racer=车手难度
uv.aidifficulty.racer.desc=选择 AI 车手所需的难度等级。\n\n难度越高，所有 AI 对手的速度与过弯能力会逐渐提升。\n\n若在比赛中途更改，将在本场比赛结束后生效。\n\n不影响未参加比赛的 AI 车手，并在比赛结束后重置。
uv.aidifficulty.racer.rubberband=橡皮筋机制
uv.aidifficulty.racer.rubberband.desc=启用后，落后太多的 AI 车手会逐渐获得速度与抓地力加成，从而更快追上来。\n\n效果随难度增强。\n\n追捕期间不生效。

uv.aidifficulty.racer.rubberbandrev=反向橡皮筋机制
uv.aidifficulty.racer.rubberbandrev.desc=启用后，领先太多的 AI 车手速度会逐渐降低。\n\n效果随领先距离增强。\n\n追捕期间不生效，也不适用于正在追赶前方玩家的 AI。

uv.aidifficulty.racer.rubberband.gap=触发差距
uv.aidifficulty.racer.rubberband.gap.desc=AI 车手落后下一位玩家多远时开始橡皮筋机制。
uv.aidifficulty.racer.rubberbandrev.gap.desc=AI 车手领先身后玩家多远时开始反向橡皮筋机制。

uv.aidifficulty.racer.cautious=谨慎模式
uv.aidifficulty.racer.cautious.desc=启用后，AI 车手会更加谨慎，更注意其他车手且攻击性更低。
uv.aidifficulty.racer.cautiousrandomness=谨慎模式随机化
uv.aidifficulty.racer.cautiousrandomness.desc=是否为 AI 车手随机启用谨慎模式。

uv.aidifficulty.unit=单位难度
uv.aidifficulty.unit.desc=选择 AI 单位所需的难度等级。\n\n难度越高，所有 AI 单位的速度与过弯能力会逐渐提升。
uv.aidifficulty.unit.rubberband=允许追赶
uv.aidifficulty.unit.rubberband.desc=启用后，AI 单位落后时会逐渐获得速度与抓地力加成，从而更快追上。\n\n效果随难度增强。

uv.ailogic=AI 逻辑

uv.ailogic.drivermodel=驾驶员模型
uv.ailogic.drivermodel.desc=AI 会依 NPC 类别生成对应的驾驶员模型。
uv.ailogic.optimizerespawn=优化重生
uv.ailogic.optimizerespawn.desc=单位将传送到嫌犯的前方，而不是直接重生。\n\n提高性能。
uv.ailogic.trafficstreaming=交通流式加载
uv.ailogic.trafficstreaming.desc=交通车辆与巡逻单位在离玩家太远时会消失，从而让新的单位得以生成。\n\n影响性能。
uv.ailogic.relentless=无情追捕
uv.ailogic.relentless.desc=AI 单位会表现得更具攻击性，就像《极品飞车：宿敌》里的警察。\n\n他们会不顾自身安危来完成任务。
uv.ailogic.wrecking=启用车辆损毁
uv.ailogic.wrecking.desc=AI 载具可以被彻底损毁。
uv.ailogic.detectionrange=侦测距离
uv.ailogic.detectionrange.desc=手动生成单位时，与车辆的最小生成距离（单位：锤子单位）。若生成单位时遇到问题，可使用更高数值。

uv.ailogic.headlights=启用车头灯
uv.ailogic.headlights.desc=AI 载具会开启车头灯。\n\n影响性能。
uv.ailogic.headlights.off=始终关闭
uv.ailogic.headlights.auto=自动
uv.ailogic.headlights.always=始终开启

uv.ailogic.usenitrousracer=AI 车手氮气加速
uv.ailogic.usenitrousracer.desc=允许 AI 车手使用氮气加速。\n\n注意：仅适用于 Glide 载具。
uv.ailogic.usenitrousunit=AI单位氮气加速
uv.ailogic.usenitrousunit.desc=允许AI单位使用氮气加速。\n\n注：仅适用于 Glide 载具。

uv.ailogic.autohealthracer=AI 车手无限耐久
uv.ailogic.autohealthracer.desc=为 AI 车手提供无限的载具耐久。

uv.ailogic.customizeracer=自定义 AI 车手的载具
uv.ailogic.customizeracer.desc=AI 车手生成到载具中时会随机应用颜色、皮肤与身体部件。\n\n注意：不适用于带有基于部件损坏脚本的 Glide 载具。

uv.ailogic.tractioncontrol=牵引力控制
uv.ailogic.tractioncontrol.desc=AI 车手与单位在失去抓地力时会降低油门。\n\n注意：仅适用于 Glide 与 Simfphys 载具。

uv.ailogic.disengageonheatchange=热度变化时脱离
uv.ailogic.disengageonheatchange.desc=当热度等级变化时，如果 AI 单位的车辆与所指定的任何车辆都不匹配，他们就会撤退。\n\n此过程不会消耗资源点。\n\n注意：不适用于手动生成的 AI 单位。

uv.ainav=AI 导航
uv.ainav.pathfind=寻路
uv.ainav.pathfind.desc=AI 将使用 A* 寻路算法，通过导航网格或 Decent Vehicle 路径点进行导航。\n\n影响性能。
uv.ainav.dvpriority=DV路径点优先
uv.ainav.dvpriority.desc=如果可行，AI 会先尝试通过 Decent Vehicle 路径点导航，然后再通过导航网格导航。
uv.ainav.dvdistancebased=DV 路径点距离判定
uv.ainav.dvdistancebased.desc=AI 在 Decent Vehicle 路径点上将使用基于距离的方式进行导航。\n\n禁用 = 嫌疑人出现在视野内时直接追击。\n\n启用 = 距离嫌疑人太远时通过路径点导航。
uv.ainav.dvnavoptimized=优化 DV 导航
uv.ainav.dvnavoptimized.desc=启用后，AI 将使用优化的寻路算法在 DV 路径点上导航。如果你的单位出现导航问题，请禁用此选项。\n\n在拥有大量路径点的 InfMap 地图上最为有用。\n\n<color=255,255,0>实验性功能</color>


#---------- 新版设置菜单：AI
uv.uvset.title=UV 设置

uv.ui.menu=UV 菜单
uv.ui.menu.desc=通过更改颜色和功能来自定义 UV 菜单外观。

uv.ui.menu.hidedesc=强制隐藏说明
uv.ui.menu.hidedesc.desc=强制隐藏所有 UV 菜单标签页中的说明区域，从而缩短菜单宽度。\n\n需要重新加载菜单实例后生效。

uv.ui.menu.hideprompts=强制隐藏提示
uv.ui.menu.hideprompts.desc=强制隐藏 UV 菜单各标签页的操作提示。\n\n需要重新打开菜单后生效。

uv.ui.menu.openspeed=打开速度
uv.ui.menu.openspeed.desc=菜单打开所需时间。\n\n以秒为单位。

uv.ui.menu.closespeed=关闭速度
uv.ui.menu.closespeed.desc=菜单关闭所需时间。\n\n以秒为单位。

uv.ui.menu.custcol=自定义颜色
uv.ui.menu.custcol.desc=自定义 UV 菜单的颜色。

uv.ui.dataimport=数据导入
uv.ui.dataimport.desc=调整第一方与第三方数据的导入方式。

uv.ui.dataimport.enableimport=启用数据导入
uv.ui.dataimport.enableimport.desc=启用启动时自动扫描新的 UV 数据。\n\n<color=255,100,100>警告</color>：根据你插件中包含的数据量，可能会造成卡顿。

uv.ui.dataimport.enablereplace=启用数据替换
uv.ui.dataimport.enablereplace.desc=启用启动时自动扫描被改动的 UV 数据。\n\n<color=255,100,100>警告</color>：根据你插件中包含的数据量，可能会造成卡顿。

uv.ui.dataimport.scan=扫描新增与被改动的数据
uv.ui.dataimport.scan.desc=手动扫描新增与被改动的 UV 数据。\n\n<color=255,100,100>警告</color>：根据你插件中包含的数据量，可能会造成卡顿。

uv.ui.dataimport.replaceserver=[服务器] 查看被改动的数据
uv.ui.dataimport.replaceserver.desc=打开 UV 数据替换提示，允许管理员确认替换 UV 数据。\n\n<color=255,100,100>警告</color>：根据你插件中包含的数据量，可能会造成卡顿。

uv.ui.dataimport.workshoppriority=创意工坊优先
uv.ui.dataimport.workshoppriority.desc=如果启用，创意工坊内容将优先于本地内容。\n\n这样即使你把创意工坊插件的文件放在了本地数据文件夹中（其实你最好把它们删掉），也能让创意工坊内容保持最新。\n如果你想改用/修改本地内容而不是创意工坊内容，请禁用此选项。\n\n<color=255,255,0>注意</color>：更改此设置需要重新加载地图！

#---------- 内置插件
uv.vcmod.els=VCMod ELS 优先
uv.vcmod.els.desc=使用 HL2 载具基底的单位在两者都安装时，会优先使用 VCMod 的 ELS 而不是 Photon。

uv.lvs.alwaysfullthrottle=始终全油门
uv.lvs.alwaysfullthrottle.desc=无需按住油门修饰键即可使用全油门。


#---------- 新版设置菜单：调试
uv.debug=调试菜单

uv.debug.warning=正在进入调试菜单
uv.debug.warning.desc=你即将进入单位载具的调试菜单。\n\n这些内容并非面向公众，但可用于测试某些元素与功能，以确认它们能否正常工作。\n\n请注意，这些功能面向开发者与贡献者，普通用户就功能（包括报错）提出的任何抱怨都将被无视。\n\n你确定要继续吗？

uv.debug.confirm=确认并继续
uv.debug.cancel=取消并返回

uv.debug.raceresults=模拟比赛结果 - %s 名车手

uv.debug.pursuitresults.racer=模拟追捕结果（车手）
uv.debug.pursuitresults.units=模拟追捕结果（单位）
uv.debug.pursuitresults.escaped=逃脱
uv.debug.pursuitresults.busted=被捕

uv.debug.infraction=%s 项模拟违法行为
