#---------- [ 追擊科技字串 ]
# 字串
uv.ptech=追擊科技

uv.ptech.slot.left=槽位 1
uv.ptech.slot.right=槽位 2

# 屬性
uv.ptech.duration=持續時間
uv.ptech.duration.desc=該追擊科技將保持活躍狀態多長時間。

uv.ptech.power=能量
uv.ptech.power.desc=這個追擊科技的能量有多少。

uv.ptech.damage=命中時造成的傷害
uv.ptech.damage.desc=命中目標時造成的傷害倍率。\n設為 1 則為全額傷害。

uv.ptech.damagecommander=指揮官命中時造成的傷害
uv.ptech.damagecommander.desc=命中指揮官單位時造成的傷害倍率。\n設為 1 則為全額傷害。

uv.ptech.cooldown=冷卻時間
uv.ptech.cooldown.desc=多久之後才能再次使用這個追擊科技。

uv.ptech.maxammo=充能次數
uv.ptech.maxammo.desc=該追擊科技在耗盡前最多可使用多少次？\n設為 0可實現無限使用。

uv.ptech.maxdistance=範圍
uv.ptech.maxdistance.desc=該追擊科技可啟用的目標距離。\n以 Hammer 單位（遊戲內部距離單位）為測量標準。

uv.ptech.force=衝擊力
uv.ptech.force.desc=撞擊目標時施加的力量大小。

uv.ptech.lockontime=鎖定時間
uv.ptech.lockontime.desc=該追擊科技鎖定目標所需的時間。

uv.ptech.disableduration=癱瘓時間
uv.ptech.disableduration.desc=被此追擊科技擊中的車輛將保持癱瘓狀態多長時間。

uv.ptech.length=長度
uv.ptech.length.desc=追擊科技約束的長度。

uv.ptech.strength=強度
uv.ptech.strength.desc=追擊科技約束的強度。

# 通用
uv.ptech.emp=電磁脈衝
uv.ptech.emp.short=電磁脈衝
uv.ptech.emp.desc=電磁脈衝（EMP）會鎖定前方的車輛，並釋放巨大的靜電脈衝，使其電子系統暫時癱瘓。\n\n升級後：鎖定距離、傷害與作用力翻倍。

uv.ptech.emp.activated=EMP 已啟用
uv.ptech.emp.lockingon=EMP 正在鎖定
uv.ptech.emp.missed=EMP 未命中
uv.ptech.emp.dodged=已避開 EMP
uv.ptech.emp.notarget=沒有可對 EMP 使用的有效目標

uv.ptech.emp.hit=你用 EMP 擊中了 %s
uv.ptech.emp.hit.you=%s 用 EMP 擊中了你

uv.ptech.esf=靜電場
uv.ptech.esf.short=靜電場
uv.ptech.esf.desc=靜電場（ESF）為車身充能，形成強大的靜電場，可抵禦眩暈地雷與 EMP 鎖定，並對任何觸碰它的物件造成強力電擊。\n\n升級後：威力與傷害翻倍。

uv.ptech.esf.activated=ESF 已啟用
uv.ptech.esf.hit=你用 ESF 擊中了 %s
uv.ptech.esf.hit.you=%s 用 ESF 擊中了你

uv.ptech.repairkit=維修套件
uv.ptech.repairkit.short=維修套件
uv.ptech.repairkit.desc=維修套件會啟動車載快速修復系統，為你的載具進行戰地搶修。自動維修模組專為應急響應與戰術機動而設計，透過內建的自密封元件與強化液壓系統恢復載具的結構完整性。\n\n升級後：補滿你的氮氣。

uv.ptech.repairkit.activated=維修套件已部署

# 僅車手
uv.ptech.jammer=干擾器
uv.ptech.jammer.short=干擾器
uv.ptech.jammer.desc=干擾器會在你的車周圍形成臨時力場，抵禦科技攻擊，並干擾附近其他駕駛者的 HUD，使其無法使用追擊科技。\n\n升級後：持續時間翻倍。

uv.ptech.jammer.activated=干擾器已啟用
uv.ptech.jammer.hit.you=受到干擾

uv.ptech.shockwave=衝擊波
uv.ptech.shockwave.short=衝擊波
uv.ptech.shockwave.desc=衝擊波會從車身中心爆發出音爆衝擊，將附近的載具推開並造成傷害。\n\n升級後：傷害與作用力翻倍。

uv.ptech.shockwave.activated=衝擊波已部署
uv.ptech.shockwave.hit=你使用衝擊波擊中了 %s
uv.ptech.shockwave.hit.you=%s 使用衝擊波擊中了你

uv.ptech.stunmine=眩暈地雷
uv.ptech.stunmine.short=眩暈地雷
uv.ptech.stunmine.desc=眩暈地雷會部署在車後，被其撞上的載具電子系統會過載，造成傷害並失控。\n\n升級後：傷害與作用力翻倍。

uv.ptech.stunmine.activated=眩暈地雷已部署
uv.ptech.stunmine.hit=你使用眩暈地雷擊中了 %s
uv.ptech.stunmine.hit.you=%s 使用眩暈地雷擊中了你

uv.ptech.powerplay=強力行動
uv.ptech.powerplay.short=強力行動
uv.ptech.powerplay.desc=啟動強力行動會觸發距離駕駛員最近的追擊破壞點，迫使其坍塌。\n\n升級後：觸發距離翻倍。

uv.ptech.powerplay.activated=強力行動已啟用
uv.ptech.powerplay.nopb=附近沒有追擊破壞點

uv.ptech.juggernaut=暴走
uv.ptech.juggernaut.short=暴走
uv.ptech.juggernaut.desc=暴走會大幅提升車輛的撞擊力，更容易撞開道具和攔路的車輛。\n\n升級後：持續時間翻倍。

uv.ptech.juggernaut.activated=暴走已啟用

uv.ptech.ghost=幽靈
uv.ptech.ghost.short=幽靈
uv.ptech.ghost.desc=啟動幽靈後，駕駛員的載具將與道具和其他載具失去碰撞。\n\n升級後：持續時間翻倍。

uv.ptech.ghost.activated=幽靈已啟用

# 僅單位
uv.ptech.killswitch=斷電開關
uv.ptech.killswitch.short=斷電開關
uv.ptech.killswitch.desc=斷電開關會鎖定前方的車輛，並釋放巨大的靜電脈衝，使其電子系統暫時癱瘓。\n\n升級後：癱瘓時間翻倍。

uv.ptech.killswitch.activated=斷電開關已啟用
uv.ptech.killswitch.lockingon=斷電開關鎖定已開啟
uv.ptech.killswitch.dodged=斷電開關已脫離
uv.ptech.killswitch.hit=你使用斷電開關擊中了 %s
uv.ptech.killswitch.hit.you=%s 使用斷電開關擊中了你

uv.ptech.killswitch.engine.on=引擎重啟完畢
uv.ptech.killswitch.getclose=再靠近點才能使用斷電開關
uv.ptech.killswitch.novalid=無有效目標可對其使用斷電開關

uv.ptech.skyhammer=天錘
uv.ptech.skyhammer.lockingon=天錘正在鎖定
uv.ptech.skyhammer.dodged=已避開天錘
uv.ptech.skyhammer.hit.you=%s 用天錘擊中了你

uv.ptech.spikes=釘刺帶
uv.ptech.spikes.short=釘刺帶
uv.ptech.spikes.desc=釘刺帶從車尾部署後會迅速展開，對駛過其上的車輛輪胎造成損傷，若無法避開則可能同時命中多輛載具。\n\n升級後：部署兩條釘刺帶。

uv.ptech.spikes.activated=釘刺帶已部署
uv.ptech.spikes.tiresreinflate=輪胎重新充氣
uv.ptech.spikes.hit=你用釘刺帶擊中了 %s
uv.ptech.spikes.hit.you=%s 用釘刺帶擊中了你

uv.ptech.shockram=衝擊衝鋒
uv.ptech.shockram.short=衝撞
uv.ptech.shockram.desc=衝擊衝鋒會從車頭爆發音爆衝擊波，推開並傷害被波及的車輛。\n\n升級後：傷害與作用力翻倍。

uv.ptech.shockram.activated=衝擊衝鋒已部署
uv.ptech.shockram.hit=你用衝擊衝鋒擊中了 %s
uv.ptech.shockram.hit.you=%s 用衝擊衝鋒擊中了你

uv.ptech.gpsdart=GPS 飛鏢
uv.ptech.gpsdart.short=GPS
uv.ptech.gpsdart.desc=GPS 追蹤鏢是一種載具標記系統，從車頭髮射，可標記、追蹤並定位逃逸的載具。\n\n升級後：發射兩枚 GPS 追蹤鏢。

uv.ptech.gpsdart.activated=GPS 飛鏢已發射
uv.ptech.gpsdart.missed=GPS 飛鏢未命中

uv.ptech.gpsdart.hit=你用 GPS 飛鏢擊中了 %s
uv.ptech.gpsdart.hit.you=%s 用 GPS 飛鏢擊中了你

uv.ptech.expbarrel=炸藥桶

uv.ptech.grappler=抓鉤
uv.ptech.grappler.short=抓鉤
uv.ptech.grappler.desc=抓鉤是一種使用高強度尼龍網纏住逃逸車輛輪胎的裝置，可使其受控停下。\n\n升級後：拉力翻倍。

uv.ptech.grappler.activated=抓鉤已部署
uv.ptech.grappler.missed=抓鉤未命中

uv.ptech.grappler.hit=你用抓鉤擊中了 %s
uv.ptech.grappler.hit.you=%s 用抓鉤擊中了你

#---------- [ 提示字串 ]
uv.tip=提示：%s

# 通用
uv.tip.repairshop=使用 [string:uv.repairshop] 修復你的載具並補滿追擊科技。如果你安裝了 <color=255,255,0>Glide // Circular Functions</color>，還能補滿氮氣。

uv.tip.pt.emp1=使用 [string:uv.ptech.emp] 對前方的載具施以致命電擊。
uv.tip.pt.emp2=急打方向避開 [string:uv.ptech.emp]，或使用 [string:uv.ptech.jammer] 將其擋下。
uv.tip.pt.emp3=車手可以使用 [string:uv.ptech.emp] 迫使 [string:uv.unit.helicopter] 退出追捕。
uv.tip.pt.esf1=使用 [string:uv.ptech.esf] 在自身周圍形成攻擊性靜電場，對任何觸碰它的物件造成電擊傷害。
uv.tip.pt.esf2=使用 [string:uv.ptech.esf] 反制 [string:uv.ptech.stunmine] 或 [string:uv.ptech.emp]。
uv.tip.pt.repairkit1=車輛損毀嚴重？用 [string:uv.ptech.repairkit] 立刻恢復滿狀態！
uv.tip.pt.spikes1=使用 [string:uv.ptech.spikes] 扎破目標車輛的輪胎，讓他們極難再控制住車輛。
uv.tip.pt.spikes2=使用 [string:uv.ptech.shockwave] 或 [string:uv.ptech.shockram] 把釘刺帶推開。
uv.tip.pt.jammer=如果某個對手還能使用其他追擊科技，就說明他當前沒有啟用 [string:uv.ptech.jammer]。

uv.tip.drafting=跟在其他車手或單位後面吸尾流時要小心，他們可能直接在你要走的路線前丟下 [string:uv.ptech.spikes] 或 [string:uv.ptech.stunmine]。

# 車手
uv.tip.racer.pt.jammer1=[string:uv.ptech.jammer] 不僅能干擾其他駕駛者的 HUD，還會立即禁用任何正在生效的追擊科技。
uv.tip.racer.pt.jammer2=使用 [string:uv.ptech.jammer] 可以阻止 AI 單位生成，給你製造逃脫的機會。
uv.tip.racer.pt.shockwave1=使用 [string:uv.ptech.shockwave] 把周圍的載具推開。
uv.tip.racer.pt.stunmine1=[string:uv.ptech.stunmine] 會部署在你的車後，對駛近的任何載具造成傷害。
uv.tip.racer.pt.powerplay1=使用 [string:uv.ptech.powerplay] 遠端觸發最近的追擊破壞點。
uv.tip.racer.pt.juggernaut1=被路障擋住了？試試用 [string:uv.ptech.juggernaut] 提升車輛的撞擊力。
uv.tip.racer.pt.ghost1=使用 [string:uv.ptech.ghost] 可暫時讓載具與道具和其他駕駛者失去碰撞。

uv.tip.racer.pt.killswitch1=遠離攻擊者，或使用 [string:uv.ptech.jammer]，即可躲開 [string:uv.ptech.killswitch]。
uv.tip.racer.pt.skyhammer1=躲進掩體、駛離直升機，或使用 [string:uv.ptech.jammer]，即可躲開 [string:uv.ptech.skyhammer]。
uv.tip.racer.pt.shockram1=單位可能裝備了 [string:uv.ptech.shockram]，它既能造成傷害，也能把前方的載具推開。
uv.tip.racer.pt.gpsdart1=被 [string:uv.ptech.gpsdart] 擊中了？把它撞到牆或物體上，或使用 [string:uv.ptech.jammer] 將其清除。
uv.tip.racer.pt.grappler1=被 [string:uv.ptech.grappler] 抓住了？利用慣性把單位甩開，甚至扯斷繩索，或用 [string:uv.ptech.jammer] 直接解除。

uv.tip.racer.cooldown=處於冷卻狀態時，找個安靜的地方關掉引擎，能更快擺脫他們。
uv.tip.racer.aitactics1=AI 單位不擅長應對複雜地形，往泥地、森林或工地裡鑽可以讓它們被困住或迷失方向。
uv.tip.racer.aitactics2=AI 單位會用滾動路障來攔截你。踩下剎車，或者找路繞開。
uv.tip.racer.pb=衝過<color=255,255,0>追擊破壞點</color>（以紅色三角標記）可以摧毀建築，並讓那些跟著你的倒黴單位動彈不得。
uv.tip.racer.comunits1=<color=255,255,0>指揮官單位</color>生成時不會攜帶維修套件，也可能無法在維修站自行修復。
uv.tip.racer.comunits2=<color=255,255,0>指揮官單位</color>無法透過翻車來擊倒。把他們推進<color=255,255,0>追擊破壞點</color>或<color=255,255,0>水中</color>即可直接消滅。
uv.tip.racer.comunits3=只要附近還有<color=255,255,0>指揮官單位</color>，資源點就不會消耗——先解決它們！
uv.tip.racer.airunits1=躲進掩體即可甩開空中單位，或使用 [string:uv.ptech.jammer] 讓它們暫時失去控制。
uv.tip.racer.leastagro=巡邏單位與支援單位是最不具攻擊性的單位。在低熱度等級下，它們大多隻會跟著你。
uv.tip.racer.roadblocks1=如果必須撞開路障，儘量挑輕的道具或車輛撞。
uv.tip.racer.roadblocks2=注意路障之間的空隙——[string:uv.ptech.spikes] 可能就藏在那裡。
uv.tip.racer.boxedin=被包圍了？使用 [string:uv.ptech.ghost] 或 [string:uv.ptech.shockwave] 輕鬆脫身！
uv.tip.racer.upgradedunits=特種單位與指揮官單位可能會正面撞向你。
uv.tip.racer.stuck=卡住了就按 [key:unitvehicle_keybind_resetposition] 回到道路上。
uv.tip.racer.disorient=急轉、猛拐，或者來個飛躍，都能讓單位失去方向感。
uv.tip.racer.rhinounits=避免與<color=255,255,0>犀牛單位</color>正面相撞。

# 單位
uv.tip.unit.pt.killswitch1=儘量對難以躲避的目標使用 [string:uv.ptech.killswitch]，比如在直道上，或目標正被圍堵的時候。
uv.tip.unit.pt.killswitch2=鎖定成功後，[string:uv.ptech.killswitch] 會短暫癱瘓目標車輛的引擎，讓逮捕更輕鬆。
uv.tip.unit.pt.shockram1=使用 [string:uv.ptech.shockram] 傷害你前方的任何載具。
uv.tip.unit.pt.gpsdart1=被 [string:uv.ptech.gpsdart] 擊中的嫌疑人將無處可逃。
uv.tip.unit.pt.grappler1=使用 [string:uv.ptech.grappler] 時，務必逐漸減速，以免被甩來甩去或繩索被扯斷。

uv.tip.unit.pt.shockwave1=被困住的嫌疑人可能會用 [string:uv.ptech.shockwave] 把單位推開。
uv.tip.unit.pt.juggernaut1=使用 [string:uv.ptech.juggernaut] 的嫌疑人並非無敵，仍然會因碰撞而受到傷害。
uv.tip.unit.pt.ghost1=使用 [string:uv.ptech.ghost] 的嫌疑人仍然會被 [string:uv.ptech.spikes]、[string:uv.ptech.emp]、[string:uv.ptech.killswitch] 和 [string:uv.ptech.shockram] 命中。

uv.tip.unit.pit=撞向目標車尾即可執行 PIT 機動，讓目標打轉失控。
uv.tip.unit.teamwork=與隊友配合擒獲嫌疑人。拉近距離，但避免互相撞擊，那會給嫌疑人留下逃跑的空間。
uv.tip.unit.roadblocks=你可以自行放置 [string:uv.ptech.spikes] 來填補路障的空隙。
uv.tip.unit.loneunit=作為單獨行動的單位，儘量不要衝到嫌疑人前面，他們可能突然轉彎、提前下高速，或用追擊科技解決你。
uv.tip.unit.comunit=作為<color=255,255,0>指揮官單位</color>，你應始終待在目標車輛附近，但非必要不要主動交鋒。
uv.tip.unit.nocooldown=作為單位，你不僅看不到冷卻進度條，也看不到躲藏提示。
uv.tip.unit.respawn=你可以隨時按 [key:unitvehicle_keybind_resetposition] 重生為新的單位。
uv.tip.unit.pbnote=如果撞到<color=255,255,0>追擊破壞點</color>結構上的任何道具，你的車輛也可能被摧毀。
