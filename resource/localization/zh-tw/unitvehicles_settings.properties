uv.settings=設定

#---------- 新版設定選單：使用者介面
uv.ui.title=UI
uv.ui.main=主 UI
uv.ui.backup=回退
uv.ui.main.desc=更改競速與追捕 UI 的外觀，使其近似某款特定遊戲的 UI。\n\n注意：這些 UI 並非 1:1 復刻，會有細微差異。
uv.ui.backup.desc=如果所選的主 UI 沒有追捕 UI，就會使用備用的追捕 UI。\n\n注意：這些 UI 並非 1:1 復刻，會有細微差異。

uv.ui.original=原版
uv.ui.none=無UI

uv.ui.speedometer.enable=啟用自定義速度表
uv.ui.speedometer.enable.desc=用與主 UI 風格一致的自制速度表替換基礎速度表。\n\n注意：僅適用於<color=255,255,0>Glide</color> 的汽車、摩托車與坦克。\n\n<color=255,100,100>警告</color>：啟用後部分 Glide 功能將無法使用。

uv.ui.speedometer=速度表樣式
uv.ui.speedometer.desc=選擇要使用的速度表樣式。

uv.ui.speedometer.cust=自定義速度表
uv.ui.speedometer.cust.desc=自定義所選的速度表。

uv.ui.custhud=自定義 HUD
uv.ui.custhud.desc=自定義所選主 UI 的各個元素。

uv.ui.racertags=名字標籤
uv.ui.racertags.desc=競速：在其他參賽者頭頂顯示姓名標籤，包含其名稱與當前名次。\n\n追捕：在嫌疑人頭頂顯示姓名標籤，並在指揮官單位上方額外顯示一個姓名標籤。

uv.ui.racertags.thickness=描邊粗細
uv.ui.racertags.thickness.desc=名稱標籤描邊的粗細。\n\n設為 0 可禁用描邊。

uv.ui.racertags.distance=淡出距離
uv.ui.racertags.distance.desc=距離多遠時名稱標籤會完全淡出。\n\n以米為單位。

uv.ui.racertags.maxnr=同屏最大數量
uv.ui.racertags.maxnr.desc=同一時間最多在螢幕上顯示多少個名稱標籤。\n\n不影響指揮官單位的名稱標籤。

uv.ui.policescanner=警用掃描器
uv.ui.policescanner.desc=顯示一臺指向最近單位的警用掃描器。\n\n在非追捕狀態且單位已生成時可見，在追捕途中以及冷卻期間也可見。

uv.ui.policescanner.vehicle=對齊載具
uv.ui.policescanner.vehicle.desc=讓掃描器前端對齊載具的前進方向，而不是鏡頭朝向。

uv.ui.detection=顯示視覺偵測
uv.ui.detection.desc=顯示一個指示環，用來表示單位有多接近發現你。\n\n在非追捕狀態且單位已生成時可見，在追捕途中以及冷卻期間也可見。

uv.ui.preracepopup=賽前資訊
uv.ui.preracepopup.desc=比賽開始時顯示與比賽相關的資訊：圈數、檢查點數量與起跑位置。

uv.ui.subtitles=警用通訊字幕
uv.ui.subtitles.desc=顯示警用通訊的字幕。\n\n注意：僅對預設的警用通訊生效。\n\n僅支援英文。

uv.ui.vehnametakedown=擊倒時顯示載具名稱
uv.ui.vehnametakedown.desc=在單位擊倒時顯示載具名稱而非單位名稱。

uv.ui.unitstype=距離單位
uv.ui.unitstype.desc=選擇用於顯示距離的單位。
uv.ui.unitstype.meter=米
uv.ui.unitstype.feet=英尺
uv.ui.unitstype.yards=碼

uv.ui.deadzone=X 軸死區
uv.ui.deadzone.desc=將 UI 元素向螢幕中心靠攏。\n\n適用於超寬屏顯示器。

uv.ui.scale=X 軸縮放
uv.ui.scale.desc=對 UI 元素進行縮放（放大/縮小）。\n\n適用於超寬屏顯示器。

uv.ui.xaxis=X 軸
uv.ui.xaxis.desc=左右移動該 UI 元素。

uv.ui.yaxis=Y 軸
uv.ui.yaxis.desc=上下移動該 UI 元素。

