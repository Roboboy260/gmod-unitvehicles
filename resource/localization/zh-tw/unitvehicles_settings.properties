uv.audio.uvtrax.profile=UVTrax™ 配置
uv.audio.uvtrax.profile.desc=選擇 UVTrax™ 使用的類別。
uv.audio.uvtrax.freeroam=自由漫遊時啟用 UVTrax™
uv.audio.uvtrax.freeroam.desc=如果啟用，UVTrax™ 將在自由探索時播放。
uv.audio.uvtrax.pursuits=追捕場景下啟用 UVTrax™
uv.audio.uvtrax.pursuits.desc=啟用後，UVTrax™ 將在追捕（非比賽中）時替換追捕主題音樂。
uv.audio.uvtrax.shuffle=隨機播放 UVTrax™
