uv.keybind.prevsong=上一首
uv.keybind.prevsong.desc=播放上一首 UVTrax™ 歌曲。

uv.keybind.resetposition=重置位置
uv.keybind.resetposition.desc=將車輛重置到上一個檢查點。

uv.keybind.showresults=顯示比賽結果
uv.keybind.showresults.desc=比賽結束後顯示比賽結果。

uv.keybind.slot1=左槽位
uv.keybind.slot1.desc=啟用分配到槽位 1 的追擊科技。
uv.keybind.slot2=右槽位
uv.keybind.slot2.desc=啟用分配到槽位 2 的追擊科技。

uv.controls.anybutton=按下任意按鍵

uv.controls.controllermode=手柄適配模式
uv.controls.controllermode.enable=啟用手柄適配模式
uv.controls.controllermode.enable.desc=啟用後，部分操作會被更改或禁用：\n\n1. 結算介面中禁用滑鼠。\n2. 部分按鍵繫結會被調整：\n\n[+attack] = [+jump]\n[+attack2] = [+reload]

uv.controls.glyphs=按鍵圖示
uv.controls.glyphs.enable=覆蓋按鍵圖示
uv.controls.glyphs.enable.desc=允許在 UV 選單及部分 UV UI 元素上自定義按鍵提示圖示。\n\n注意：這不會修改任何按鍵繫結，僅改變顯示效果。

uv.controls.glyphs.uvkeybinds=UV 按鍵繫結

uv.controls.glyphs.action=操作
uv.controls.glyphs.action.desc=選擇要繫結圖示的操作。

uv.controls.glyphs.glyph=圖示
uv.controls.glyphs.glyph.desc=選擇要分配給該操作的圖示。

uv.controls.glyphs.active=已啟用
uv.controls.glyphs.active.desc=當前啟用的圖示列表。

#---------- 新版設定選單：鏡頭
uv.camera=鏡頭
uv.camera.actioncam=啟用動作鏡頭
uv.camera.actioncam.desc=啟用後，在特定事件中鏡頭會切換為戲劇化視角。\n\n單人遊戲中畫面可能會變慢。\n\n使用速度破壞器可阻止動作鏡頭觸發。

uv.camera.actioncam.wrecked=被損毀、被捕或被擊殺時
uv.camera.actioncam.wrecked.desc=當你被損毀、被捕或被擊殺時顯示戲劇化視角。

uv.camera.actioncam.racestart=比賽開始時
uv.camera.actioncam.racestart.desc=比賽開始時顯示戲劇化視角。

uv.camera.actioncam.racefinish=比賽結束時
uv.camera.actioncam.racefinish.desc=比賽結束時顯示戲劇化視角。\n\n生效期間，你的車輛將由 AI 駕駛。\n\n在單人遊戲中，你的車輛將暫時免疫碰撞與釘刺帶。

uv.camera.actioncam.crash=車輛發生碰撞時
uv.camera.actioncam.crash.desc=車輛發生碰撞時顯示戲劇化視角。
uv.camera.actioncam.crash.threshold=觸發所需傷害

uv.camera.actioncam.jump=騰空時
uv.camera.actioncam.jump.desc=飛躍跳臺時顯示戲劇化視角。
uv.camera.actioncam.jump.threshold=觸發所需高度

uv.camera.actioncam.spotted=追捕開始時
uv.camera.actioncam.spotted.desc=開始追捕時，被最近的單位發現將顯示戲劇化視角。

uv.camera.actioncam.roadblock=撞上路障時
uv.camera.actioncam.roadblock.desc=撞上路障時顯示戲劇化視角。
uv.camera.actioncam.roadblock.threshold=觸發所需速度

uv.camera.actioncam.takedown=擊倒時
uv.camera.actioncam.takedown.desc=擊倒車手或單位時顯示戲劇化視角。
uv.camera.actioncam.takedown.threshold=觸發所需距離

uv.camera.actioncam.pursuitbreaker=撞上追擊破壞點時
uv.camera.actioncam.pursuitbreaker.desc=撞上追擊破壞點時顯示戲劇化視角。\n\n生效期間，你的車輛將由 AI 駕駛。\n\n在單人遊戲中，你的車輛將暫時免疫碰撞與釘刺帶。

#---------- 新版設定選單：追捕設定
uv.pursuit=追捕設定

uv.pursuit.heatlevels=熱度等級
uv.pursuit.heatlevels.enable=啟用熱度等級
uv.pursuit.heatlevels.enable.desc=啟用熱度等級系統，當賞金達到特定閾值時提升熱度等級，從而增加單位數量、攻擊性和多樣性。
uv.pursuit.heatlevels.aiunits=AI 單位生成
uv.pursuit.heatlevels.aiunits.desc=主要的 AI 單位（巡邏、支援等）會在附近生成並加入追捕。\n\n犀牛單位與空中單位可透過“建立器：單位”工具啟用。

uv.pursuit.randomplayerunits=隨機玩家單位
uv.pursuit.randomplayerunits.desc=啟用後，玩家控制的單位將從可用單位中隨機選擇。
uv.pursuit.autohealth=無限耐久
uv.pursuit.autohealth.desc=讓嫌疑人車輛的耐久度不受限制，當你作為嫌疑人時耐久度是根據車輛的質量設定的。\n\n如果你不想繼續被撞壞，或者你想要更耐打的嫌疑人，可以設為啟用。
uv.pursuit.wheelsdetaching=車輪脫落
uv.pursuit.wheelsdetaching.desc=啟用後，損毀的車輛將會脫落車輪。
uv.pursuit.canexitvehicle=允許離開載具
uv.pursuit.canexitvehicle.desc=如果啟用，玩家可以在比賽和追捕途中離開載具。
uv.pursuit.repaircooldown=維修冷卻期
uv.pursuit.repaircooldown.desc=維修站多久才能使用一次。\n\n設為 0可使其變為一次性使用。
uv.pursuit.repairrange=維修距離
uv.pursuit.repairrange.desc=距離修理站的錘子單位數（在此距離內可修復你的車輛）。
uv.pursuit.noevade=永不逃避
uv.pursuit.noevade.desc=如果啟用，則永遠無法進入冷卻狀態。\n\n祝你好運！
uv.pursuit.bustedtime=逮捕時間
uv.pursuit.bustedtime.desc=嫌疑人被捕前的時間（秒）。\n\n設為 0以禁用。
uv.pursuit.respawntime=重生冷卻時間（單位）
uv.pursuit.respawntime.desc=玩家在單位車輛中重生前的時間（秒）。\n\n設為 0以禁用。
uv.pursuit.spikeduration=輪胎充氣時間
uv.pursuit.spikeduration.desc=被釘刺帶扎中的輪胎需要多長時間（秒）才能重新充氣。\n\n設為 0 可禁用輪胎重新充氣。

uv.pursuit.roadblocks=路障設定
uv.pursuit.roadblocks.maxnr=最大路障數量
uv.pursuit.roadblocks.maxnr.desc=每次最多載入多少路障。\n\n設為 0以禁用生成路障。

uv.pursuit.roadblocks.alwaysjoinpursuit=通過路障後加入追捕
uv.pursuit.roadblocks.alwaysjoinpursuit.desc=決定路障中的單位在嫌疑車輛通過後是否加入追捕：始終加入、從不加入，或由每個路障單獨決定。

uv.pursuit.roadblocks.alwaysjoinpursuit.off=禁用
uv.pursuit.roadblocks.alwaysjoinpursuit.always=始終加入
uv.pursuit.roadblocks.alwaysjoinpursuit.never=從不加入

uv.chatter=電臺播報
uv.chatter.enable=啟用電臺播報
uv.chatter.enable.desc=啟用 AI 單位與排程中心之間的語音通訊。

uv.response=呼叫增援
uv.response.enable=啟用呼叫增援
uv.response.enable.desc=AI單位將生成並自動響應地圖上的增援呼叫。
uv.response.speedlimit=速度上限（英里/小時）
uv.response.speedlimit.desc=空閒的 AI 單位會遵守此限速。\n\n巡邏中的 AI 單位會遵守 DV 路徑點上設定的限速。\n\n設為 0 可禁用。

#---------- 新版設定選單：追擊科技
uv.ptech=追擊科技
uv.ptech.racer=車手追擊科技
uv.ptech.racer.desc=啟用後，車手將自動裝備追擊科技。
uv.ptech.friendlyfire=車手友軍傷害
uv.ptech.friendlyfire.desc=啟用後，車手之間可以互相使用追擊科技。
uv.ptech.roadblockfriendlyfire=路障友軍傷害
uv.ptech.roadblockfriendlyfire.desc=啟用後，隨路障一同出現的釘刺帶也會影響單位。

#---------- 新版設定選單：追擊破壞點
uv.pb=追擊破壞點
uv.pb.maxnr=最大數量
uv.pb.maxnr.desc=同一時間最多能載入多少個追擊破壞點。\n\n設為 0 可禁用追擊破壞點生成。

uv.pb.cooldown=生成冷卻期
uv.pb.cooldown.desc=追擊破壞點消失並由新的接替所需的時間（秒）。

#---------- 新版設定選單：維修站
uv.rs=維修站
uv.rs.maxnr=最大數量
uv.rs.maxnr.desc=同一時間最多能載入多少個維修站。\n\n設為 0 可禁用維修站生成。

uv.rs.cooldown=生成冷卻
uv.rs.cooldown.desc=維修站消失並由新的接替所需的時間（秒）。

#---------- 新版設定選單：AI
uv.ai.title=AI 設定

uv.aidifficulty=AI 難度

uv.aidifficulty.racer=車手難度
uv.aidifficulty.racer.desc=選擇 AI 車手所需的難度等級。\n\n難度越高，所有 AI 對手的速度與過彎能力會逐漸提升。\n\n若在比賽中途更改，將在本場比賽結束後生效。\n\n不影響未參加比賽的 AI 車手，並在比賽結束後重置。
uv.aidifficulty.racer.rubberband=橡皮筋機制
uv.aidifficulty.racer.rubberband.desc=啟用後，落後太多的 AI 車手會逐漸獲得速度與抓地力加成，從而更快追上來。\n\n效果隨難度增強。\n\n追捕期間不生效。

uv.aidifficulty.racer.rubberbandrev=反向橡皮筋機制
uv.aidifficulty.racer.rubberbandrev.desc=啟用後，領先太多的 AI 車手速度會逐漸降低。\n\n效果隨領先距離增強。\n\n追捕期間不生效，也不適用於正在追趕前方玩家的 AI。

uv.aidifficulty.racer.rubberband.gap=觸發差距
uv.aidifficulty.racer.rubberband.gap.desc=AI 車手落後下一位玩家多遠時開始橡皮筋機制。
uv.aidifficulty.racer.rubberbandrev.gap.desc=AI 車手領先身後玩家多遠時開始反向橡皮筋機制。

uv.aidifficulty.racer.cautious=謹慎模式
uv.aidifficulty.racer.cautious.desc=啟用後，AI 車手會更加謹慎，更注意其他車手且攻擊性更低。
uv.aidifficulty.racer.cautiousrandomness=謹慎模式隨機化
uv.aidifficulty.racer.cautiousrandomness.desc=是否為 AI 車手隨機啟用謹慎模式。

uv.aidifficulty.unit=單位難度
uv.aidifficulty.unit.desc=選擇 AI 單位所需的難度等級。\n\n難度越高，所有 AI 單位的速度與過彎能力會逐漸提升。
uv.aidifficulty.unit.rubberband=允許追趕
uv.aidifficulty.unit.rubberband.desc=啟用後，AI 單位落後時會逐漸獲得速度與抓地力加成，從而更快追上。\n\n效果隨難度增強。

uv.ailogic=AI 邏輯

uv.ailogic.drivermodel=駕駛員模型
uv.ailogic.drivermodel.desc=AI 會依 NPC 類別生成對應的駕駛員模型。
uv.ailogic.optimizerespawn=最佳化重生
uv.ailogic.optimizerespawn.desc=單位將傳送到嫌犯的前方，而不是直接重生。\n\n提高效能。
uv.ailogic.trafficstreaming=交通流式載入
uv.ailogic.trafficstreaming.desc=交通車輛與巡邏單位在離玩家太遠時會消失，從而讓新的單位得以生成。\n\n影響效能。
uv.ailogic.relentless=無情追捕
uv.ailogic.relentless.desc=AI 單位會表現得更具攻擊性，就像《極品飛車：宿敵》裡的警察。\n\n他們會不顧自身安危來完成任務。
uv.ailogic.wrecking=啟用車輛損毀
uv.ailogic.wrecking.desc=AI 載具可以被徹底損毀。
uv.ailogic.detectionrange=偵測距離
uv.ailogic.detectionrange.desc=手動生成單位時，與車輛的最小生成距離（單位：錘子單位）。若生成單位時遇到問題，可使用更高數值。

uv.ailogic.headlights=啟用車頭燈
uv.ailogic.headlights.desc=AI 載具會開啟車頭燈。\n\n影響效能。
uv.ailogic.headlights.off=始終關閉
uv.ailogic.headlights.auto=自動
uv.ailogic.headlights.always=始終開啟

uv.ailogic.usenitrousracer=AI 車手氮氣加速
uv.ailogic.usenitrousracer.desc=允許 AI 車手使用氮氣加速。\n\n注意：僅適用於 Glide 載具。
uv.ailogic.usenitrousunit=AI單位氮氣加速
uv.ailogic.usenitrousunit.desc=允許AI單位使用氮氣加速。\n\n注：僅適用於 Glide 載具。

uv.ailogic.autohealthracer=AI 車手無限耐久
uv.ailogic.autohealthracer.desc=為 AI 車手提供無限的載具耐久。

uv.ailogic.customizeracer=自定義 AI 車手的載具
uv.ailogic.customizeracer.desc=AI 車手生成到載具中時會隨機應用顏色、皮膚與身體部件。\n\n注意：不適用於帶有基於部件損壞指令碼的 Glide 載具。

uv.ailogic.tractioncontrol=牽引力控制
uv.ailogic.tractioncontrol.desc=AI 車手與單位在失去抓地力時會降低油門。\n\n注意：僅適用於 Glide 與 Simfphys 載具。

uv.ailogic.disengageonheatchange=熱度變化時脫離
uv.ailogic.disengageonheatchange.desc=當熱度等級變化時，如果 AI 單位的車輛與所指定的任何車輛都不匹配，他們就會撤退。\n\n此過程不會消耗資源點。\n\n注意：不適用於手動生成的 AI 單位。

uv.ainav=AI 導航
uv.ainav.pathfind=尋路
uv.ainav.pathfind.desc=AI 將使用 A* 尋路演算法，透過導航網格或 Decent Vehicle 路徑點進行導航。\n\n影響效能。
uv.ainav.dvpriority=DV路徑點優先
uv.ainav.dvpriority.desc=如果可行，AI 會先嚐試透過 Decent Vehicle 路徑點導航，然後再透過導航網格導航。
uv.ainav.dvdistancebased=DV 路徑點距離判定
uv.ainav.dvdistancebased.desc=AI 在 Decent Vehicle 路徑點上將使用基於距離的方式進行導航。\n\n禁用 = 嫌疑人出現在視野內時直接追擊。\n\n啟用 = 距離嫌疑人太遠時透過路徑點導航。
uv.ainav.dvnavoptimized=最佳化 DV 導航
uv.ainav.dvnavoptimized.desc=啟用後，AI 將使用最佳化的尋路演算法在 DV 路徑點上導航。如果你的單位出現導航問題，請禁用此選項。\n\n在擁有大量路徑點的 InfMap 地圖上最為有用。\n\n<color=255,255,0>實驗性功能</color>


#---------- 新版設定選單：AI
uv.uvset.title=UV 設定

uv.ui.menu=UV 選單
uv.ui.menu.desc=透過更改顏色和功能來自定義 UV 選單外觀。

uv.ui.menu.hidedesc=強制隱藏說明
uv.ui.menu.hidedesc.desc=強制隱藏所有 UV 選單標籤頁中的說明區域，從而縮短選單寬度。\n\n需要重新載入選單實例後生效。

uv.ui.menu.hideprompts=強制隱藏提示
uv.ui.menu.hideprompts.desc=強制隱藏 UV 選單各標籤頁的操作提示。\n\n需要重新開啟選單後生效。

uv.ui.menu.openspeed=開啟速度
uv.ui.menu.openspeed.desc=選單開啟所需時間。\n\n以秒為單位。

uv.ui.menu.closespeed=關閉速度
uv.ui.menu.closespeed.desc=選單關閉所需時間。\n\n以秒為單位。

uv.ui.menu.custcol=自定義顏色
uv.ui.menu.custcol.desc=自定義 UV 選單的顏色。

uv.ui.dataimport=資料匯入
uv.ui.dataimport.desc=調整第一方與第三方資料的匯入方式。

uv.ui.dataimport.enableimport=啟用資料匯入
uv.ui.dataimport.enableimport.desc=啟用啟動時自動掃描新的 UV 資料。\n\n<color=255,100,100>警告</color>：根據你外掛中包含的資料量，可能會造成卡頓。

uv.ui.dataimport.enablereplace=啟用資料替換
uv.ui.dataimport.enablereplace.desc=啟用啟動時自動掃描被改動的 UV 資料。\n\n<color=255,100,100>警告</color>：根據你外掛中包含的資料量，可能會造成卡頓。

uv.ui.dataimport.scan=掃描新增與被改動的資料
uv.ui.dataimport.scan.desc=手動掃描新增與被改動的 UV 資料。\n\n<color=255,100,100>警告</color>：根據你外掛中包含的資料量，可能會造成卡頓。

uv.ui.dataimport.replaceserver=[伺服器] 檢視被改動的資料
uv.ui.dataimport.replaceserver.desc=開啟 UV 資料替換提示，允許管理員確認替換 UV 資料。\n\n<color=255,100,100>警告</color>：根據你外掛中包含的資料量，可能會造成卡頓。

uv.ui.dataimport.workshoppriority=工作坊優先
uv.ui.dataimport.workshoppriority.desc=如果啟用，工作坊內容將優先於本地內容。\n\n這樣即使你把工作坊外掛的檔案放在了本地資料夾中（其實你最好把它們刪掉），也能讓工作坊內容保持最新。\n如果你想改用/修改本地內容而不是工作坊內容，請禁用此選項。\n\n<color=255,255,0>注意</color>：更改此設定需要重新載入地圖！

#---------- 內建外掛
uv.vcmod.els=VCMod ELS 優先
uv.vcmod.els.desc=使用 HL2 載具基底的單位在兩者都安裝時，會優先使用 VCMod 的 ELS 而不是 Photon。

uv.lvs.alwaysfullthrottle=始終全油門
uv.lvs.alwaysfullthrottle.desc=無需按住油門修飾鍵即可使用全油門。


#---------- 新版設定選單：除錯
uv.debug=除錯選單

uv.debug.warning=正在進入除錯選單
uv.debug.warning.desc=你即將進入單位載具的除錯選單。\n\n這些內容並非面向公眾，但可用於測試某些元素與功能，以確認它們能否正常工作。\n\n請注意，這些功能面向開發者與貢獻者，普通使用者就功能（包括報錯）提出的任何抱怨都將被無視。\n\n你確定要繼續嗎？

uv.debug.confirm=確認並繼續
uv.debug.cancel=取消並返回

uv.debug.raceresults=模擬比賽結果 - %s 名車手

uv.debug.pursuitresults.racer=模擬追捕結果（車手）
uv.debug.pursuitresults.units=模擬追捕結果（單位）
uv.debug.pursuitresults.escaped=逃脫
uv.debug.pursuitresults.busted=被捕

uv.debug.infraction=%s 項模擬違法行為
