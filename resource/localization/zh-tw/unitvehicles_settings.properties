uv.audio.pursuit.desc=開關追捕時的音樂。
uv.audio.pursuit.sfx=追捕音效
uv.audio.pursuit.sfx.desc=追捕過程中播放相關音效。
uv.audio.pursuittheme=追捕主題曲
uv.audio.pursuittheme.desc=選擇追捕主題音樂所使用的類別。
uv.audio.pursuitpriority=比賽中的追捕主題音樂
uv.audio.pursuitpriority.desc=啟用後，當比賽中發生追捕時，追捕主題音樂將替換 UVTrax™。
uv.audio.pursuittheme.random=隨機熱度等級主題曲
uv.audio.pursuittheme.random.desc=從你選擇的追捕主題曲中抽取並播放熱度等級主題曲。
uv.audio.pursuittheme.random.type=隨機模式
uv.audio.pursuittheme.random.type.desc=順序：隨機歌曲依次播放。\n\n每 X 分鐘：歌曲將每隔 X 分鐘隨機切換一次。
uv.audio.pursuittheme.random.minutes=每 X 分鐘
uv.audio.pursuittheme.random.minutes.desc=歌曲主題切換的時間間隔（分鐘）。\n\n需要將“隨機模式”設定為“每 X 分鐘”。

uv.audio.pursuittheme.random.type.sequential=順序

uv.audio.racing=賽事
uv.audio.racing.sfx=賽事音效
uv.audio.racing.sfx.desc=選擇競速音效所使用的音效分類。

uv.audio.menu.sfx=選單音效
uv.audio.menu.sfx.desc=在瀏覽 UV 選單時播放音效。
uv.audio.menu.sfx.profile=選單音效配置
uv.audio.menu.sfx.profile.desc=選擇選單音效所使用的音效分類。

