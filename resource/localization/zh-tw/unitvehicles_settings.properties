uv.audio.volume=音樂音量
uv.audio.volume.desc=設定播放時的音量大小。
uv.audio.copchatter=警用通訊
uv.audio.copchatter.desc=設定單位語音的播放音量。
uv.audio.mutecp=禁用檢查點音效
uv.audio.mutecp.desc=在比賽中禁用經過檢查點的音效。

uv.audio.uvtrax=UVTrax™
uv.audio.uvtrax.enable=啟用 UVTrax™
