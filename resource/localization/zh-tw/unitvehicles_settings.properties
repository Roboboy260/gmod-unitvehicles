uv.tm=交通管理器

uv.tm.clear=清除當前交通載具
uv.tm.clear.desc=移除所有當前生成的交通載具。

uv.tm.override.desc=交通載具將優先從下方列表選擇載具，而不是從資料庫中隨機選擇。

#---------- 新版設定選單：AI 車手管理器
uv.airacer=AI 車手管理器

uv.airacer.spawnai=生成 AI 車手
uv.airacer.spawnai.desc=生成一名隨機 AI 車手。

uv.airacer.spawnai.val=生成 %s 名 AI 車手
uv.airacer.spawnai.val.desc=生成指定數量的 AI。\n\n警告：生成過多 AI 可能導致遊戲卡頓或短暫無響應。

uv.airacer.clear=清除當前 AI 車手
uv.airacer.clear.desc=移除所有當前生成的 AI 車手。

uv.airacer.override=載具覆蓋
uv.airacer.override.desc=AI 車手將優先從下方列表中選擇載具，而不是從資料庫中隨機挑選。

uv.airacer.overridelist=已分配載具：%s
uv.airacer.overridelist.desc=右鍵點選載具將其加入列表。\n\n再次右鍵點選可將其移除。
uv.airacer.overridelist.hover=右鍵點選載具將其加入列表。\n再次右鍵點選可將其移除。

#---------- 新版設定選單：外掛
uv.addons=附加元件

uv.addons.builtin=內建附加元件
uv.addons.builtin.desc=隨 Unit Vehicles 一同提供的附加元件。

uv.addons.extern=第三方附加元件
uv.addons.extern.desc=透過工作坊下載或安裝於 addons 資料夾中的元件。
uv.addons.none=未找到任何元件。

