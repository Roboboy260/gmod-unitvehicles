uv.audio.uvtrax.editor=UVTrax™ 播放列表管理器
uv.audio.uvtrax.editor.desc=建立並管理自定義播放列表：新增/移除曲目，並設定每個播放列表允許播放的曲目。

uv.audio.uvtrax.profiles=配置檔案
uv.audio.uvtrax.profiles.desc=為每個 UVTrax™ 配置檔案切換可播放的曲目。
uv.audio.uvtrax.profiles.loaded=當前配置檔案已載入曲目數量 / 總曲目數量。

uv.audio.uvtrax.tracks=曲目列表

uv.audio.pursuit=追捕
