uv.ft=首次設定

uv.ft.title=歡迎使用單位載具！
uv.ft.desc=單位載具是一款面向沙盒模式的外掛，讓你無論是在多人遊戲中與其他玩家一起，還是在單人遊戲中與 AI 一起，都能扮演警察或與警察對抗，展開高速追捕，並在任意地圖上體驗刺激的競速。\n\n本次首次設定將介紹各項設定，幫助你獲得最佳遊戲體驗。

uv.ft.preset.title=選擇預設
uv.ft.preset.desc=單位載具讓你可以與 AI 或玩家控制的單位一起進行追捕。你可以調整所有變數，例如單位數量、增援到達所需時間，以及是否允許空中單位和路障生成。\n\n請選擇一個熱度等級預設以繼續。
uv.ft.preset.desc2=你可以在 [string:uv.pm] -- [string:uv.hm] 中找到這些設定。

uv.ft.bases=載具框架
uv.ft.bases.desc=單位載具支援多種載具框架。不過，AI 只能使用一種預先選定的載具框架生成。\n\n請確認你希望 AI 使用哪種載具框架。

uv.ft.bases.units=單位載具框架
uv.ft.bases.airacer=AI 車手載具框架
uv.ft.bases.traffic=交通載具框架

uv.ft.general.desc=單位載具提供了大量可自定義設定。\n\n請檢視各項設定，例如選擇你喜歡的 HUD 型別、UVTrax™ 配置以及其他各種選項。

uv.ft.racing.desc=單位載具讓你可以在玩家建立的環形賽道和衝刺賽道上，與其他玩家和 AI 車手同場競速。\n\n請檢視你的競速設定。
uv.ft.racing.desc2=載入賽道後，你可以在 [string:uv.rm] -- [string:uv.rm.options] 中找到這些設定。

uv.ft.racing.ai.title=與 AI 競速
uv.ft.racing.ai.desc=你可以與 AI 對手一起競速，實現方式有兩種：
uv.ft.racing.ai.desc2=1) 勾選下方的 [string:uv.airacer.override] 按鈕，然後用 [+attack2] 選擇你希望 AI 生成的載具。\n2) 保持不勾選，並使用 [string:tool.uvracermanager.name] 工具手動建立 AI 可用的載具。\n\n你可以在 [string:uv.airacer] 中找到該設定。

uv.ft.end.title=完成
uv.ft.end.desc=就這樣！\n\n現在你可以去任意你能想到的地圖上，體驗高速追捕與刺激的競速了！
uv.ft.end.desc2=如果你還有其他問題，可以檢視 [string:uv.faq]。\n\n如果你發現 bug 或故障，或需要 [string:uv.faq] 中未提及的幫助，歡迎到我們的 Discord 伺服器找我們！

uv.ft.next=下一步
uv.ft.prev=上一步
uv.ft.finish=完成

uv.ft.force=重新啟用首次設定
uv.ft.force.desc=如果啟用，下次開啟 UV 選單時會再次進入首次設定。

uv.ft.skip=跳過（不推薦）

#---------- 新版設定選單：賽事管理器
uv.rm=賽事管理

uv.rm.startrace=開始賽事
uv.rm.startrace.desc=使用當前受邀的車手與 AI 開始比賽。

uv.rm.stoprace=停止賽事
uv.rm.cancelrace=取消比賽

uv.rm.sendinvite=邀請車手

uv.rm.loadrace=載入賽道
uv.rm.changerace=更換賽道

uv.rm.author=作者：%s
uv.rm.checkpoints=檢查點數量：%s
uv.rm.startslots=起跑位：%s

uv.rm.hasprops=道具：%s
uv.rm.hasnodes=路徑節點：%s

uv.rm.options=賽事選項
uv.rm.options.laps=圈數
uv.rm.options.laps.desc=比賽使用的圈數。\n\n若為點對點或直線加速賽，請設為 1。
uv.rm.options.dnftimer=未完成比賽計時器
uv.rm.options.dnftimer.desc=當第一位參賽者越過終點線時開始計時；計時歸零時比賽自動結束，並取消所有尚未越過終點線的車手的參賽資格。\n\n設為 0 可禁用。
uv.rm.options.visiblecheckpoints=顯示檢查點
uv.rm.options.visiblecheckpoints.desc=比賽中是否對玩家顯示檢查點。
uv.rm.options.legacyspawn=舊版生成方式
uv.rm.options.legacyspawn.desc=如果啟用，將使用舊版生成方式。\n\n舊版方式會為每位車手重新建立載具並放置到起跑位上，因此比新方式慢得多。\n\n只有在你使用某些載具框架、且它們在起跑位上的擺放出現問題時，才應啟用。

uv.rm.options.pursuitstart=自動開始追捕
uv.rm.options.pursuitstart.desc=比賽開始後多少秒自動啟動追捕。\n\n設為 0 可禁用。

uv.rm.options.pursuitclear=比賽結束後自動結束追捕
uv.rm.options.pursuitclear.desc=比賽結束時自動結束追捕。
uv.rm.options.pursuitclear.ai=同時移除 AI 單位
uv.rm.options.pursuitclear.ai.desc=同時移除當前存在的所有 AI 單位。

uv.rm.options.clearai=比賽結束後移除 AI 車手
uv.rm.options.clearai.desc=比賽結束時自動移除所有 AI 車手及其載具。

uv.rm.options.rubberband.pursuits=在追捕中也生效
uv.rm.options.rubberband.pursuits.desc=啟用後，加速效果在追捕期間也會生效。

uv.rm.startrace.addai=新增 %s 名 AI 並開始比賽
uv.rm.startrace.addai.desc=生成指定數量的 AI，自動邀請並開始比賽。\n\n警告：生成大量 AI 可能導致遊戲卡頓。
uv.rm.startrace.fillai=填充起跑位並開始比賽
uv.rm.startrace.fillai.desc=生成 %s 名 AI 並自動邀請後開始比賽。\n\n警告：生成大量 AI 可能導致遊戲卡頓。

#---------- 新版設定選單：追捕管理器
uv.pm=追捕管理

uv.pm.spawnas=以單位進行生成
uv.pm.spawnas.desc=開啟單位選擇選單，允許你選擇一個單位，加入對逃逸嫌疑人的追捕行動。

uv.pm.spawnai=生成 AI 單位
uv.pm.spawnai.desc=生成一個隨機的 AI 單位。

uv.pm.spawnai.val=生成 %s 個 AI 單位
uv.pm.spawnai.val.desc=生成指定數量的 AI 單位。\n\n警告：生成大量 AI 可能會導致遊戲卡頓或短暫無響應。

uv.pm.clearai=清除所有活動中的 AI 單位
uv.pm.clearai.desc=移除當前場景中所有正在活動的 AI 單位。

uv.pm.pursuit.toggle=切換追捕狀態
uv.pm.pursuit.toggle.desc=若未進行追捕則開始追捕。\n\n若正在追捕則停止。

uv.pm.pursuit.start=強制開始追捕
uv.pm.pursuit.stop=強制停止追捕

uv.pm.heatlevel=設定熱度等級
uv.pm.heatlevel.desc=應用後，將當前熱度等級設為指定值。

uv.pm.misc=雜項
uv.pm.clearbounty=清除賞金
uv.pm.clearbounty.desc=將賞金重置為 0。
uv.pm.wantedtable=列印“通緝名單”到控制檯中

#---------- 新版設定選單：熱度等級管理器
uv.hm=熱度等級管理器
uv.hm.open=開啟熱度等級管理器
uv.hm.open.desc=開啟熱度等級管理器，你可以在這裡調整所有與熱度等級、追捕單位、懸賞系統等相關的設定。

uv.hm.presets=預設
uv.hm.presets.warning=警告
uv.hm.presets.confirm=此操作將覆蓋你當前的所有設定。\n該操作無法撤銷。\n你確定要載入預設“%s”嗎？

uv.hm.presets.presetname=預設名稱 - 在預設上按 [+attack2] 可貼上到此處
uv.hm.presets.presetname.require=必須填寫預設名稱！

uv.hm.presets.save=儲存預設
uv.hm.presets.save.desc=使用指定的名稱和當前選中的設定儲存一個預設。

uv.hm.presets.delete=刪除預設
uv.hm.presets.delete.desc=刪除最近一次使用 [+attack2] 選中的預設。

uv.hm.presets.export=匯出當前設定為工作坊外掛
uv.hm.presets.export.desc=將當前設定匯出為相容工作坊的檔案。\n\n請檢視聊天視窗以獲取具體路徑。

uv.hm.lvl=熱度等級 %s

uv.hm.timedhl=定時熱度等級
uv.hm.timedhl.desc=如果啟用，熱度等級將隨著時間的推移而增加，而不是依賴於賞金金額。

uv.hm.minhl=最小熱度等級
uv.hm.minhl.desc=設定你在追捕中可以達到的最低熱度等級。等級越高，單位越具攻擊性。

uv.hm.maxhl=最大熱度等級
uv.hm.maxhl.desc=設定你在追捕中可以達到的最高熱度等級。等級越低，單位攻擊性越弱。

uv.hm.enablept=單位可在生成時攜帶追擊科技
uv.hm.enablept.desc=允許單位在生成時攜帶追擊科技。\n\n無論此選項是否啟用，巡邏單位和支援單位都不會生成追擊科技。

uv.hm.pt.spawnwith=允許追擊科技
uv.hm.pt.spawnwith.desc=啟用後，AI 單位和玩家控制的單位在生成時可攜帶並使用該追擊科技。
uv.hm.pt.spawnwith.desc.air=啟用後，空中單位可使用該追擊科技。

uv.hm.commander=指揮官設定
uv.hm.commander.solo=一位指揮官
uv.hm.commander.solo.desc=如果啟用，將只會有一個指揮官單位被派往追捕。\n\n當指揮官單位處於活動狀態時，將會有無限的後備單位。

uv.hm.commander.health=指揮官生命值
uv.hm.commander.health.desc=指揮官單位有多少生命值。\n如果對於你來說太簡單了就再增大一些吧！

uv.hm.commander.canrepair=指揮官可以維修嗎？
uv.hm.commander.canrepair.desc=如果啟用，指揮官單位可以使用維修站或維修套件追擊科技修復自己的載具。\n\n如果禁用，他們仍然可以使用維修站或維修套件修補爆胎。

uv.hm.air=空中單位設定
uv.hm.air.model=單位模型
uv.hm.air.model.desc=空中單位應該用什麼模型。

uv.hm.air.canbust=可逮捕車手
uv.hm.air.canbust.desc=如果啟用，空中單位可以透過在車手附近飛行來逮捕他們。

uv.hm.air.pt.exp=允許使用爆炸桶
uv.hm.air.pt.spikes=允許使用釘刺帶
uv.hm.air.pt.skyhammer=允許天錘
uv.hm.air.pt.desc=如果啟用，空中單位可以使用該追擊科技。\n\n若未啟用“允許追擊科技”，此選項將不起作用。

uv.hm.air.fuel.min=最短滯空時間
uv.hm.air.fuel.min.desc=空中單位耗盡燃料並退出追捕前的最短滯空時間。\n\n設為 0 可禁用燃料限制。
uv.hm.air.fuel.max=最長滯空時間
uv.hm.air.fuel.max.desc=空中單位耗盡燃料並退出追捕前的最長滯空時間。

uv.hm.air.cooldown=冷卻時間
uv.hm.air.cooldown.desc=空中單位被移除後，需要等待多久才能重新生成。\n\n設為 0 可禁用冷卻。

uv.hm.disablebounty=癱瘓單位獲得賞金
uv.hm.disablebounty.desc=癱瘓該型別單位時你能獲得多少賞金。

uv.hm.dm=駕駛員模型
uv.hm.dm.desc=選擇該 AI 單位使用的駕駛員模型。

uv.hm.vp=語音配置檔案
uv.hm.vp.desc=選擇該 AI 單位所使用的語音配置組。
uv.hm.vp.dispatch.desc=選擇排程系統所使用的語音配置組。
uv.hm.vp.misc.desc=選擇用於其他雜項音效的語音配置組。

uv.hm.heat=熱度等級設定

uv.hm.heat.bounty.10s=每 10 秒獲得的賞金
uv.hm.heat.bounty.10s.desc=你每10秒賺多少賞金。

uv.hm.heat.heatlvl.time=熱度時間
uv.hm.heat.heatlvl.time.desc=在提升熱度等級前所需的時間。\n\n若未啟用“計時熱度等級”，則無效。

uv.hm.heat.minbounty=最低賞金
uv.hm.heat.minbounty.desc=達到這個熱度需要多少賞金？\n\n不要與其他熱度等級重疊！\n\n如果啟用“定時熱度等級”，則不執行任何操作。

uv.hm.heat.maxunits=最大單位數
uv.hm.heat.maxunits.desc=同一時間最多能有多少個單位追捕你？\n\n數值越高越影響效能。

uv.hm.heat.avaunits=可排程單位
uv.hm.heat.avaunits.desc=在需要申請支援前，可以生成多少個單位進行追捕？

uv.hm.heat.backuptime=支援計時器
uv.hm.heat.backuptime.desc=支援單位多久才能加入追捕。

uv.hm.heat.bustspeed=逮捕速度（英里/小時）
uv.hm.heat.bustspeed.desc=駕駛員需保持此速度行駛，方可避免遭到攔截。

uv.hm.heat.cooldowntime=冷卻計時器
uv.hm.heat.cooldowntime.desc=你需要在冷卻中度過多長時間才能成功逃脫。

uv.hm.heat.roadblocks=啟用路障
uv.hm.heat.roadblocks.desc=如果啟用，路障可以在這個熱度等級下生成。

uv.hm.heat.helicopter=啟用空中單位
uv.hm.heat.helicopter.desc=如果啟用，空中單位可以在此熱度等級下生成。\n\n請留意天空，並尋找帶頭頂掩護的位置！

uv.hm.units=單位
uv.hm.units.desc=選擇在追捕中於該槽位出現的單位。

uv.hm.units.selected=已選單位
uv.hm.units.selected.desc=在追捕中將出現在該槽位的單位。

uv.hm.units.spawnchance=生成機率
uv.hm.units.spawnchance.desc=該單位在所選熱度等級中生成的機率。

uv.hm.units.limit=生成上限
uv.hm.units.limit.desc=該型別的單位最多能有多少個參與追捕。\n\n設為 0 表示不限制。\n\n設為 -1 表示只出現在路障中。
uv.hm.units.limit.helicopter.desc=最多可以有多少個空中單位參與追捕。

uv.hm.units.override=使用基礎載具
uv.hm.units.override.desc=單位將優先從下方列表選擇載具，而不是從資料庫中隨機選擇。

